      (left < 0 ? '免期已超 ' + Math.abs(left) + ' 天' : '免期剩 ' + left + ' 天') + '</span>' +
      (doc.missingDue.length ? '<span class="tag tag--red">到期缺 ' + doc.missingDue.length + ' 单证</span>' : '<span class="tag tag--green">到期单证齐</span>') +
      '</div>' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
      '<div><div class="sec-t">航线</div><div class="kv">' +
      '<dt>起运港</dt><dd>' + A.C.PORTS[x.lane.from].code + ' · ' + A.C.PORTS[x.lane.from].name + '</dd>' +
      '<dt>卸货港</dt><dd>' + A.C.PORTS[x.lane.to].code + ' · ' + A.C.PORTS[x.lane.to].name + '</dd>' +
      '<dt>路径</dt><dd>' + (lane.name || '') + '</dd>' +
      '<dt>海上天数</dt><dd>' + lane.days + ' 天</dd>' +
      '</div></div>' +
      '<div><div class="sec-t">时间</div><div class="kv">' +
      '<dt>开船 ETD</dt><dd>' + x.etd + '</dd>' +
      '<dt>冻结 ETA</dt><dd>' + x.eta + '</dd>' +
      '<dt>最新预测</dt><dd style="color:' + (dt.diff(x.eta, x.freezeEta) ? 'var(--amber)' : 'var(--txt)') + '">' + x.freezeEta + '</dd>' +
      '<dt>实际到港</dt><dd>' + (x.actualEta || '—') + '</dd>' +
      '</div></div></div>' +

      '<div><div class="sec-t">流程 <span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0">' +
      STAGES[idx].id + ' ' + STAGES[idx].short + '</span></div><div class="tl">' + tl + '</div></div>' +

      '<div><div class="sec-t">单证与回执 <span class="sp"></span>' +
      '<span class="muted" style="text-transform:none;letter-spacing:0">到期 ' + doc.have + '/' + doc.due + ' · 可点选补录</span></div>' +
      '<div class="chk">' + docs + '</div></div>' +

      '<div><div class="sec-t">费用临界</div>' +
      '<div class="kv" style="font-size:11.5px">' +
      '<dt>免箱 / 免仓期</dt><dd>' + x.freeDays + ' 天（自到港日计）</dd>' +
      '<dt>免期到期日</dt><dd style="color:' + (left < 0 ? 'var(--red)' : left <= 2 ? 'var(--amber)' : 'var(--txt)') + '">' + dt.add(etaOf(x), x.freeDays) + '</dd>' +
      '<dt>滞箱费率</dt><dd>' + fmt.usd(x.demurragePerDay) + ' / 天 / 柜</dd>' +
      '<dt>若明日仍未提</dt><dd style="color:' + (left - 1 < 0 ? 'var(--red)' : 'var(--txt)') + '">' + (left - 1 < 0 ? '将产生 ' + fmt.usd(x.demurragePerDay) + '／天' : '仍在免期内') + '</dd>' +
      '<dt>货值（估算）</dt><dd>' + fmt.usd(x.valueUsd) + '</dd>' +
      '</div></div>' +

      '<div style="display:flex;gap:8px;padding:10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-soft)">' +
      '<span class="dot dot--' + (doc.missingDue.length ? 'amber' : 'green') + '" style="margin-top:2px"></span>' +
      '<div style="font-size:11px;line-height:1.55;color:var(--txt-2)">' +
      (doc.missingDue.length
        ? '到期缺失：<b>' + doc.missingDueNames.join('、') + '</b>。到港通知不能代替任何放行；缺件时先进异常，不排提柜。'
        : '本环节到期单证齐备。仍须逐项核监管放行、船方放货与场站可提，三项缺一不派车。') +
      '</div></div>' +
      '</div>' +
      '<div class="drawer-f">' +
      (idx > 0 ? '<button class="btn btn--sm btn--ghost" data-x="back">退回 ' + STAGES[idx - 1].id + '</button>' : '') +
      '<span class="sp"></span>' +
      (idx < STAGES.length - 1 ? '<button class="btn btn--prime btn--sm" data-x="next">推进到 ' + STAGES[idx + 1].id + ' · ' + STAGES[idx + 1].short + '</button>'
        : '<button class="btn btn--sm" disabled>已入仓</button>') +
      '</div>';

    A.drawer.open(html, {
      onMount: function (d) {
        d.querySelector('[data-x="close"]').addEventListener('click', function () { A.drawer.close(); markSel(null); });
        const nx = d.querySelector('[data-x="next"]');
        if (nx) nx.addEventListener('click', function () { advance(x.id, 1); });
        const bk = d.querySelector('[data-x="back"]');
        if (bk) bk.addEventListener('click', function () { advance(x.id, -1); });
        d.querySelectorAll('[data-doc]').forEach(function (n) {
          n.addEventListener('click', function () {
            const x2 = A.app.state.ocean.find((y) => y.id === x.id);
            const id2 = n.dataset.doc;
            x2.docList[id2] = !x2.docList[id2];
            x2.missing = A.C.DOCS.filter((dd) => !x2.docList[dd.id]).map((dd) => dd.id);
            x2.docPct = (A.C.DOCS.length - x2.missing.length) / A.C.DOCS.length;
            A.store.set({ ocean: A.app.state.ocean });
            A.drawer.close();
            openDrawer(x.id);
          });
        });
      }
    });
  }

  function stageDesc(id, x) {
    if (id === 'S01') return '核贸易术语、进口人、港口、指定仓与费用；截单截货时点各留回执。';
    if (id === 'S02') return '按 SN 关联件号与实测包装；记录箱封、VGM、ISF 与实际船名航次。';
    if (id === 'S03') return '按提单查到货通知与监管状态；普通提离三项缺一不派车。';
    if (id === 'S04') return '整柜取 EIR 并还空；拼箱凭分单提已拆齐件；仓按 ASN 逐 SN 签收。';
    return '已验合格台进入可用库存；缺损台隔离并交异常负责人。';
  }

  function markSel(id) {
    A.app.state.ui.oceanSel = id;
    A.store.emit();
  }

  function advance(id, dir) {
    const s = A.app.state;
    const x = s.ocean.find((y) => y.id === id);
    if (!x) return;
    const idx = stageIdx(x.stage);
    const ni = idx + dir;
    if (ni < 0 || ni >= STAGES.length) return;
    if (dir > 0) {
      const need = x.stage === 'S03' ? ['arrival', 'release'] : x.stage === 'S04' ? ['asn', 'eir'] : [];
      const missing = need.filter((k) => !x.docList[k]);
      if (missing.length) {
        if (!confirm('缺少：' + missing.map((m) => (A.C.DOCS.find((d) => d.id === m) || {}).name).join('、') +
          '\n\n现实作业中应先补证。仍要强制推进吗？（会记入异常备注）')) return;
        x.note = (x.note ? x.note + '；' : '') + '缺证强制推进 ' + STAGES[ni].id;
      }
      if (x.stage === 'S02' && !x.actualEta) x.actualEta = dt.add(x.freezeEta, 0);
      if (x.stage === 'S03' && !x.docList.eir) x.docList.eir = true;
      if (STAGES[ni].id === 'S04') { x.docList.arrival = true; x.docList.release = true; }
      if (STAGES[ni].id === 'REC') { x.docList.asn = true; x.docList.eir = true; }
    }
    x.stage = STAGES[ni].id;
    x.missing = A.C.DOCS.filter((d) => !x.docList[d.id]).map((d) => d.id);
    x.docPct = (A.C.DOCS.length - x.missing.length) / A.C.DOCS.length;
    A.store.set({ ocean: s.ocean });
    A.toast(x.id + ' → ' + STAGES[ni].id + ' ' + STAGES[ni].short, STAGES[ni].tone === 'green' ? 'green' : 'teal');
    if (A.drawer.isOpen()) { A.drawer.close(); setTimeout(() => openDrawer(id), 260); }
  }

  /* ── view ────────────────────────────────────────────────────────── */
  A.registerView('ocean', {
    title: '海运在途看板',
    sub: 'S01 订舱 → S02 海上 → S03 到港 → S04 提柜 → 入仓交班 · 支持拖拽推进',

    mount: function (host, s) {
      host.innerHTML =
        '<div class="ocean-shell">' +
        '<div class="ocean-bar" id="oceanBar"></div>' +
        '<div class="ocean-kpis" id="oceanKpis"></div>' +
        '<div style="flex:1;min-height:0;display:flex;flex-direction:column">' +
        '<div class="kanban" id="kanban"></div>' +
        '</div>' +
        '<div style="flex:none;padding:0 14px 12px"><div class="card"><div class="card-h" style="padding:8px 12px">' +
        '<h3 style="font-size:11.5px">到港与免期窗口 <span class="k">未来 24 天</span></h3><span class="sp"></span>' +
        '<div class="row row--tight"><span class="legend-row"><i class="sw" style="background:var(--blue)"></i>在免期内</span>' +
        '<span class="legend-row" style="margin-left:8px"><i class="sw" style="background:var(--amber)"></i>≤2 天</span>' +
        '<span class="legend-row" style="margin-left:8px"><i class="sw" style="background:var(--red)"></i>已超期</span></div></div>' +
        '<div class="card-b card-b--tight" id="oceanGantt" style="height:126px;overflow:hidden"></div></div></div>' +
        '</div>';

      const kb = document.getElementById('kanban');
      let dragId = null;
      kb.addEventListener('dragstart', function (e) {
        const c = e.target.closest('.kcard');
        if (!c) return;
        dragId = c.dataset.id;
        c.classList.add('is-drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (x) { }
      });
      kb.addEventListener('dragend', function (e) {
        const c = e.target.closest('.kcard');
        if (c) c.classList.remove('is-drag');
        document.querySelectorAll('.kcol').forEach((k) => k.classList.remove('is-over'));
      });
      kb.addEventListener('dragover', function (e) {
        const col = e.target.closest('.kcol');
        if (!col || !dragId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.kcol').forEach((k) => k.classList.toggle('is-over', k === col));
      });
      kb.addEventListener('drop', function (e) {
        const col = e.target.closest('.kcol');
        if (!col || !dragId) return;
        e.preventDefault();
        const target = col.dataset.stage;
        const st = A.app.state;
        const x = st.ocean.find((y) => y.id === dragId);
        if (!x) return;
        const cur = stageIdx(x.stage), to = stageIdx(target);
        if (to === cur) { col.classList.remove('is-over'); dragId = null; return; }
        if (Math.abs(to - cur) > 1) {
          A.toast('只能逐环节推进；跳过环节会丢失回执', 'red');
        } else {
          advance(dragId, to > cur ? 1 : -1);
        }
        col.classList.remove('is-over');
        dragId = null;
      });
      kb.addEventListener('click', function (e) {
        const c = e.target.closest('.kcard');
        if (!c) return;
        A.app.state.ui.oceanSel = c.dataset.id;
        openDrawer(c.dataset.id);
      });

      const bar = document.getElementById('oceanBar');
      bar.addEventListener('click', function (e) {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const st = A.app.state;
        if (t.dataset.act === 'stage') { st.ui.oceanFilter = t.dataset.v; A.store.emit(); }
        else if (t.dataset.act === 'missing') { st.ui.oceanMissing = !st.ui.oceanMissing; A.store.emit(); }
        else if (t.dataset.act === 'export') exportCsv(st);
      });
      bar.addEventListener('change', function (e) {
        if (e.target.id === 'oceanPort') { A.app.state.ui.oceanPort = e.target.value; A.store.emit(); }
      });
      bar.addEventListener('input', function (e) {
        if (e.target.id === 'oceanSearch') { A.app.state.ui.oceanQ = e.target.value; A.store.emit(); }
      });
    },

    update: function (s, params) {
      if (params && params.port) s.ui.oceanPort = params.port;
      const st = s.ui;
      const k = kpis(s);

      /* bar */
      const counts = {};
      STAGES.forEach(function (x) { counts[x.id] = s.ocean.filter((y) => y.stage === x.id).length; });
      document.getElementById('oceanBar').innerHTML =
        '<div class="seg">' +
        '<button data-act="stage" data-v="ALL" aria-pressed="' + (st.oceanFilter === 'ALL' || !st.oceanFilter) + '">全部 <span class="n">' + s.ocean.length + '</span></button>' +
        STAGES.map(function (x) {
          return '<button data-act="stage" data-v="' + x.id + '" aria-pressed="' + (st.oceanFilter === x.id) + '">' + x.short + ' <span class="n">' + counts[x.id] + '</span></button>';
        }).join('') + '</div>' +
        '<select class="select" id="oceanPort" style="width:auto">' +
        '<option value="ALL">全部目的港</option>' +
        Object.keys(A.C.PORTS).filter((p) => !A.C.PORTS[p].cn).map(function (p) {
          return '<option value="' + p + '"' + (st.oceanPort === p ? ' selected' : '') + '>' + p + ' · ' + A.C.PORTS[p].name + '</option>';
        }).join('') + '</select>' +
        '<button class="pill' + (st.oceanMissing ? ' is-on' : '') + '" data-act="missing">只看缺单证</button>' +
        '<div class="search" style="margin-left:auto;width:190px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>' +
        '<input class="input" id="oceanSearch" placeholder="箱号 / 船名" value="' + A.esc(st.oceanQ || '') + '"></div>' +
        '<button class="btn btn--sm" data-act="export">导出 CSV</button>';

      /* kpis */
      document.getElementById('oceanKpis').innerHTML =
        kpi('未入仓航次', k.boxes, '个', 'var(--blue)', '含已到港待提') +
        kpi('海上台数', fmt.n(k.sea), '台', 'var(--teal)', 'S02 在途') +
        kpi('到港待提', fmt.n(k.wait), '台', 'var(--violet)', 'S03 / S04 已靠港') +
        kpi('免期告警', k.demo.length, '航次', k.demo.length ? 'var(--red)' : 'var(--green)', '≤2 天或已超期') +
        kpi('缺项单证', k.missDocs, '份', k.missDocs ? 'var(--amber)' : 'var(--green)', '本环节到期未回执');

      /* columns */
      const q = (st.oceanQ || '').trim().toLowerCase();
      const list = s.ocean.filter(function (x) {
        if (st.oceanFilter && st.oceanFilter !== 'ALL' && x.stage !== st.oceanFilter) return false;
        if (st.oceanPort && st.oceanPort !== 'ALL' && x.lane.to !== st.oceanPort) return false;
        if (st.oceanMissing && !x.missing.length) return false;
        if (q && !(x.id + ' ' + x.vessel + ' ' + x.carrier + ' ' + x.voyage).toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('kanban').innerHTML = STAGES.map(function (stage) {
        const items = list.filter((x) => x.stage === stage.id);
        const unitsSum = items.reduce((a, x) => a + x.units, 0);
        const accent = stage.tone === 'green' ? 'var(--green)' : stage.tone === 'blue' ? 'var(--blue)' : stage.tone === 'amber' ? 'var(--amber)' : stage.tone === 'violet' ? 'var(--violet)' : 'var(--txt-3)';
        return '<div class="kcol" data-stage="' + stage.id + '">' +
          '<div class="kcol-h"><i class="bar" style="background:' + accent + '"></i>' +
          '<b>' + stage.id + ' ' + stage.name + '</b><span class="cnt">' + items.length + ' 票 · ' + unitsSum + ' 台</span></div>' +
          '<div class="kcol-b">' + (items.map((x) => card(x, s.today)).join('') ||
            '<div class="kempty">' + (stage.id === 'REC' ? '尚无入仓批次' : '此环节暂无航次') + '</div>') + '</div></div>';
      }).join('');

      document.getElementById('oceanGantt').innerHTML = gantt(s);
    }
  });

  function kpi(lab, v, unit, color, meta) {
    return '<div class="ocean-kpi"><div class="lab">' + lab + '</div>' +
      '<div class="v" style="color:' + color + '">' + v + '<small>' + unit + '</small></div>' +
      '<div style="font-size:9.5px;color:var(--txt-3)">' + meta + '</div></div>';
  }

  function exportCsv(s) {
    const head = ['航次', '承运人', '船名', '航次号', '箱型', '起运港', '卸货港', '阶段', '开船', '冻结ETA', '实际到港', '免期天数', '免期到期', '台数', '型号', '入仓节点', '缺项单证'];
    const rows = s.ocean.map(function (x) {
      return [x.id, x.carrier, x.vessel, x.voyage, x.box, x.lane.from, x.lane.to, x.stage, x.etd, x.eta,
      x.actualEta || '', x.freeDays, dt.add(etaOf(x), x.freeDays), x.units, x.model, x.nodeId,
      x.missing.map((m) => (A.C.DOCS.find((d) => d.id === m) || {}).name).join(' ')];
    });
    const csv = '\ufeff' + [head].concat(rows).map((r) => r.map(function (c) {
      const v = String(c == null ? '' : c);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'atlas-ocean-' + s.today + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    A.toast('已导出 ' + s.ocean.length + ' 个航次', 'teal');
  }
})(window);

</script>
<script>/* assets/js/view-routing.js */
/* ==========================================================================
   view-routing.js — 路径与比价（A / B / C1 / C2）+ 换线判定
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt;

  function defaultCfg(s) {
    return s.ui.route || (s.ui.route = {
      nodeId: 'DAL', areaIdx: 2, model: 'M03', units: 2, level: 'L3', l4: false, l5: true
    });
  }

  function synth(cfg, s) {
    const area = A.C.AREAS[cfg.areaIdx];
    const node = A.C.nodeById[cfg.nodeId];
    const [nodeId, city, st, zip, lat, lng] = area;
    return {
      id: 'RFQ-' + node.id + '-' + zip, nodeId: node.id, city, st, zip, lat, lng,
      model: cfg.model, units: cfg.units, level: cfg.level, l4: cfg.l4, l5: cfg.l5,
      miles: Math.round(A.geo.roadMiles(node, { lat, lng })),
      window: { date: s.today, from: '10:00', to: '13:00' }, hard: false,
      status: '待派', sns: []
    };
  }

  A.registerView('routing', {
    title: '路径与比价',
    sub: '同一票、同一终点、同窗口下的 A / B / C1 / C2 全价对比与换线判定',

    mount: function (host) {
      host.innerHTML = '<div class="wrap" id="rtRoot"></div>';
      const root = document.getElementById('rtRoot');
      root.addEventListener('change', function (e) {
        const t = e.target.closest('[data-cfg]');
        if (!t) return;
        const s = A.app.state, cfg = defaultCfg(s);
        const k = t.dataset.cfg;
        cfg[k] = k === 'units' || k === 'areaIdx' ? Number(t.value) : t.value;
        if (k === 'nodeId') {
          const first = A.C.AREAS.findIndex((a) => a[0] === cfg.nodeId);
          const cur = A.C.AREAS[cfg.areaIdx];
          if (!cur || cur[0] !== cfg.nodeId) cfg.areaIdx = first >= 0 ? first : 0;
        }
        A.store.emit();
      });
      root.addEventListener('click', function (e) {
        const t = e.target.closest('[data-flag],[data-preset]');
        if (!t) return;
        const s = A.app.state, cfg = defaultCfg(s);
        if (t.dataset.flag) { cfg[t.dataset.flag] = !cfg[t.dataset.flag]; A.store.emit(); }
        if (t.dataset.preset === 'dfw') {
          cfg.nodeId = 'DAL'; cfg.areaIdx = 13; cfg.model = 'M03'; cfg.units = 2;
          cfg.level = 'L3'; cfg.l4 = false; cfg.l5 = true; A.store.emit();
          A.toast('已载入 DFW-Q01 样单参数', 'teal');
        }
        if (t.dataset.preset === 'stairs') {
          cfg.nodeId = 'NJE'; cfg.areaIdx = 32; cfg.model = 'M06'; cfg.units = 1;
          cfg.level = 'L3'; cfg.l4 = true; cfg.l5 = false; A.store.emit();
          A.toast('已载入复杂通道样例（楼梯 + 最高型号）', 'amber');
        }
      });
    },

    update: function (s) {
      const cfg = defaultCfg(s);
      const root = document.getElementById('rtRoot');
      if (!root) return;
      const o = synth(cfg, s);
      const qs = A.pricing.feasiblePaths(o);
      const best = qs.filter((x) => x.q.feasibility !== 'blocked').sort((a, b) => a.q.total - b.q.total)[0];
      const baseline = qs.find((x) => x.path === 'A' && x.q.feasibility !== 'blocked') || qs.find((x) => x.q.feasibility !== 'blocked');
      const m = A.C.MODELS[cfg.model];

      const areaOpts = A.C.AREAS.map(function (a, i) {
        if (a[0] !== cfg.nodeId) return '';
        return '<option value="' + i + '"' + (i === cfg.areaIdx ? ' selected' : '') + '>' + a[1] + ', ' + a[2] + ' ' + a[3] + '</option>';
      }).join('');

      const paramCard =
        '<div class="card"><div class="card-h"><h3>询价参数 <span class="k">同版发给主备</span></h3><span class="sp"></span>' +
        '<button class="btn btn--sm btn--ghost" data-preset="dfw">DFW-Q01 样单</button></div>' +
        '<div class="card-b"><div class="grid g-2" style="gap:10px">' +
        field('起运仓', '<select class="select" data-cfg="nodeId">' + A.C.NODES.map(function (n) {
          return '<option value="' + n.id + '"' + (n.id === cfg.nodeId ? ' selected' : '') + '>' + n.id + ' · ' + n.name + '</option>';
        }).join('') + '</select>') +
        field('最终地址（区域样点）', '<select class="select" data-cfg="areaIdx">' + areaOpts + '</select>') +
        field('型号', '<select class="select" data-cfg="model">' + Object.keys(A.C.MODELS).map(function (k) {
          return '<option value="' + k + '"' + (k === cfg.model ? ' selected' : '') + '>' + k + ' · ' + A.C.MODELS[k].name + ' · ' + A.C.MODELS[k].hin + ' in</option>';
        }).join('') + '</select>') +
        field('台数', '<input class="input" type="number" min="1" max="6" value="' + cfg.units + '" data-cfg="units" style="width:100%">') +
        field('服务档', '<select class="select" data-cfg="level">' + Object.keys(A.C.LEVELS).map(function (k) {
          return '<option value="' + k + '"' + (k === cfg.level ? ' selected' : '') + '>' + k + ' · ' + A.C.LEVELS[k].name + '（' + A.C.LEVELS[k].short + '）</option>';
        }).join('') + '</select>') +
        field('叠加动作', '<div class="row row--tight">' +
          '<button class="pill' + (cfg.l4 ? ' is-on' : '') + '" data-flag="l4">+L4 特殊通道</button>' +
          '<button class="pill' + (cfg.l5 ? ' is-on' : '') + '" data-flag="l5">+L5 技术启用</button></div>') +
        '</div>' +
        '<div class="divide"></div>' +
        '<div class="row" style="gap:14px;font-size:11.5px">' +
        '<span>里程 <b class="num">' + fmt.n(o.miles) + ' mi</b></span>' +
        '<span>尺寸 <b class="num">' + m.l + '×' + m.w + '×' + m.h + ' cm</b></span>' +
        '<span>带托高 <b class="num" style="color:' + (m.over84 ? 'var(--red)' : 'var(--txt)') + '">' + m.hin + ' in</b></span>' +
        '<span>毛重 <b class="num">' + m.kg + ' kg</b></span>' +
        '</div>' +
        '<p class="hint" style="margin-top:9px">' + m.note + '。' +
        (m.over84 ? '<b style="color:var(--red)">带托高度已超 84 英寸，普通零担产品会拒收。</b>' : '仍需核实际外廓、车门与尾板。') +
        '</p></div></div>';

      const pathCards = '<div class="grid g-4" style="gap:10px">' + qs.map(function (x) {
        const p = A.C.PATHS[x.path], q = x.q;
        const isBest = best && best.path === x.path;
        const blocked = q.feasibility === 'blocked';
        return '<div class="card" style="' + (isBest ? 'border-color:rgba(245,165,36,.55);box-shadow:0 0 0 1px rgba(245,165,36,.25), var(--shadow)' : '') + (blocked ? ';opacity:.62' : '') + '">' +
          '<div class="card-h" style="padding:9px 11px">' +
          '<h3 style="font-size:11.5px;white-space:nowrap"><span class="tag tag--' + p.tone + '" style="height:17px">' + x.path + '</span>' + (p.short || p.name) + '</h3>' +
          '<span class="sp"></span>' + (isBest ? '<span class="tag tag--amber">最优</span>' : '') + '</div>' +
          '<div class="card-b card-b--tight">' +
          '<div class="num" style="font-size:22px;font-weight:700;letter-spacing:-.02em' + (blocked ? ';color:var(--txt-3)' : '') + '">' + (blocked ? '不可行' : fmt.usd(q.total)) + '</div>' +
          '<div style="font-size:10px;color:var(--txt-3);margin-bottom:8px">' + (blocked ? q.blocker : '含已购动作与已知增项') + '</div>' +
          (blocked ? '' : '<table class="tbl" style="font-size:10.5px"><tbody>' + q.lines.map(function (l) {
            return '<tr><td style="padding:4px 0;border:0;color:var(--txt-2)">' + l.k + '</td>' +
              '<td class="r num" style="padding:4px 0;border:0">' + fmt.usd(l.amt) + '</td></tr>';
          }).join('') + '</tbody></table>') +
          '</div></div>';
      }).join('') + '</div>';

      const verdict = (function () {
        if (!best) return '';
        const diff = (baseline ? baseline.q.total : best.q.total) - best.q.total;
        return '<div class="card"><div class="card-b" style="display:flex;gap:13px;align-items:flex-start">' +
          '<span class="dot dot--' + (diff > 0 ? 'green' : 'amber') + '" style="margin-top:6px"></span>' +
          '<div><div style="font-size:12.5px;font-weight:650;margin-bottom:3px">' +
          (diff > 0
            ? '按当前参数，' + best.path + '（' + A.C.PATHS[best.path].name + '）比 ' + baseline.path + ' 省 ' + fmt.usd(diff) + '／' + cfg.units + ' 台。'
            : '按当前参数，' + best.path + ' 已是最低可行全价。') + '</div>' +
          '<p class="hint">换线还要同时满足：同范围、同窗口、扣除全部增量费用后净额 &gt; 0，且不突破任一原承诺。少做一步换来的低价不算节省。</p>' +
          '<div class="row row--tight" style="margin-top:7px">' +
          '<span class="tag tag--plain">原窗 ' + o.window.from + '–' + o.window.to + ' 同</span>' +
          '<span class="tag tag--plain">终点同</span>' +
          '<span class="tag ' + (o.level === 'L3' ? 'tag--amber' : 'tag--plain') + '">服务 ' + A.C.LEVELS[o.level].code + (cfg.l4 ? '+L4' : '') + (cfg.l5 ? '+L5' : '') + '</span>' +
          '<span class="tag tag--plain">' + o.miles + ' mi</span></div></div></div></div>';
      })();

      /* DFW reference */
      const dfw = [
        ['原仓出库＋干线', '15×2 = 30；干线含在配送', '15×2 = 30；运输含在直提', '15×2 = 30；原仓到站另 120／票'],
        ['入站、临存、出站', '无', '无', '收发 22×2 = 44；短存 3／台日×2台×2日 = 12'],
        ['L3 首台＋同址加台', '365＋145 = 510', '310＋100 = 410', '225＋85 = 310（站至最终机位）'],
        ['停车与启用', '停车 20／站；T5 60×2 = 120', '停车 20；T5 120', '停车 20；T5 120'],
        ['同服务全程预算', '680', '580', '656'],
        ['对基线改善', '基线', '−100', '−24']
      ];
      const dfwTable = '<div class="card"><div class="card-h"><h3>DFW-Q01 两台同址比价 <span class="k">模拟美元</span></h3><span class="sp"></span>' +
        '<span class="hint">结论：选 B 直提 580，较可执行原路径少 100</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>费用与依据</th>' +
        '<th>可执行原路线</th><th>主供甲：B 直提</th><th>备选乙：C2 经站</th></tr></thead><tbody>' +
        dfw.map(function (r, i) {
          return '<tr' + (i === 4 ? ' style="font-weight:650"' : '') + '><td>' + r[0] + '</td>' +
            '<td class="num">' + r[1] + '</td><td class="num">' + r[2] + '</td><td class="num">' + r[3] + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="card-b" style="padding-top:10px"><p class="hint">三方均已确认相同原窗口、相同 L3 动作。乙的 310 仅是二程小计，不能单独与 A 的全程价比较。中选后只向甲发委托，售后另向 T5 服务商发两台的 L5 技术单。</p></div></div>';

      /* service menu */
      const menu = '<div class="card"><div class="card-h"><h3>服务菜单 <span class="k">L1–L5</span></h3><span class="sp"></span>' +
        '<span class="hint">下单时只选一个 L1–L3，L4/L5 按已购动作叠加</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>代码</th><th>确切交付边界</th><th>下单时须核</th><th class="r">相对基数</th></tr></thead><tbody>' +
        Object.keys(A.C.LEVELS).map(function (k) {
          const l = A.C.LEVELS[k];
          return '<tr><td><span class="tag tag--amber">' + k + '</span> <b>' + l.name + '</b></td><td class="sub">' + l.reach + '</td>' +
            '<td class="muted" style="font-size:11px">' + l.need + '</td><td class="r num">×' + l.factor.toFixed(2) + '</td></tr>';
        }).join('') +
        Object.keys(A.C.ADDONS).map(function (k) {
          const a = A.C.ADDONS[k];
          return '<tr><td><span class="tag tag--' + (k === 'L4' ? 'violet' : 'teal') + '">' + k + '</span> <b>' + a.name + '</b></td>' +
            '<td class="sub">' + a.note + '</td><td class="muted" style="font-size:11px">须书面接受工具、人数、工法与专项价</td>' +
            '<td class="r num">+$' + a.fee + '／台</td></tr>';
        }).join('') + '</tbody></table></div></div>';

      /* carrier limits */
      const lim = A.C.RATE.carrierLimits;
      const modelRows = Object.keys(A.C.MODELS).map(function (k) {
        const mm = A.C.MODELS[k];
        const fed = mm.hin > lim.fedexFreightDirect.maxH;
        const estes = mm.hin > lim.estes.maxH;
        return '<tr><td><b>' + k + '</b> <span class="muted">' + mm.name + '</span></td>' +
          '<td class="num">' + mm.l + '×' + mm.w + '×' + mm.h + '</td>' +
          '<td class="num">' + mm.hin + '</td><td class="num">' + mm.kg + '</td>' +
          '<td class="num">' + mm.cuft + '</td><td class="num">' + mm.per40 + '</td>' +
          '<td><span class="tag ' + (fed ? 'tag--red' : 'tag--green') + '">' + (fed ? 'FedEx 超高' : 'FedEx 尺寸过筛') + '</span> ' +
          '<span class="tag ' + (estes ? 'tag--red' : 'tag--plain') + '">' + (estes ? 'Estes 超高' : 'Estes 过筛') + '</span></td>' +
          '<td class="muted" style="font-size:10.5px">' + mm.note + '</td></tr>';
      }).join('');

      const modelTable = '<div class="card"><div class="card-h"><h3>七型号与承运初筛</h3><span class="sp"></span>' +
        '<span class="hint">84 in = 213.36 cm，M04 与纸面上限只差 1.36 cm</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>型号</th><th>带托长×宽×高（cm）</th><th class="r">高（in）</th><th class="r">毛重（kg）</th>' +
        '<th class="r">体积 ft³</th><th class="r">40HQ 参考位</th><th>零担产品初筛</th><th>提货或进门前必须核</th></tr></thead><tbody>' +
        modelRows + '</tbody></table></div>' +
        '<div class="card-b" style="padding-top:10px"><p class="hint">FedEx Freight Direct 标准单件限高 75 in，七款带托均超过；Estes Front Door 限 60×48×84 in、1,500 lb。' +
        '尺寸过筛只说明可进询价，不表示承运人会拆托、清运或搬进指定机位。</p></div></div>';

      root.innerHTML = '<div class="grid g-32" style="align-items:start">' + paramCard +
        '<div class="stack">' + pathCards + verdict + '</div></div>' +
        '<div style="margin-top:14px" class="stack">' + dfwTable + menu + modelTable + '</div>' +
        '<p class="hint" style="margin-top:12px;text-align:center">费率卡为演示用内部口径，锚定 V12 方案 DFW-Q01 样单与公开区域报价；实际派单前须取得对本票机型、现场、人员工具、全价与排期的书面接受。</p>';
    }
  });

  function field(label, inner) {
    return '<label style="display:grid;gap:5px"><span style="font-size:10.5px;color:var(--txt-3);letter-spacing:.04em">' + label + '</span>' + inner + '</label>';
  }
})(window);

</script>
<script>/* assets/js/view-ops.js */
/* ==========================================================================
   view-ops.js — 异常与返修（F06 分诊 / RMA / 维修成本临界）
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;

  function typeOf(id) { return A.C.EXC_TYPES.find((t) => t.id === id) || A.C.EXC_TYPES[0]; }

  A.registerView('ops', {
    title: '异常与返修',
    sub: 'F06 分诊、保管责任、现场维修与整机返修的成本临界',

    mount: function (host) {
      host.innerHTML = '<div class="wrap" id="opsRoot"></div>';
      const root = document.getElementById('opsRoot');
      root.addEventListener('click', function (e) {
        const t = e.target.closest('[data-act]');
        if (!t) return;
        const s = A.app.state;
        if (t.dataset.act === 'filter') { s.ui.excFilter = t.dataset.v; A.store.emit(); }
        if (t.dataset.act === 'row') { openTicket(t.dataset.id); }
        if (t.dataset.act === 'calc') {
          s.ui.repair = s.ui.repair || {};
          s.ui.repair[t.dataset.k] = Number(t.value != null ? t.value : t.dataset.v);
        }
      });
      root.addEventListener('input', function (e) {
        const t = e.target.closest('[data-calc]');
        if (!t) return;
        const s = A.app.state;
        s.ui.repair = s.ui.repair || { miles: 32, hours: 2, ot: false, units: 1 };
        s.ui.repair[t.dataset.calc] = t.type === 'checkbox' ? t.checked : Number(t.value);
        A.store.emit();
      });
    },

    update: function (s) {
      const root = document.getElementById('opsRoot');
      if (!root) return;
      const rep = s.ui.repair || (s.ui.repair = { miles: 32, hours: 2, ot: false, units: 1 });
      const flt = s.ui.excFilter || 'ALL';
      const all = s.exceptions || [];
      const list = all.filter((e) => flt === 'ALL' || e.type === flt);
      const open = all.filter((e) => e.status !== '已关闭');
      const over = open.filter((e) => e.ageH > e.sla);
      const units = open.reduce(function (a, e) {
        const o = s.orders.find((x) => x.id === e.orderId);
        return a + (o ? o.units : 0);
      }, 0);

      const kpiRow = '<div class="stat-grid">' +
        stat('未结异常', open.length, '单', 'red', '含待客户与处理中') +
        stat('超 SLA', over.length, '单', 'amber', '按类型 SLA 计') +
        stat('涉及设备', units, '台', 'violet', '在未结异常中') +
        stat('已关闭', all.length - open.length, '单', 'green', '本演示周期') +
        '</div>';

      const chips = '<div class="row" style="gap:5px">' +
        '<button class="pill' + (flt === 'ALL' ? ' is-on' : '') + '" data-act="filter" data-v="ALL">全部 <span class="n">' + all.length + '</span></button>' +
        A.C.EXC_TYPES.map(function (t) {
          const n = all.filter((e) => e.type === t.id).length;
          return '<button class="pill' + (flt === t.id ? ' is-on' : '') + '" data-act="filter" data-v="' + t.id + '">' + t.name + ' <span class="n">' + n + '</span></button>';
        }).join('') + '</div>';

      const rows = list.map(function (e) {
        const o = s.orders.find((x) => x.id === e.orderId);
        const t = typeOf(e.type);
        const overSla = e.ageH > e.sla;
        return '<tr data-act="row" data-id="' + e.id + '" style="cursor:pointer">' +
          '<td class="mono" style="font-size:10.5px">' + e.id + '</td>' +
          '<td><b>' + t.name + '</b>' + (t.stop ? ' <span class="tag tag--red" style="height:14px;padding:0 3px;font-size:8.5px">先停</span>' : '') + '</td>' +
          '<td class="mono" style="font-size:10.5px">' + e.orderId + '</td>' +
          '<td>' + (o ? o.city + ' ' + o.st : '—') + '</td>' +
          '<td class="muted">' + e.holder + '</td>' +
          '<td>' + e.owner + '</td>' +
          '<td class="num" style="color:' + (overSla ? 'var(--red)' : 'var(--txt-2)') + '">' + e.ageH + 'h / ' + e.sla + 'h</td>' +
          '<td><span class="tag ' + (e.status === '已关闭' ? 'tag--green' : e.status === '待客户' ? 'tag--amber' : 'tag--blue') + '">' + e.status + '</span></td>' +
          '</tr>';
      }).join('');

      /* triage tree */
      const triage = '<div class="card"><div class="card-h"><h3>分诊顺序 <span class="k">F06</span></h3></div>' +
        '<div class="card-b"><div class="stack" style="gap:9px">' +
        tri('1', '先停作业', '危险、货损或错 SN 先停，记录当前保管人与时间戳。', 'red') +
        tri('2', '判定能否安全修复', '可远程、寄件或本地上门恢复 → 就地结案；不适合现场安全维修 → 进 3。', 'amber') +
        tri('3', '需整机返修 → RMA', '先定接收点、包装、双向运费与复测标准；修后复测再复送。', 'violet') +
        tri('4', '商业退货 → 卖方 RMA', '按卖方授权与指定退货仓；仓方回签实收，退款另审。', 'blue') +
        '</div></div></div>';

      /* repair calculator */
      const OT = rep.ot ? 1.5 : 1;
      const onsite = Math.round(A.C.RATE.service.repair.resqCall +
        Math.max(0, rep.hours - 1) * A.C.RATE.service.repair.resqHour * OT +
        Math.max(0, rep.miles - 25) * A.C.RATE.service.repair.perMile);
      const pickup = Math.round(A.C.RATE.service.repair.nodakFirst + Math.max(0, rep.miles - 25) * A.C.RATE.service.repair.perMile);
      const bench = Math.round(Math.max(1, rep.hours) * 105);
      const redeliver = pickup;
      const downtime = Math.round(rep.hours * 0.4 * 100 + 2 * 60); // 停业时间折算（演示）
      const rebuild = pickup + bench + redeliver;

      const calc = '<div class="card"><div class="card-h"><h3>现场上门 vs 搬机返修 <span class="k">成本临界</span></h3></div>' +
        '<div class="card-b"><div class="grid g-3" style="gap:8px">' +
        inputField('单程距离 mi', 'miles', rep.miles) +
        inputField('工时 h（含路时）', 'hours', rep.hours) +
        '<label style="display:grid;gap:5px"><span style="font-size:10.5px;color:var(--txt-3)">时段</span>' +
        '<label style="display:flex;align-items:center;gap:6px;height:30px;font-size:11.5px"><input type="checkbox" data-calc="ot"' + (rep.ot ? ' checked' : '') + '> 非工作时段（1.5×）</label></label>' +
        '</div>' +
        '<div class="divide"></div>' +
        '<div class="grid g-2" style="gap:10px">' +
        cmpCard('现场上门', onsite, ['到场＋首小时 $260', '续时 $130/h × ' + OT.toFixed(1), '超出 25 mi 部分 $3/mi'], onsite <= rebuild) +
        cmpCard('搬机返修', rebuild, ['取机 $150（含 25 mi）', '车间 $105/h × ' + Math.max(1, rep.hours), '复送 $150'], rebuild < onsite) +
        '</div>' +
        '<p class="hint" style="margin-top:9px">停机增量另计：搬机通常多损失约 <b class="num" style="color:var(--amber)">' + fmt.n(downtime) + '</b> 美元的营业时间折算（' + rep.hours + ' h 工时按 40% 营业率 + 拆装包装 2 h）。' +
        '现场方案超过 <b class="num">' + fmt.usd(rebuild) + '</b> 且停机不敏感时，车间更省；反之先授权诊断再决定二访。</p>' +
        '<p class="hint" style="margin-top:6px;color:var(--txt-3)">费率参考 ResQ Dallas / Nodak / ASI 公开条款，仅用于排价与临界判断，不是达拉斯实际报价。</p>' +
        '</div></div>';

      /* holders */
      const holders = {};
      open.forEach(function (e) { holders[e.holder] = (holders[e.holder] || 0) + 1; });
      const holderCard = '<div class="card"><div class="card-h"><h3>设备现在谁手上</h3></div><div class="card-b">' +
        A.charts.bars(Object.keys(holders).map(function (k) { return { k: k, v: holders[k], t: holders[k] + ' 单', c: 'var(--amber)' }; }), { labelW: 108 }) +
        '<p class="hint" style="margin-top:10px">未决且无人保管的设备必须为零。已知货损同步开索赔经办，追责与保护设备并行。</p></div></div>';

      root.innerHTML = kpiRow +
        '<div class="grid g-23" style="margin-top:14px;align-items:start">' +
        '<div class="card"><div class="card-h"><h3>异常台账</h3><span class="sp"></span><span class="hint">点击一行查看处置建议</span></div>' +
        '<div class="card-b card-b--tight" style="padding-bottom:4px">' + chips + '</div>' +
        '<div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr>' +
        '<th>单号</th><th>类型</th><th>关联订单</th><th>城市</th><th>当前保管人</th><th>责任人</th><th>已开 / SLA</th><th>状态</th>' +
        '</tr></thead><tbody>' + (rows || '<tr><td colspan="8"><div class="empty"><b>没有符合条件的异常</b></div></td></tr>') + '</tbody></table></div></div>' +
        '<div class="stack">' + triage + holderCard + '</div></div>' +
        '<div style="margin-top:14px">' + calc + '</div>' +
        '<p class="hint" style="margin-top:12px;text-align:center">异常记录为演示样本；真实作业中每条异常须挂到订单号、SN 与具体交接段，并留下保管人、时间戳与照片。</p>';
    }
  });

  function openTicket(id) {
    const s = A.app.state;
    const e = s.exceptions.find((x) => x.id === id);
    if (!e) return;
    const o = s.orders.find((x) => x.id === e.orderId);
    const t = typeOf(e.type);
    const steps = [
      ['发生', e.opened, '已停作业 / 记录保管人：' + e.holder],
      ['已通知', A.dt.add(e.opened, 0), '责任人 ' + e.owner + ' 接手'],
      ['下一步', s.today, e.status === '已关闭' ? '已关闭' : '等待客户或承运方回复']
    ];
    const html = '<div class="drawer-h"><div><h2>' + t.name + '</h2><p>' + e.id + ' · 关联 ' + e.orderId + (o ? ' · ' + o.city + ' ' + o.zip : '') + '</p></div>' +
      '<span class="sp"></span><button class="icon-btn" data-x="close">✕</button></div>' +
      '<div class="drawer-b">' +
      '<div style="display:flex;gap:9px;padding:10px;border-radius:9px;background:var(--red-soft);border:1px solid rgba(255,107,107,.25)">' +
      '<span class="dot dot--red" style="margin-top:3px"></span><div style="font-size:11.5px;line-height:1.55">' + e.note + '</div></div>' +
      '<div class="kv" style="font-size:12px">' +
      '<dt>已开时长</dt><dd style="color:' + (e.ageH > e.sla ? 'var(--red)' : 'var(--txt)') + '">' + e.ageH + ' 小时（SLA ' + e.sla + ' 小时）</dd>' +
      '<dt>当前保管人</dt><dd>' + e.holder + '</dd>' +
      '<dt>责任人</dt><dd>' + e.owner + '</dd>' +
      '<dt>是否先停作业</dt><dd>' + (t.stop ? '是' : '否') + '</dd>' +
      (o ? '<dt>设备</dt><dd>' + o.model + ' ×' + o.units + ' · ' + o.sns.join(' / ') + '</dd>' : '') +
      (o ? '<dt>服务档</dt><dd>' + A.C.LEVELS[o.level].code + (o.l4 ? '+L4' : '') + (o.l5 ? '+L5' : '') + '</dd>' : '') +
      '</div>' +
      '<div><div class="sec-t">处置时间线</div><div class="tl">' + steps.map(function (st, i) {
        return '<div class="tl-i ' + (i === 2 ? 'now' : 'done') + '"><div class="t"><b>' + st[0] + '</b><span class="d">' + st[1] + '</span></div><div class="d2">' + st[2] + '</div></div>';
      }).join('') + '</div></div>' +
      '<div><div class="sec-t">下一步可选</div><div class="stack" style="gap:6px">' +
      opt('改约 / 改址', '保留原服务与窗口，销售留客户书面确认；受影响段撤销旧放货版。') +
      opt('返站保管', '站方回签实收，设备继续由已签收方保管；二程失约不转移保管责任。') +
      opt('派修 / 上门', '先授权诊断，确认料号与费用再派二访；不把整机搬运当默认动作。') +
      opt('整机返修 RMA', '定接收点、包装、双向费用与复测标准，修后复测再复送。') +
      opt('索赔', '货损前后照片、保管人、交接段记录与发票同步，独立于运输跟进。') +
      '</div></div></div>' +
      '<div class="drawer-f"><button class="btn btn--sm btn--ghost" data-x="close2">关闭</button><span class="sp"></span>' +
      (e.status !== '已关闭' ? '<button class="btn btn--prime btn--sm" data-x="done">标记已处置</button>' : '<button class="btn btn--sm" disabled>已关闭</button>') +
      '</div>';
    A.drawer.open(html, {
      onMount: function (d) {
        d.querySelectorAll('[data-x="close"],[data-x="close2"]').forEach((b) => b.addEventListener('click', () => A.drawer.close()));
        const dn = d.querySelector('[data-x="done"]');
        if (dn) dn.addEventListener('click', function () {
          const e2 = A.app.state.exceptions.find((x) => x.id === id);
          e2.status = '已关闭';
          A.store.set({ exceptions: A.app.state.exceptions });
          A.drawer.close();
          A.toast('已关闭 ' + id, 'green');
        });
      }
    });
  }

  function stat(lab, val, unit, tone, meta) {
    const map = { amber: 'var(--amber-soft)', blue: 'var(--blue-soft)', teal: 'var(--teal-soft)', violet: 'var(--violet-soft)', red: 'var(--red-soft)', green: 'var(--green-soft)' };
    return '<div class="stat" style="--accent:' + (map[tone] || 'var(--amber-soft)') + '">' +
      '<div class="lab"><span class="dot dot--' + tone + '"></span>' + lab + '</div>' +
      '<div class="val">' + val + '<small>' + unit + '</small></div><div class="meta">' + meta + '</div></div>';
  }
  function tri(n, title, desc, tone) {
    return '<div style="display:flex;gap:9px"><span style="width:17px;height:17px;flex:none;border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;background:var(--' + tone + '-soft);color:var(--' + tone + ')">' + n + '</span>' +
      '<div><div style="font-size:11.5px;font-weight:600">' + title + '</div><div style="font-size:10.5px;color:var(--txt-3);line-height:1.5">' + desc + '</div></div></div>';
  }
  function inputField(label, key, val) {
    return '<label style="display:grid;gap:5px"><span style="font-size:10.5px;color:var(--txt-3)">' + label + '</span>' +
      '<input class="input" type="number" data-calc="' + key + '" value="' + val + '" min="0" step="1"></label>';
  }
  function cmpCard(name, total, lines, win) {
    return '<div style="padding:10px;border-radius:9px;background:var(--panel-2);border:1px solid ' + (win ? 'rgba(45,212,191,.4)' : 'var(--line-soft)') + '">' +
      '<div style="display:flex;align-items:center;gap:6px"><b style="font-size:11.5px">' + name + '</b><span class="sp"></span>' +
      (win ? '<span class="tag tag--teal">更低</span>' : '') + '</div>' +
      '<div class="num" style="font-size:19px;font-weight:700;margin:3px 0 6px">' + fmt.usd(total) + '</div>' +
      '<div style="display:grid;gap:2px;font-size:10.5px;color:var(--txt-3)">' + lines.map((l) => '· ' + l).join('<br>') + '</div></div>';
  }
  function opt(title, desc) {
    return '<div style="padding:8px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-soft)">' +
      '<div style="font-size:11.5px;font-weight:600">' + title + '</div><div style="font-size:10.5px;color:var(--txt-3);line-height:1.5">' + desc + '</div></div>';
  }
})(window);

</script>
<script>/* assets/js/view-settlement.js */
/* ==========================================================================
   view-settlement.js — 结算复盘（P4：同批账证齐备）
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt;

  function batchMetrics(b) {
    const units = b.tickets;                       // 演示：一票一台
    const gross = b.baseline - b.actual;           // 报价差
    const net = gross - b.changeOrders + b.credit; // 增项与贷项
    return {
      units, gross, net,
      perUnitBase: b.baseline / units,
      perUnitNew: b.actual / units,
      ontime: b.ontime / b.tickets,
      firstTry: b.firstTry / b.tickets,
      pod: b.pod / b.tickets,
      damageRate: b.damage / units,
      marginPct: b.baseline ? net / b.baseline : 0
    };
  }

  A.registerView('settlement', {
    title: '结算复盘',
    sub: '按批次看原全价、新全费、增项与贷项，只有净额为正且无未解账差才扩大',

    mount: function (host) {
      host.innerHTML = '<div class="wrap" id="stRoot"></div>';
      const root = document.getElementById('stRoot');
      root.addEventListener('click', function (e) {
        const t = e.target.closest('[data-batch]');
        if (!t) return;
        A.app.state.ui.batch = t.dataset.batch;
        A.store.emit();
      });
    },

    update: function (s) {
      const root = document.getElementById('stRoot');
      if (!root) return;
      const batches = s.batches || [];
      const curId = s.ui.batch || batches[0].id;
      const b = batches.find((x) => x.id === curId) || batches[0];
      const m = batchMetrics(b);
      const inv = (s.invoices || []).filter((i) => i.batch === b.id);

      const selector = '<div class="row" style="gap:6px">' + batches.map(function (x) {
        return '<button class="pill' + (x.id === b.id ? ' is-on' : '') + '" data-batch="' + x.id + '">' + x.label +
          ' <span class="n">' + x.tickets + '</span></button>';
      }).join('') + '<span class="sp"></span><span class="hint">批次 ' + b.id + ' · ' + b.city + ' · ' + (b.closed ? '已结算 ' + b.closed : '在结') + '</span></div>';

      const kpis = '<div class="stat-grid">' +
        stat('样本票数', b.tickets, '票', 'blue', '达标线 ≥20 票首派') +
        stat('首派成功', fmt.pct(m.firstTry, 0), '', 'teal', b.firstTry + ' / ' + b.tickets) +
        stat('原窗准时', fmt.pct(m.ontime, 0), '', m.ontime >= s.baseline.ontime ? 'green' : 'red', '基线 ' + fmt.pct(s.baseline.ontime, 1)) +
        stat('单台新全费', fmt.usd(m.perUnitNew), '', 'violet', '原 ' + fmt.usd(m.perUnitBase)) +
        stat('批次净额', fmt.usd(m.net), '', m.net > 0 ? 'green' : 'red', '占原全价 ' + fmt.pct(m.marginPct, 1)) +
        '</div>';

      const wf = A.charts.waterfall([
        { k: '原全价', label: fmt.usd(b.baseline), abs: b.baseline, kind: 'total' },
        { k: '新全费', label: '−' + fmt.usd(b.actual), abs: -b.actual, kind: 'cut' },
        { k: '获批增项', label: '−' + fmt.usd(b.changeOrders), abs: -b.changeOrders, kind: 'add' },
        { k: '贷项 / 赔款', label: '+' + fmt.usd(b.credit), abs: b.credit, kind: 'cut' },
        { k: '净额', label: (m.net > 0 ? '+' : '') + fmt.usd(m.net), abs: m.net, kind: 'total' }
      ], { h: 176 });

      const wfCard = '<div class="card"><div class="card-h"><h3>净额构成</h3><span class="sp"></span>' +
        '<span class="tag ' + (m.net > 0 ? 'tag--green' : 'tag--red') + '">' + (m.net > 0 ? '净额为正' : '净额为负') + '</span></div>' +
        '<div class="card-b">' + wf +
        '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><tbody>' +
        '<tr><td>原方案同范围全价</td><td class="r num">' + fmt.usd(b.baseline) + '</td></tr>' +
        '<tr><td>新路径实际全程费用</td><td class="r num">−' + fmt.usd(b.actual) + '</td></tr>' +
        '<tr><td>获批变更（二次上门、等候、专项）</td><td class="r num">−' + fmt.usd(b.changeOrders) + '</td></tr>' +
        '<tr><td>贷项 / 实获赔款</td><td class="r num">+' + fmt.usd(b.credit) + '</td></tr>' +
        '<tr><td><b>批次净额</b></td><td class="r num" style="color:' + (m.net > 0 ? 'var(--green)' : 'var(--red)') + '"><b>' + (m.net > 0 ? '+' : '') + fmt.usd(m.net) + '</b></td></tr>' +
        '</tbody></table></div></div></div>';

      const gates = A.C.GATES.map(function (g, i) {
        const pass = [b.tickets >= 20, b.pod === b.tickets && b.damage <= 1, m.net > 0 && b.unmatched === 0, false][i];
        return '<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span class="tag ' + (pass ? 'tag--green' : 'tag--red') + '" style="height:18px">' + (pass ? '通过' : '未达') + '</span>' +
          '<div><div style="font-size:11.5px;font-weight:600">' + g.k + '</div>' +
          '<div style="font-size:10.5px;color:var(--txt-3);line-height:1.5">' + g.line + '</div></div></div>';
      }).join('');

      const gatesCard = '<div class="card"><div class="card-h"><h3>签批门槛 <span class="k">全部满足才可扩大</span></h3></div>' +
        '<div class="card-b card-b--tight">' + gates + '</div></div>';

      const invRows = inv.map(function (i) {
        const bad = i.diff > 0 && i.approved < i.diff;
        return '<tr><td class="mono" style="font-size:10.5px">' + i.id + '</td>' +
          '<td>' + i.vendor + '</td>' +
          '<td class="r num">' + fmt.usd(i.quoted) + '</td>' +
          '<td class="r num">' + fmt.usd(i.billed) + '</td>' +
          '<td class="r num" style="color:' + (i.approved ? 'var(--amber)' : 'var(--txt-3)') + '">' + (i.approved ? fmt.usd(i.approved) : '—') + '</td>' +
          '<td class="r num" style="color:' + (bad ? 'var(--red)' : 'var(--txt-2)') + '">' + (i.diff ? fmt.usd(i.diff) : '—') + '</td>' +
          '<td class="muted" style="font-size:10.5px">' + i.note + '</td>' +
          '<td><span class="tag ' + (i.status === '已核' ? 'tag--green' : i.status === '争议' ? 'tag--red' : 'tag--amber') + '">' + i.status + '</span></td></tr>';
      }).join('');

      const invCard = '<div class="card"><div class="card-h"><h3>账单差异</h3><span class="sp"></span>' +
        '<span class="hint">核报价、批准变更、作业凭证与发票逐行匹配</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>发票</th><th>供应商</th><th class="r">报价</th><th class="r">账单</th>' +
        '<th class="r">已批</th><th class="r">未获批差异</th><th>说明</th><th>状态</th></tr></thead><tbody>' +
        (invRows || '<tr><td colspan="8"><div class="empty"><b>本批次暂无发票</b></div></td></tr>') + '</tbody></table></div>' +
        '<div class="card-b" style="padding-top:10px"><p class="hint">账单大于委托时，采购先核免费等候与加台单位；有新增作业须找当日调度授权。未授权的争议行与无争议付款分开处理。</p></div></div>';

      /* 6-unit example from the plan */
      const six = '<div class="card"><div class="card-h"><h3>合批激励上限 <span class="k">六台同址样例</span></h3></div>' +
        '<div class="card-b"><div class="kv" style="font-size:11.5px">' +
        '<dt>原线全价（6 台 × 520）</dt><dd>3,120</dd>' +
        '<dt>拟用经站全价（干线 900＋6×300＋120）</dt><dd>2,820</dd>' +
        '<dt>激励前差额</dt><dd style="color:var(--teal)">300</dd>' +
        '<dt>共用预算（20% 上限）</dt><dd>60</dd>' +
        '<dt>7 天 SaaS 权益（6×7×0.50）</dt><dd>21</dd>' +
        '<dt>核发人工 ＋ 路线奖</dt><dd>12 ＋ 18</dd>' +
        '<dt>预计保留</dt><dd style="color:var(--teal);font-weight:700">249</dd>' +
        '</div>' +
        '<div class="divide"></div>' +
        '<p class="hint">临界运价：站内与末端 1,800、管理风险 120，干线须低于 <b class="num">6×(520−300)−120 = 1,200</b> 才有激励前差额。<br>' +
        '若客户要 14 天权益（42），加人工 12 与原奖 18 共 72 &gt; 60，须把奖金降到 ≤6 并获供方接受，或另批。已赚权益仍照约兑现。</p>' +
        '</div></div>';

      const rules = '<div class="card"><div class="card-h"><h3>三条口径</h3></div><div class="card-b"><div class="stack" style="gap:8px">' +
        rule('原方案已含的多点折扣不可再减', '拿两辆专车合计价当基线，会误报节省。已含优惠照实保留。', 'amber') +
        rule('未成功不能从分子剔掉', '失败、改派、补送、投诉留在原组；重复进场的车费留在原单。', 'red') +
        rule('新增覆盖单独验收', '原渠道到不了的邮编没有可比价，只报新增可服务范围与履约结果，不与降本批混算。', 'blue') +
        '</div></div></div>';

      root.innerHTML = selector +
        '<div style="margin-top:12px">' + kpis + '</div>' +
        '<div class="grid g-23" style="margin-top:14px;align-items:start">' +
        '<div class="stack">' + wfCard + invCard + '</div>' +
        '<div class="stack">' + gatesCard + six + rules + '</div>' +
        '</div>' +
        '<p class="hint" style="margin-top:12px;text-align:center">批次数字为演示样本，用于展示核算口径；V12 资料尚无可签认的达拉斯实际首派队列与发票，因此不能据此认定整批降本。</p>';
    }
  });

  function stat(lab, val, unit, tone, meta) {
    const map = { amber: 'var(--amber-soft)', blue: 'var(--blue-soft)', teal: 'var(--teal-soft)', violet: 'var(--violet-soft)', red: 'var(--red-soft)', green: 'var(--green-soft)' };
    return '<div class="stat" style="--accent:' + (map[tone] || 'var(--amber-soft)') + '">' +
      '<div class="lab"><span class="dot dot--' + tone + '"></span>' + lab + '</div>' +
      '<div class="val">' + val + (unit ? '<small>' + unit + '</small>' : '') + '</div><div class="meta">' + meta + '</div></div>';
  }
  function rule(title, desc, tone) {
    return '<div style="display:flex;gap:8px"><span class="dot dot--' + tone + '" style="margin-top:4px"></span>' +
      '<div><div style="font-size:11.5px;font-weight:600">' + title + '</div>' +
      '<div style="font-size:10.5px;color:var(--txt-3);line-height:1.5">' + desc + '</div></div></div>';
  }
})(window);

</script>
<script>/* assets/js/view-runbook.js */
/* ==========================================================================
   view-runbook.js — 作业手册：F 码、岗位、周期、S 码、KPI 定义
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt;

  A.registerView('runbook', {
    title: '作业手册',
    sub: 'F01–F08 作业码、岗位权限、P1–P4 周期、S01–S04 头程交接与 KPI 口径',

    mount: function (host) {
      host.innerHTML = '<div class="wrap" id="rbRoot"></div>';
      const root = document.getElementById('rbRoot');
      root.addEventListener('click', function (e) {
        const t = e.target.closest('[data-step]');
        if (!t) return;
        A.app.state.ui.step = t.dataset.step;
        A.store.emit();
      });
    },

    update: function (s) {
      const root = document.getElementById('rbRoot');
      if (!root) return;
      const cur = s.ui.step || 'F03';
      const steps = A.C.STEPS;
      const step = steps.find((x) => x.id === cur) || steps[0];

      const rail = '<div class="card"><div class="card-h"><h3>履约作业码 <span class="k">F01–F08</span></h3><span class="sp"></span>' +
        '<span class="hint">点击查看输入、凭证与退回条件</span></div>' +
        '<div class="card-b"><div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px">' +
        steps.map(function (x, i) {
          const on = x.id === step.id;
          return '<button data-step="' + x.id + '" style="text-align:left;padding:9px 8px;border-radius:8px;border:1px solid ' + (on ? 'rgba(245,165,36,.5)' : 'var(--line-soft)') + ';background:' + (on ? 'var(--amber-soft)' : 'var(--panel-2)') + '">' +
            '<div class="mono" style="font-size:10px;color:' + (on ? 'var(--amber)' : 'var(--txt-3)') + '">' + x.id + '</div>' +
            '<div style="font-size:11px;font-weight:600;margin-top:2px;line-height:1.3">' + x.name + '</div>' +
            '<div style="font-size:9.5px;color:var(--txt-3);margin-top:3px">' + x.owner + '</div></button>';
        }).join('') + '</div></div></div>';

      const detail = '<div class="card"><div class="card-h"><h3><span class="tag tag--amber">' + step.id + '</span> ' + step.name + '</h3>' +
        '<span class="sp"></span><span class="hint">' + step.owner + '</span></div>' +
        '<div class="card-b"><div class="grid g-3" style="gap:12px">' +
        block('交出什么', step.out, 'teal') +
        block('凭什么放行', step.gate, 'amber') +
        block('路径选项', step.opts ? step.opts.map((p) => p + ' · ' + A.C.PATHS[p].name).join('；') : '按实物流向选 A / B / C1 / C2，服务另按已购 L 档', 'blue') +
        '</div>' +
        '<div class="divide"></div>' +
        '<p class="hint">单号贯穿：订单 → SN → 段号 / 停靠点 → POD → 发票行。每段换手都留时间、货况与双方回执；未完成动作点名接手人。</p>' +
        '</div></div>';

      const roles = '<div class="card"><div class="card-h"><h3>岗位与权限</h3><span class="sp"></span><span class="hint">申请人不得自批</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>岗位</th><th>职责</th><th>可以做什么</th></tr></thead><tbody>' +
        A.C.ROLES.map(function (r) {
          return '<tr><td><b>' + r.role + '</b></td><td class="sub" style="font-size:11px">' + r.duty + '</td>' +
            '<td class="muted" style="font-size:11px">' + r.right + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';

      const cycles = '<div class="card"><div class="card-h"><h3>启动与验收周期 <span class="k">P1–P4</span></h3><span class="sp"></span>' +
        '<span class="hint">由真实业务事件触发，不按日历换页</span></div>' +
        '<div class="card-b"><div class="stack" style="gap:8px">' + A.C.CYCLES.map(function (c) {
          return '<div style="display:grid;grid-template-columns:38px 1fr;gap:10px;padding:9px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-soft)">' +
            '<div class="mono" style="font-size:11px;font-weight:700;color:var(--amber)">' + c.id + '</div>' +
            '<div><div style="font-size:11.5px;font-weight:600">' + c.name + '</div>' +
            '<div style="font-size:10.5px;color:var(--txt-3);line-height:1.5;margin-top:2px">进入：' + c.in + '<br>交出：' + c.out + '<br>退回：' + c.pass + '</div></div></div>';
        }).join('') + '</div></div></div>';

      const stageS = '<div class="card"><div class="card-h"><h3>头程 S01–S04 交接</h3><span class="sp"></span><span class="hint">到港通知不能代替任何放行</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>环节</th><th>凭什么继续</th><th>未满足怎么办</th></tr></thead><tbody>' +
        [['S01 订舱', '具名交货地点、指定仓、进口责任人、费用承担与订舱回执', '只报港到港时先补短驳委托与报价'],
          ['S02 装运', 'SN 关联件号与实测包装；箱封、VGM、ISF 与实际航次', '清单与实物不符先更正；换船改港留新旧版本'],
          ['S03 到港', '监管放行、船方放货、场站可提三项齐', '三项缺一暂缓派车；记末个免费日与费期'],
          ['S04 入仓', '取 EIR 并还空；凭分单提已拆齐件；按 ASN 逐 SN 签收', '缺件开异常，受损机隔离，库存只锁已验合格机']]
          .map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td class="sub" style="font-size:11px">' + r[1] + '</td><td class="muted" style="font-size:11px">' + r[2] + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>';

      const kpis = '<div class="card"><div class="card-h"><h3>KPI 口径</h3><span class="sp"></span><span class="hint">每月按供应商、城市、服务档分列</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>指标</th><th>分子 ÷ 分母</th><th>为什么这样算</th></tr></thead><tbody>' +
        A.C.KPIS.map(function (k) {
          return '<tr><td><b>' + k.name + '</b></td><td class="mono" style="font-size:10.5px">' + k.f + '</td><td class="muted" style="font-size:11px">' + k.why + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';

      const docs = '<div class="card"><div class="card-h"><h3>随单必留凭证</h3></div><div class="card-b">' +
        '<div class="grid g-2" style="gap:9px">' +
        A.C.DOCS.map(function (d) {
          return '<div style="display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-soft);font-size:11px">' +
            '<span class="tag tag--plain" style="height:16px;padding:0 4px;font-size:9px">S0' + (d.stage + 1) + '</span>' + d.name + '</div>';
        }).join('') + '</div>' +
        '<p class="hint" style="margin-top:10px">保留装箱清单、美国仓实收、设备归还与关税付款凭据。单独记末个免费日及各项费期，临界时先约替代窗口或报批费用。</p>' +
        '</div></div>';

      const swRule = '<div class="card" style="border-color:rgba(245,165,36,.3)"><div class="card-b" style="display:flex;gap:11px">' +
        '<span class="dot dot--amber" style="margin-top:5px"></span><div>' +
        '<div style="font-size:12px;font-weight:650;margin-bottom:3px">换线标准（唯一判据）</div>' +
        '<p class="hint">原方式能履约时，只有同范围、同窗口且扣除全部增量费用后 <b>净额 &gt; 0</b> 才换线；原方式不能履约，则按保履约审批，单列价差。' +
        'A／B／C 是物流路径；L1 基础交接、L2 指定入口、L3 到机位三选一；L4 复杂通道专项、L5 技术启用按已购动作叠加。</p>' +
        '</div></div></div>';

      root.innerHTML = swRule +
        '<div style="margin-top:14px">' + rail + '</div>' +
        '<div style="margin-top:14px">' + detail + '</div>' +
        '<div class="grid g-2" style="margin-top:14px;align-items:start">' + roles + cycles + '</div>' +
        '<div class="grid g-2" style="margin-top:14px;align-items:start">' + stageS + docs + '</div>' +
        '<div style="margin-top:14px">' + kpis + '</div>' +
        '<p class="hint" style="margin-top:12px;text-align:center">本手册按 V12 方案的作业码与口径整理，用于演示系统如何承载同一套流程；实际启用前须由业务、物流、采购与财务分别确认权限与阈值。</p>';
    }
  });

  function block(title, body, tone) {
    return '<div><div class="sec-t" style="margin-bottom:5px"><span class="dot dot--' + tone + '" style="margin:0"></span>' + title + '</div>' +
      '<div style="font-size:11.5px;color:var(--txt-2);line-height:1.6">' + body + '</div></div>';
  }
})(window);

</script>
<script>/* assets/js/app.js */
/* ==========================================================================
   app.js — boot, navigation, router, sim clock, theme
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A;
  const seed = A.buildSeed();
  const state = A.store.init(seed);

  const NAV = [
    { sec: '作业' },
    { id: 'overview', name: '指挥总览', icon: 'M4 13h5v7H4zM10 4h5v16h-5zM16 9h4v11h-4z', badge: 'queue' },
    { id: 'map', name: '地图调度', icon: 'M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z', badge: 'dispatch', dot: true },
    { id: 'ocean', name: '海运在途', icon: 'M3 14l9-4 9 4-9 4zM5 14v5h14v-5M12 3v7', badge: 'ocean' },
    { id: 'routing', name: '路径与比价', icon: 'M5 19V7m0 0 4 4m-4-4-4 4M19 5v12m0 0 4-4m-4 4-4-4' },
    { sec: '风控' },
    { id: 'ops', name: '异常与返修', icon: 'M12 3 2 20h20L12 3Zm0 5v6m0 3v.6', badge: 'exceptions' },
    { id: 'settlement', name: '结算复盘', icon: 'M4 5h16v14H4zM8 9h8M8 13h5M8 17h8' },
    { sec: '依据' },
    { id: 'runbook', name: '作业手册', icon: 'M5 4h9l5 5v11H5zM14 4v5h5' }
  ];

  const ICONS = {};
  NAV.forEach(function (n) { if (n.icon) ICONS[n.id] = n.icon; });

  function svgIcon(d, size) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 15) + '" height="' + (size || 15) + '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  }

  /* ── theme ────────────────────────────────────────────────────────── */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('.ico-moon').hidden = t === 'light';
    document.querySelector('.ico-sun').hidden = t !== 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#eef2f7' : '#070b12');
  }

  /* ── badges ───────────────────────────────────────────────────────── */
  function badges(s) {
    const q = s.orders.filter((o) => o.status === '待派' || o.status === '待命').length;
    const ex = (s.exceptions || []).filter((e) => e.status !== '已关闭').length;
    const oc = (s.ocean || []).filter(function (x) {
      const d = A.dt.diff(s.today, x.eta);
      return (x.stage === 'S03' || x.stage === 'S04') && (d <= 1 || A.oceanDoc(x).missingDue.length > 0);
    }).length;
    return { queue: { n: q, tone: 'amber' }, dispatch: { n: s.draft && s.draft.stops.length ? s.draft.stops.length : 0, tone: 'amber' }, exceptions: { n: ex, tone: '' }, ocean: { n: oc, tone: '' } };
  }

  function renderNav() {
    const nav = document.getElementById('railNav');
    const b = badges(state);
    nav.innerHTML = NAV.map(function (n) {
      if (n.sec) return '<div class="rail-sec">' + n.sec + '</div>';
      const bd = n.badge && b[n.badge] && b[n.badge].n ? '<em class="nav-badge" data-tone="' + b[n.badge].tone + '">' + b[n.badge].n + '</em>' : '';
      return '<a class="nav-item" href="#/' + n.id + '" data-nav="' + n.id + '">' +
        svgIcon(n.icon) + '<span>' + n.name + '</span>' + bd + '</a>';
    }).join('');
  }

  /* ── router ───────────────────────────────────────────────────────── */
  let current = null;
  function show(name, params) {
    const def = A.views[name] || A.views.overview;
    name = def.name;
    current = name;
    document.querySelectorAll('.view').forEach(function (v) {
      const on = v.dataset.view === name;
      v.hidden = !on;
      if (on) { v.style.animation = 'none'; void v.offsetWidth; v.style.animation = ''; }
    });
    document.getElementById('viewTitle').textContent = def.title || '';
    document.getElementById('viewSub').textContent = typeof def.sub === 'function' ? def.sub(state) : (def.sub || '');
    document.querySelectorAll('.nav-item').forEach(function (a) {
      a.classList.toggle('is-on', a.dataset.nav === name);
    });
    document.getElementById('rail').classList.remove('is-open');
    if (!def._mounted) {
      const host = document.querySelector('.view[data-view="' + name + '"]');
      def.mount(host, state);
      def._mounted = true;
    }
    if (def.update) def.update(state, params || {});
    renderNav();
  }

  function onRoute() {
    const r = A.router.parse();
    show(r.name, r.params);
  }

  /* ── sim clock ────────────────────────────────────────────────────── */
  let timer = null;
  function paintClock() {
    const el = document.getElementById('clockDate');
    const day = document.getElementById('clockDay');
    el.textContent = state.today;
    day.textContent = A.dt.weekday(state.today) + ' · 达拉斯 10:00';
    document.getElementById('btnPlay').setAttribute('aria-pressed', timer ? 'true' : 'false');
    document.querySelector('.ico-play').hidden = !!timer;
    document.querySelector('.ico-pause').hidden = !timer;
  }
  function advance(n) {
    state.today = A.dt.add(state.today, n || 1);
    A.store.set({}, { silent: false });
    paintClock();
    A.toast('推演时钟推进到 ' + state.today + ' · ' + A.dt.weekday(state.today), 'amber');
  }
  function togglePlay() {
    if (timer) { clearInterval(timer); timer = null; A.toast('推演已暂停', 'amber'); }
    else {
      timer = setInterval(function () { advance(1); }, 1500);
      A.toast('推演中：每 1.5 秒推进一天', 'teal');
    }
    paintClock();
  }

  /* ── boot ─────────────────────────────────────────────────────────── */
  function boot() {
    applyTheme(state.theme === 'light' ? 'light' : 'dark');
    document.getElementById('app').hidden = false;
    renderNav();
    paintClock();

    window.addEventListener('hashchange', onRoute);
    if (!location.hash) location.replace('#/overview');
    onRoute();

    document.getElementById('btnTheme').addEventListener('click', function () {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      applyTheme(state.theme);
      A.store.set({}, { silent: false });
    });
    document.getElementById('btnAdvance').addEventListener('click', function () { advance(1); });
    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnReset').addEventListener('click', function () {
      if (confirm('恢复初始演示数据？当前所有改动（派车、推进、勾选）将被清除。')) A.store.reset();
    });
    document.getElementById('btnRail').addEventListener('click', function () {
      document.getElementById('rail').classList.toggle('is-open');
    });

    document.addEventListener('keydown', function (e) {
      if (e.target.matches('input,textarea,select')) return;
      const idx = ['overview', 'map', 'ocean', 'routing', 'ops', 'settlement', 'runbook'];
      if (/^[1-7]$/.test(e.key)) location.hash = '#/' + idx[Number(e.key) - 1];
      if (e.key === '/' ) { const s = document.querySelector('.search .input'); if (s && s.offsetParent) { e.preventDefault(); s.focus(); } }
      if (e.key === 'Escape') { const d = document.getElementById('drawer'); if (d.classList.contains('is-open')) A.drawer.close(); }
    });

    A.store.subscribe(function () {
      renderNav();
      paintClock();
      const def = A.views[current];
      if (def && def.update) def.update(state, A.router.parse().params);
    });

    let rt = null;
    window.addEventListener('resize', A.debounce(function () {
      const def = A.views[current];
      if (def && def.onResize) def.onResize(state);
    }, 160));

    setTimeout(function () {
      const b = document.getElementById('boot');
      b.classList.add('is-done');
      setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 600);
    }, 380);
  }

  A.app = {
    get state() { return state; },
    go: A.router.go,
    refresh: function () { A.store.emit(); },
    setToday: function (d) { state.today = d; A.store.set({}); }
  };

  /* global drawer helper */
  A.drawer = {
    open(html, opts) {
      const d = document.getElementById('drawer');
      d.innerHTML = html;
      d.hidden = false;
      requestAnimationFrame(function () { d.classList.add('is-open'); });
      d.setAttribute('aria-hidden', 'false');
      if (opts && opts.onMount) opts.onMount(d);
    },
    close() {
      const d = document.getElementById('drawer');
      d.classList.remove('is-open');
      d.setAttribute('aria-hidden', 'true');
      setTimeout(function () { if (!d.classList.contains('is-open')) { d.hidden = true; d.innerHTML = ''; } }, 320);
    },
    isOpen() { return document.getElementById('drawer').classList.contains('is-open'); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
