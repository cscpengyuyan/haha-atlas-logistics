h1,h2,h3,h4,p,figure{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block}
::selection{background:var(--amber-soft);color:var(--txt)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono)}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none !important}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#25344b;border-radius:6px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#33465f;background-clip:content-box}
html[data-theme="light"] *::-webkit-scrollbar-thumb{background:#c6d2e1;background-clip:content-box}

/* ── boot ───────────────────────────────────────────────────────────── */
.boot{
  position:fixed;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:18px;
  background:var(--bg);color:var(--amber);transition:opacity .45s var(--ease),visibility .45s;
}
.boot.is-done{opacity:0;visibility:hidden;pointer-events:none}
.boot-mark{animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.boot-txt{text-align:center;display:grid;gap:5px}
.boot-txt b{font-size:15px;letter-spacing:.22em;color:var(--txt)}
.boot-txt span{font-size:12px;color:var(--txt-3)}

/* ── shell ──────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100vh;height:100dvh}

.rail{
  display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(17,28,46,.92),rgba(10,16,26,.96));
  backdrop-filter:blur(10px);
}
html[data-theme="light"] .rail{background:linear-gradient(180deg,#fff,#f6f9fc)}
html[data-theme="light"] .btn--prime{
  background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#1d4ed8;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 8px 18px -10px rgba(37,99,235,.95);
}
html[data-theme="light"] .btn--prime:hover{filter:brightness(1.05)}
html[data-theme="light"] .nav-item.is-on{background:rgba(37,99,235,.10);color:#1d4ed8}
html[data-theme="light"] .nav-item.is-on::before{background:#2563eb}
html[data-theme="light"] .brandmark{color:#1d4ed8}
.rail-brand{display:flex;align-items:center;gap:10px;padding:17px 16px 15px;border-bottom:1px solid var(--line-soft)}
.rail-logo{width:30px;height:30px;color:var(--amber);flex:none}
.rail-brandtxt{display:grid;line-height:1.15;min-width:0}
.rail-brandtxt b{font-size:14px;letter-spacing:.13em;font-weight:800}
.rail-brandtxt b span{color:var(--amber);margin-left:5px}
.rail-brandtxt i{font-size:10.5px;font-style:normal;color:var(--txt-3);letter-spacing:.02em;margin-top:2px;white-space:nowrap}

.rail-nav{flex:1;overflow-y:auto;padding:12px 9px;display:flex;flex-direction:column;gap:2px}
.rail-sec{font-size:10px;letter-spacing:.16em;color:var(--txt-3);padding:14px 9px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);
  color:var(--txt-2);font-size:12.5px;font-weight:500;position:relative;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.72;transition:opacity .16s}
.nav-item:hover{background:var(--panel-3);color:var(--txt);text-decoration:none}
.nav-item:hover svg{opacity:1}
.nav-item.is-on{background:var(--amber-soft);color:var(--amber)}
.nav-item.is-on svg{opacity:1}
.nav-item.is-on::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:2px;height:16px;border-radius:2px;background:var(--amber)}
.nav-item .nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--red-soft);color:var(--red);font-variant-numeric:tabular-nums}
.nav-item .nav-badge[data-tone="amber"]{background:var(--amber-soft);color:var(--amber)}
.nav-item .nav-badge[data-tone="blue"]{background:var(--blue-soft);color:var(--blue)}

.rail-foot{padding:11px;border-top:1px solid var(--line-soft);display:grid;gap:9px}
.rail-note{display:flex;gap:8px;padding:9px 10px;border-radius:var(--r-s);background:rgba(245,165,36,.07);border:1px solid rgba(245,165,36,.18)}
.rail-note b{display:block;font-size:11.5px;color:var(--amber-2)}
.rail-note i{display:block;font-size:10.5px;font-style:normal;color:var(--txt-3);line-height:1.45;margin-top:2px}
.rail-build{font-size:10px;color:var(--txt-3);text-align:center;letter-spacing:.04em}
.dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:5px}
.dot--amber{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.dot--red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.dot--green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.dot--teal{background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  height:var(--top-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--panel) 72%, transparent);
  backdrop-filter:blur(14px);z-index:20;
}
.topbar-title{min-width:0;flex:1}
.topbar-title h1{font-size:15.5px;font-weight:680;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title p{font-size:11.5px;color:var(--txt-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:none}

.clock{
  display:flex;align-items:center;gap:8px;padding:4px 6px 4px 5px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel-2);
}
.clock-face{display:grid;line-height:1.15;text-align:center;min-width:104px}
.clock-face span{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock-face small{font-size:9.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}

.icon-btn{
  display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-s);
  color:var(--txt-2);border:1px solid transparent;transition:.16s var(--ease);
}
.icon-btn:hover{background:var(--panel-3);color:var(--txt);border-color:var(--line)}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-size:11.5px;font-weight:550;
  transition:.16s var(--ease);
}
.ghost-btn:hover{color:var(--txt);border-color:var(--txt-3)}
.ghost-btn svg{opacity:.8}

.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:18px 18px 40px;animation:viewIn .32s var(--ease) both}
.view--flush{padding:0;overflow:hidden}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.wrap{max-width:1560px;margin:0 auto;display:grid;gap:14px}

/* ── primitives ─────────────────────────────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow);min-width:0;
}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:12.5px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:7px;min-width:0}
.card-h h3 .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--txt-3);text-transform:uppercase}
.card-h .sp{flex:1}
.card-b{padding:14px}
.card-b--tight{padding:10px 12px}
.card-b--flush{padding:0}

.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--txt-3);font-weight:650}
.muted{color:var(--txt-3)}
.sub{color:var(--txt-2)}
.hint{font-size:11px;color:var(--txt-3);line-height:1.55}

.tag{
  display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
  border:1px solid transparent;font-variant-numeric:tabular-nums;
}
.tag--amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(245,165,36,.24)}
.tag--teal{background:var(--teal-soft);color:var(--teal);border-color:rgba(45,212,191,.24)}
.tag--blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(91,141,239,.24)}
.tag--violet{background:var(--violet-soft);color:var(--violet);border-color:rgba(167,139,250,.24)}
.tag--red{background:var(--red-soft);color:var(--red);border-color:rgba(255,107,107,.24)}
.tag--green{background:var(--green-soft);color:var(--green);border-color:rgba(52,211,153,.24)}
.tag--plain{background:var(--panel-3);color:var(--txt-2);border-color:var(--line)}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--txt-2);transition:.15s var(--ease);white-space:nowrap}
.pill:hover{border-color:var(--txt-3);color:var(--txt)}
.pill.is-on{background:var(--amber-soft);border-color:rgba(245,165,36,.4);color:var(--amber)}
.pill .n{font-size:10px;font-variant-numeric:tabular-nums;opacity:.75}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;
  border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
  font-size:12px;font-weight:560;transition:.16s var(--ease);white-space:nowrap;
}
.btn:hover{border-color:var(--txt-3)}
.btn:active{transform:translateY(1px)}
.btn--prime{background:linear-gradient(180deg,var(--amber),#dc8f12);color:#1a1206;border-color:#c47f0c;font-weight:680;box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 6px 16px -8px rgba(245,165,36,.8)}
.btn--prime:hover{filter:brightness(1.06)}
.btn--prime:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.btn--ghost{background:transparent}
.btn--sm{height:26px;padding:0 9px;font-size:11.5px}
.btn--danger{color:var(--red);border-color:rgba(255,107,107,.34)}
.btn--danger:hover{background:var(--red-soft)}
.btn[aria-pressed="true"]{background:var(--amber-soft);border-color:rgba(245,165,36,.4);color:var(--amber)}

.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--panel-3);border:1px solid var(--line);gap:2px}
.seg button{padding:4px 10px;border-radius:6px;font-size:11.5px;color:var(--txt-2);font-weight:550;transition:.14s}
.seg button:hover{color:var(--txt)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
html[data-theme="light"] .seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(16,32,52,.14)}

.input,.select{
  height:30px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;color:var(--txt);min-width:0;transition:.15s;
}
.input::placeholder{color:var(--txt-3)}
.input:focus,.select:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 3px var(--amber-soft)}
.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.search{
  position:relative;display:flex;align-items:center;
}
.search svg{position:absolute;left:9px;color:var(--txt-3);pointer-events:none}
.search .input{padding-left:29px;width:100%}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:11.5px}
.kv dt{color:var(--txt-3);white-space:nowrap}
.kv dd{margin:0;color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}

.divide{height:1px;background:var(--line-soft);margin:12px 0}

/* ── tables ─────────────────────────────────────────────────────────── */
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r-m) var(--r-m)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.8px}
table.tbl th{
  position:sticky;top:0;z-index:2;text-align:left;font-size:10px;font-weight:650;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txt-3);padding:8px 11px;background:var(--panel-2);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tbody tr{transition:background .13s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tbody tr.is-sel{background:var(--amber-soft)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl td.c,table.tbl th.c{text-align:center}
table.tbl .num{font-variant-numeric:tabular-nums}
table.tbl tfoot td{padding:9px 11px;border-top:1px solid var(--line);background:var(--panel-2);font-weight:650;font-size:12px}

/* ── stats ──────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{
  position:relative;padding:13px 14px;border-radius:var(--r-m);background:var(--panel);
  border:1px solid var(--line);overflow:hidden;
}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--amber-soft));filter:blur(18px);opacity:.55}
.stat .lab{font-size:10.5px;color:var(--txt-3);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12px;font-weight:600;color:var(--txt-3);margin-left:3px}
.stat .meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--txt-3)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-size:11px;font-variant-numeric:tabular-nums}
.delta--up{color:var(--green)}
.delta--down{color:var(--red)}
.delta--flat{color:var(--txt-3)}

/* ── layout helpers ─────────────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.72fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row--tight{gap:5px}
.sp{flex:1}
.stack{display:grid;gap:10px}

/* ── map shell ──────────────────────────────────────────────────────── */
.map-shell{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;overflow:hidden}
.map-stage{position:relative;min-width:0;background:linear-gradient(180deg,#060a11,#0a1220 60%,#070d16)}
html[data-theme="light"] .map-stage{background:linear-gradient(180deg,#f3f7fc,#e9f0f8)}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map-svg.is-panning{cursor:grabbing}
.map-overlay{position:absolute;inset:0;pointer-events:none}
.map-overlay > *{pointer-events:auto}

.map-top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.map-top > *{max-width:100%}
.map-panel{
  background:color-mix(in srgb, var(--panel) 92%, transparent);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-lg);backdrop-filter:blur(12px);max-width:100%;
}
.map-filters{padding:7px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:100%}
.map-legend{
  position:absolute;left:12px;bottom:12px;padding:9px 11px;display:grid;gap:6px;font-size:10.5px;color:var(--txt-2)
}
.map-legend .li{display:flex;align-items:center;gap:7px}
.map-legend .sw{width:9px;height:9px;border-radius:3px;flex:none}
.map-zoom{position:absolute;right:12px;bottom:12px;display:grid;gap:1px;padding:3px}
.map-zoom button{width:30px;height:28px;display:grid;place-items:center;border-radius:5px;color:var(--txt-2);font-size:15px;font-weight:600}
.map-zoom button:hover{background:var(--panel-3);color:var(--txt)}
.map-hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10.5px;color:var(--txt-3);
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line-soft);
  padding:4px 10px;border-radius:99px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap;
}
.map-scale{position:absolute;right:12px;bottom:96px;font-size:10px;color:var(--txt-3);text-align:center;pointer-events:none}
.map-scale .bar{height:3px;border:1px solid currentColor;border-top:0;margin-top:2px}

/* side dock inside map view */
.dock{
  border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;
}
.dock-h{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.dock-h h2{font-size:13px;font-weight:650}
.dock-tabs{display:flex;gap:2px;padding:7px 9px;border-bottom:1px solid var(--line-soft)}
.dock-tabs button{flex:1;padding:5px 6px;border-radius:6px;font-size:11.5px;color:var(--txt-3);font-weight:550}
.dock-tabs button[aria-pressed="true"]{background:var(--panel-3);color:var(--txt)}
.dock-b{flex:1;overflow-y:auto;padding:11px 13px 20px;display:grid;gap:11px;align-content:start}
.dock-f{padding:9px 13px;border-top:1px solid var(--line);display:flex;gap:7px}

/* ── ocean board ────────────────────────────────────────────────────── */
.ocean-shell{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.ocean-bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.ocean-kpis{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:11px 14px 0}
.ocean-kpi{padding:9px 11px;border-radius:var(--r-s);background:var(--panel-2);border:1px solid var(--line-soft)}
.ocean-kpi .lab{font-size:10px;color:var(--txt-3);letter-spacing:.04em}
.ocean-kpi .v{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.ocean-kpi .v small{font-size:10.5px;color:var(--txt-3);font-weight:600;margin-left:2px}

.kanban{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(212px,1fr));gap:10px;padding:11px 14px 14px;overflow-x:auto}
.kcol{
  display:flex;flex-direction:column;min-height:0;border-radius:var(--r-m);
  background:var(--panel-2);border:1px solid var(--line-soft);
}
.kcol.is-over{border-color:var(--amber);background:var(--amber-soft)}
.kcol-h{padding:9px 10px 8px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel-2);border-radius:var(--r-m) var(--r-m) 0 0;z-index:1}
.kcol-h b{font-size:11.5px;font-weight:650;letter-spacing:.01em}
.kcol-h .cnt{margin-left:auto;font-size:10.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;background:var(--panel-3);padding:1px 6px;border-radius:99px}
.kcol-h .bar{position:absolute;left:0;top:0;height:2px;border-radius:2px 0 0 0;background:var(--accent,var(--txt-3))}
.kcol-b{flex:1;overflow-y:auto;padding:8px;display:grid;gap:8px;align-content:start;min-height:56px}

.kcard{
  border-radius:9px;background:var(--panel);border:1px solid var(--line);
  padding:9px 10px;display:grid;gap:6px;cursor:grab;position:relative;
  transition:transform .14s var(--ease),border-color .14s,box-shadow .14s;
}
.kcard:hover{border-color:var(--txt-3);transform:translateY(-1px);box-shadow:var(--shadow)}
.kcard.is-drag{opacity:.45}
.kcard.is-sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}

      <button class="icon-btn only-mobile" id="btnRail" aria-label="打开导航">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>

      <div class="topbar-title">

            <svg viewBox="0 0 24 24" width="15" height="15" class="ico-pause" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>

          <button class="icon-btn" id="btnAdvance" aria-label="推进一天">

        </div>

          <span>重置</span>

          <svg viewBox="0 0 24 24" width="16" height="16" class="ico-sun" hidden><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>

      <section class="view" data-view="ops" hidden></section>
      <section class="view" data-view="settlement" hidden></section>
      <section class="view" data-view="runbook" hidden></section>
    </main>

  /**
   * Quote a path for an order-shaped object.
   * Returns null when the path cannot deliver the purchased scope.
   */
  function quote(o, path) {
    const m = MODELS[o.model];
    const units = o.units;
    const lines = [];
    let blocker = null;

    if (path === 'A') {
      if (o.l4) blocker = '楼梯 / 特殊通道：普通卡派不做专项搬运';
      else if (o.level === 'L3') blocker = 'L3 室内机位：普通货运止于月台或入口';
      else if (o.selfPickup) {
        lines.push({ k: '仓内装车（客户车）', amt: 35 * units, note: '客户自带适配车，我方仅装车' });
        lines.push({ k: '提货授权与仓口交接', amt: 0, note: '客户自担后段' });
        return { path, total: 35 * units, lines, blocker: null, feasibility: 'ok' };
      } else {
        lines.push({ k: '原仓出库', amt: RATE.outbound * units });
        lines.push({ k: '普通卡派 ' + (o.level === 'L2' ? '入口档' : '月台档'), amt: Math.round(Math.max(185, o.miles * 0.95)) });
        if (o.level === 'L2') lines.push({ k: '尾板 / 预约', amt: 45, note: '按实际动作另计' });
      }
      const total = A.sum(lines, (l) => l.amt);
      return { path, total, lines, blocker, feasibility: blocker ? 'blocked' : 'ok' };
    }

    if (path === 'B') {
      if (o.level === 'L3' && m.hin > 84) { /* still deliverable by white glove */ }
      lines.push({ k: '原仓出库', amt: RATE.outbound * units });
      const first = firstPrice('B', o.level, o.l4);
      const extra = extraPrice('B', o.level, o.l4);
      lines.push({ k: '直提首台 ' + LEVELS[o.level].code, amt: first, note: '含车组、工具、脱托拆箱、摆位调平清运' });
      if (units > 1) lines.push({ k: '同址加台 ×' + (units - 1), amt: extra * (units - 1) });
      lines.push({ k: '停车 / 站', amt: RATE.stop });
      if (o.l5) lines.push({ k: 'L5 技术启用（另单 T5）', amt: ADDONS.L5.fee * units });
      return { path, total: A.sum(lines, (l) => l.amt), lines, blocker: null, feasibility: 'ok' };
    }

    // C1 / C2 — 经授权站
    const linehaul = Math.round(Math.max(RATE.linehaulMin, o.miles * RATE.linehaulPerMile));
    lines.push({ k: '原仓出库', amt: RATE.outbound * units });
    lines.push({ k: '干线（原仓 → ' + (o.stationId || '授权站') + '）', amt: linehaul, note: 'BOL 收货人为授权站' });
    lines.push({ k: '收发 ' + RATE.stationHandling + ' ×' + units, amt: RATE.stationHandling * units });
    lines.push({ k: '短存 ' + RATE.storageDaysDefault + ' 天', amt: RATE.storagePerUnitDay * units * RATE.storageDaysDefault, note: '免期从站方验收日起算' });
    const sFirst = firstPrice('C2', o.level, o.l4), sExtra = extraPrice('C2', o.level, o.l4);
    lines.push({ k: '二程首台 ' + LEVELS[o.level].code, amt: sFirst, note: '站至最终机位' });
    if (units > 1) lines.push({ k: '二程加台 ×' + (units - 1), amt: sExtra * (units - 1) });
    lines.push({ k: '停车 / 站', amt: RATE.stop });
    if (o.l5) lines.push({ k: 'L5 技术启用（另单 T5）', amt: ADDONS.L5.fee * units });
    let total = A.sum(lines, (l) => l.amt);
    if (path === 'C1') {
      const prem = Math.round(total * (RATE.c1Premium - 1));
      lines.push({ k: '统包协作溢价 6%', amt: prem, note: '一份主委托覆盖三段，异常只找主承方' });
      total += prem;
    }
    return { path, total, lines, blocker: null, feasibility: 'ok' };
  }

  function feasiblePaths(o) {

  /* seeded generation ------------------------------------------------- */
  const rand = A.rng(20261101);

    // curved path between two [lat,lng] points, always taking the short way round
    let bLng = b[1];
    if (bLng - a[1] > 180) bLng -= 360;
    if (bLng - a[1] < -180) bLng += 360;
    const bb = [b[0], bLng];
    const pts = [];
    const n = 40;
    const mlat = (a[0] + bb[0]) / 2, mlng = (a[1] + bb[1]) / 2;
    const dlat = bb[0] - a[0], dlng = bb[1] - a[1];
    const len = Math.sqrt(dlat * dlat + dlng * dlng) || 1;
    const nx = -dlng / len, ny = dlat / len;
    const off = (bulge == null ? 0.18 : bulge) * len;
    const cx = mlat + nx * off, cy = mlng + ny * off;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const u = 1 - t;
      pts.push([
        u * u * a[0] + 2 * u * t * cx + t * t * bb[0],
        u * u * a[1] + 2 * u * t * cy + t * t * bb[1]
      ]);
    }
    return pts;
  }

  A.MapEngine = function (host, opts) {
    opts = opts || {};
    const api = {};

    const map = L.map(host, {
      zoomControl: false,
      attributionControl: false,
      center: [38.5, -96],
      zoom: 4,
      minZoom: 2,
      maxZoom: 14,
      zoomSnap: 0,
      zoomDelta: 0.5,
      wheelPxPerZoomLevel: 110,
      worldCopyJump: true,
      preferCanvas: true,
      inertia: true,
      inertiaDeceleration: 2600
    });

    /* ── basemap (progressive fallback) ────────────────────────────── */
    let srcIndex = 0, tileErrors = 0, tiles = null;
    const fallback = L.layerGroup();

    function mountTiles(i) {
      const src = TILE_SOURCES[i];
      tiles = L.tileLayer(src.url, Object.assign({
        attribution: src.attribution,
        crossOrigin: true,
        detectRetina: false,
        errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='
      }, src.opts || {}));
      tiles.on('tileerror', function () {
        tileErrors++;
        if (tileErrors >= 5) {
          tileErrors = 0;
          map.removeLayer(tiles);
          if (srcIndex + 1 < TILE_SOURCES.length) {
            srcIndex++;
            mountTiles(srcIndex);
          } else {
            showFallback();
            if (opts.onTilesFail) opts.onTilesFail();
          }
        }
      });
      tiles.addTo(map);
      tiles.setZIndex(0);
    }

    function showFallback() {
      const geo = w.US_STATES;
      host.style.background = '#eef2f7';
      if (!geo) return;
      L.geoJSON(geo, {
        style: { color: '#c7d2e0', weight: 1, fillColor: '#f7f9fc', fillOpacity: 1 },
        interactive: false
      }).addTo(fallback);
      fallback.addTo(map);
    }

    mountTiles(0);

    /* ── panes / groups ─────────────────────────────────────────────── */
    const gLanes = L.layerGroup().addTo(map);
    const gRoute = L.layerGroup().addTo(map);
    const gNodes = L.layerGroup().addTo(map);
    const gOrders = L.layerGroup().addTo(map);
    const gPorts = L.layerGroup().addTo(map);

    let data = { orders: [], nodes: [], ocean: [], draft: null };
    let selected = null;
    let zoomHandler = null;

    /* ── markers ────────────────────────────────────────────────────── */
    function dotIcon(size, color, pulse) {
      return L.divIcon({
        className: 'mv-doticon',
        html: '<span class="mv-dotmark' + (pulse ? ' is-pulse' : '') + '" style="--c:' + color + ';width:' + size + 'px;height:' + size + 'px"></span>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function nodeIcon(n, isOrigin) {
      const cls = n.kind === 'inv' ? 'is-inv' : 'is-stn';
      return L.divIcon({
        className: 'mv-nodeicon',
        html: '<span class="mv-nodeglow ' + cls + (isOrigin ? ' is-origin' : '') + '"></span>' +
          '<span class="mv-nodelabel ' + cls + (isOrigin ? ' is-origin' : '') + '">' + n.id + '</span>',
        iconSize: [64, 40],
        iconAnchor: [32, 14]
      });
    }

    function clusterIcon(count) {
      const size = count > 24 ? 40 : count > 9 ? 34 : 28;
      return L.divIcon({
        className: 'mv-clustericon',
        html: '<span class="mv-cluster" style="width:' + size + 'px;height:' + size + 'px">' + count + '</span>',
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function stopIcon(i, late) {
      return L.divIcon({
        className: 'mv-stopicon',
        html: '<span class="mv-stopmark2' + (late ? ' is-late' : '') + '">' + i + '</span>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
    }

    function portIcon(code, name, kind) {
      return L.divIcon({
        className: 'mv-porticon',
        html: '<span class="mv-portdot ' + kind + '"></span><span class="mv-portlab ' + kind + '">' + code +
          (name ? '<i>' + name + '</i>' : '') + '</span>',
        iconSize: [10, 10],
        iconAnchor: [5, 5]
      });
    }

    /* ── render ─────────────────────────────────────────────────────── */
    function clearAll() {
      gLanes.clearLayers(); gRoute.clearLayers(); gNodes.clearLayers();
      gOrders.clearLayers(); gPorts.clearLayers();
    }

    function renderOrders() {
      gOrders.clearLayers();
      const byLevel = data.colorBy === 'level';
      const z = map.getZoom();
      const items = data.orders;
      if (!items.length) return;

      // cluster when zoomed out, individual markers when close in
      const cell = z >= 9 ? 0 : z >= 7 ? 26 : z >= 5 ? 40 : 56;
      let groups;
      if (!cell) {
        groups = items.map(function (o) { return [o]; });
      } else {
        const buckets = new Map();
        items.forEach(function (o) {
          const p = map.project([o.lat, o.lng], z);
          const k = Math.round(p.x / cell) + ':' + Math.round(p.y / cell);
          if (!buckets.has(k)) buckets.set(k, []);
          buckets.get(k).push(o);
        });
        groups = Array.from(buckets.values());
      }

      groups.forEach(function (list) {
        if (list.length === 1) {
          const o = list[0];
          const color = byLevel ? LEVEL_COLOR[o.level] : (STATUS_COLOR[o.status] || '#64748B');
          const r = 6 + (o.units - 1) * 1.1;
          const m = L.circleMarker([o.lat, o.lng], {
            radius: r, color: '#fff', weight: 2, opacity: 1,
            fillColor: color, fillOpacity: 1,
            bubblingMouseEvents: true
          });
          m.on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            if (opts.onSelect) opts.onSelect('order', o.id);
          });
          m.on('mouseover', function (e) { if (opts.onHover) opts.onHover({ type: 'order', id: o.id, evt: e.originalEvent }); });
          m.on('mouseout', function () { if (opts.onHover) opts.onHover(null); });
          m.addTo(gOrders);
          if (selected && selected.type === 'order' && selected.id === o.id) m.setStyle({ weight: 3, color: '#0F172A' });
        } else {
          let lat = 0, lng = 0;
          list.forEach(function (o) { lat += o.lat; lng += o.lng; });
          lat /= list.length; lng /= list.length;
          const mk = L.marker([lat, lng], { icon: clusterIcon(list.length), keyboard: false });
          mk.on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            map.flyTo([lat, lng], Math.min(11, map.getZoom() + 2.2), { duration: 0.55 });
          });
          mk.addTo(gOrders);
        }
      });
    }

    function renderNodes() {
      gNodes.clearLayers();
      const originId = data.draft && data.draft.origin;
      data.nodes.forEach(function (n) {
        const mk = L.marker([n.lat, n.lng], { icon: nodeIcon(n, n.id === originId), zIndexOffset: 500, keyboard: false });
        mk.on('click', function (e) {
          L.DomEvent.stopPropagation(e);
          if (opts.onSelect) opts.onSelect('node', n.id);
        });
        mk.on('mouseover', function (e) { if (opts.onHover) opts.onHover({ type: 'node', id: n.id, evt: e.originalEvent }); });
        mk.on('mouseout', function () { if (opts.onHover) opts.onHover(null); });
        mk.addTo(gNodes);
      });
    }

    function renderRoute() {
      gRoute.clearLayers();
      const plan = data.draft && data.draft.plan;
      if (!plan || !plan.legs || !plan.legs.length) return;
      const origin = A.C.nodeById[plan.origin];
      const pts = [[origin.lat, origin.lng]];
      plan.legs.forEach(function (l) { pts.push([l.to.lat, l.to.lng]); });

      L.polyline(pts, { color: '#ffffff', weight: 9, opacity: 0.95, lineJoin: 'round', lineCap: 'round' }).addTo(gRoute);
      L.polyline(pts, { color: '#2563EB', weight: 5, opacity: 0.95, lineJoin: 'round', lineCap: 'round' }).addTo(gRoute);

      plan.legs.forEach(function (l, i) {
        L.marker([l.to.lat, l.to.lng], { icon: stopIcon(i + 1, l.late), zIndexOffset: 600, keyboard: false })
          .addTo(gRoute);
        const hh = String(Math.floor(l.start / 60) % 24).padStart(2, '0') + ':' + String(Math.round(l.start) % 60).padStart(2, '0');
        L.marker([l.to.lat, l.to.lng], {
          interactive: false,
          icon: L.divIcon({ className: 'mv-anchor', html: '', iconSize: [1, 1] })
        }).bindTooltip(hh, {
          permanent: true, direction: 'bottom', className: 'mv-legtip' + (l.late ? ' is-late' : ''), offset: [0, 2]
        }).addTo(gRoute);
      });
    }

    function renderLanes() {
      gLanes.clearLayers();
      gPorts.clearLayers();
      if (!data.ocean || !data.ocean.length) return;
      const seen = {};
      data.ocean.forEach(function (s) {
        const key = s.lane.from + '>' + s.lane.to;
        if (seen[key]) return;
        seen[key] = 1;
        const from = A.C.PORTS[s.lane.from], to = A.C.PORTS[s.lane.to];
        const path = arc([from.lat, from.lng], [to.lat, to.lng], 0.16);
        L.polyline(path, { color: '#0EA5E9', weight: 2, opacity: 0.55, dashArray: '5 7' }).addTo(gLanes);
      });
      const origins = {}, dests = {};
      data.ocean.forEach(function (s) { origins[s.lane.from] = 1; dests[s.lane.to] = 1; });
      Object.keys(origins).forEach(function (code) {
        const p = A.C.PORTS[code];
        L.marker([p.lat, p.lng], { icon: portIcon(code, p.name, 'is-origin'), keyboard: false })
          .on('click', function () { if (opts.onSelect) opts.onSelect('port', code); })
          .addTo(gPorts);
      });
      Object.keys(dests).forEach(function (code) {
        const p = A.C.PORTS[code];
        L.marker([p.lat, p.lng], { icon: portIcon(code, '', 'is-dest'), keyboard: false })
          .on('click', function () { if (opts.onSelect) opts.onSelect('port', code); })
          .addTo(gPorts);
      });
    }

    api.render = function (d) {
      data = d;
      if (zoomHandler == null) {
        zoomHandler = function () { renderOrders(); };
        map.on('zoomend', zoomHandler);
      }
      const lz = (d.state.ui.mapLayers) || {};
      renderNodes();
      renderOrders();
      renderRoute();
      if (lz.lanes !== false) renderLanes(); else { gLanes.clearLayers(); gPorts.clearLayers(); }
      // keep the tile layer on top of nothing else; vectors live above tiles by pane order
    };

    api.select = function (type, id) {
      selected = type ? { type, id } : null;
      renderOrders();
    };

    /* ── camera ─────────────────────────────────────────────────────── */
    api.fitUS = function (animate) {
      const pad = opts.getPadding ? opts.getPadding() : { tl: [16, 16], br: [16, 16] };
      map.fitBounds(L.latLngBounds(US_BOUNDS), {
        paddingTopLeft: pad.tl,
        paddingBottomRight: pad.br,
        animate: !!animate,
        duration: 0.6
      });
    };
    api.focusOn = function (lat, lng, zoom) {
      map.flyTo([lat, lng], Math.min(12, Math.max(zoom || 9, map.getZoom())), { duration: 0.65 });
    };
    api.zoomIn = function () { map.zoomIn(1); };
    api.zoomOut = function () { map.zoomOut(1); };
    api.getZoom = function () { return map.getZoom(); };
    api.invalidate = function () { setTimeout(function () { map.invalidateSize(); }, 60); };
    api.fitRoute = function () {
      const plan = data.draft && data.draft.plan;
      if (!plan || !plan.legs.length) return;
      const origin = A.C.nodeById[plan.origin];
      const b = L.latLngBounds([[origin.lat, origin.lng]]);
      plan.legs.forEach(function (l) { b.extend([l.to.lat, l.to.lng]); });
      map.fitBounds(b, { padding: [90, 90], maxZoom: 11, animate: true });
    };
    api.map = map;
    api.destroy = function () { map.remove(); };

    opts.getPadding && api.fitUS(false);
    return api;
  };
})(window);

</script>
<script>/* assets/js/view-overview.js */
/* ==========================================================================
   view-overview.js — 指挥总览
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;

  function stats(s) {
    const open = s.orders.filter((o) => o.status === '待派' || o.status === '待命');
    const dueSoon = open.filter((o) => dt.diff(s.today, o.window.date) <= 2 && dt.diff(s.today, o.window.date) >= 0);
    const late = open.filter((o) => dt.diff(s.today, o.window.date) < 0);
    const seaUnits = s.ocean.filter((x) => x.stage === 'S02' || x.stage === 'S03').reduce((a, x) => a + x.units, 0);
    const boxes = s.ocean.filter((x) => x.stage !== 'REC').length;
    const demo = s.ocean.filter(function (x) {
      if (x.stage === 'REC' || x.stage === 'S01' || x.stage === 'S02') return false;
      const eta = x.actualEta || x.eta;
      const days = dt.diff(s.today, eta);
      return days >= -(x.freeDays) && days <= 2;
    });
    const exc = (s.exceptions || []).filter((e) => e.status !== '已关闭');
    const inTransitUnits = s.orders.filter((o) => o.status === '已派' || o.status === '执行中').reduce((a, o) => a + o.units, 0);
    const done = s.orders.filter((o) => o.status === '已签收');
    const cost = done.length ? A.sum(done, (o) => o.agreed || o.quoteBase) / A.sum(done, (o) => o.units) : null;
    return { open, dueSoon, late, seaUnits, boxes, demo, exc, inTransitUnits, done, cost };
  }

  function spark7(s) {
    const days = Array.from({ length: 8 }, (_, i) => dt.add(s.today, i));
    const oceanDay = days.map((d) => s.ocean.filter((x) => x.stage !== 'REC' && dt.diff(x.eta, d) === 0).length);
    const winDay = days.map((d) => s.orders.filter((o) => o.window.date === d && (o.status === '待派' || o.status === '待命' || o.status === '已派')).length);
    return days.map(function (d, i) {
      return {
        d, ocean: oceanDay[i], win: winDay[i],
        isToday: d === s.today
      };
    });
  }

  A.registerView('overview', {
    title: '指挥总览',
    sub: function (s) { return '截至 ' + dt.md(s.today) + ' · 演示数据 · 达拉斯试点口径'; },

    mount: function (host) {
      host.innerHTML = '<div class="wrap" id="ovRoot"></div>';
      A.delegate(host, 'click', '[data-go]', function (e, t) {
        A.router.go(t.dataset.go, t.dataset.params ? JSON.parse(t.dataset.params) : null);
      });
    },

    update: function (s) {
      const st = stats(s);
      const root = document.getElementById('ovRoot');
      if (!root) return;

      const hero = '' +
        '<div class="card" style="overflow:hidden;position:relative">' +
        '<div style="position:absolute;inset:0;background:radial-gradient(720px 200px at 12% -30%, rgba(245,165,36,.16), transparent 70%);pointer-events:none"></div>' +
        '<div class="card-b" style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:center;padding:18px 20px">' +
        '<div>' +
        '<div class="eyebrow">HAHA ATLAS · 美国大件设备 · 海运 + 末端一体化</div>' +
        '<h2 style="font-size:21px;line-height:1.35;font-weight:700;letter-spacing:-.015em;margin:7px 0 6px">' +
        '先把已售设备按客户买下的服务送到约定位置，再用每一站的实际动作和最终账单判断哪段值得改。</h2>' +
        '<p class="hint" style="max-width:74ch">今天是 <b class="num">' + s.today + '</b>（' + dt.weekday(s.today) + '）。' +
        '当前 <b style="color:var(--amber)">' + st.open.length + '</b> 票待派或待命，其中 <b style="color:var(--red)">' + st.late.length + '</b> 票已过期望窗；' +
        '海上有 <b>' + st.boxes + '</b> 个航次、<b>' + fmt.n(st.seaUnits) + '</b> 台在途；在途陆运 <b>' + st.inTransitUnits + '</b> 台。</p>' +
        '<div class="row" style="margin-top:11px">' +
        '<button class="btn btn--prime" data-go="map">打开地图调度</button>' +
        '<button class="btn" data-go="ocean">查看海运看板</button>' +
        '<button class="btn btn--ghost" data-go="routing">比价与换线判定</button>' +
        '</div></div>' +
        '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">' +
        miniStat('待派 / 待命', st.open.length, '票', 'var(--amber)') +
        miniStat('到港免期告警', st.demo.length, '航次', st.demo.length ? 'var(--red)' : 'var(--green)') +
        miniStat('未结异常', st.exc.length, '单', st.exc.length ? 'var(--red)' : 'var(--green)') +
        miniStat('已签收', st.done.length, '票', 'var(--teal)') +
        '</div></div></div>';

      const statCards = '<div class="stat-grid" style="margin-top:14px">' +
        stat('今日到期窗口', st.dueSoon.length, '票', 'amber', '未来 48 小时内须到场', true) +
        stat('海上在途', fmt.n(st.seaUnits), '台', 'blue', st.boxes + ' 个航次未入仓') +
        stat('在途陆运', st.inTransitUnits, '台', 'teal', '已派或执行中') +
        stat('单台成功成本', st.cost ? fmt.usd(st.cost) : '—', '', 'violet', '已签收样本 ' + st.done.length + ' 票') +
        stat('基线原窗准时', fmt.pct(s.baseline.ontime), '', 'amber', '演示基线 · 非实测声明') +
        '</div>';

      /* network load */
      const byNode = A.C.NODES.map(function (n) {
        const list = s.orders.filter((o) => o.nodeId === n.id);
        return { k: n.id, v: list.length, t: list.length + ' 票 · ' + A.sum(list, (o) => o.units) + ' 台', c: n.kind === 'inv' ? 'var(--amber)' : 'var(--violet)' };
      }).sort((a, b) => b.v - a.v);

      const week = spark7(s);
      const maxBar = Math.max(1, ...week.map((x) => x.ocean + x.win));
      const bars = week.map(function (x) {
        const total = x.ocean + x.win;
        return '<div style="display:grid;grid-template-rows:1fr auto;gap:5px;align-items:end;min-width:0;cursor:default" title="' + x.d + '：到港 ' + x.ocean + ' · 窗口 ' + x.win + '">' +
          '<div style="display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:112px">' +
          (x.ocean ? '<i style="height:' + (x.ocean / maxBar * 100) + '%;background:var(--blue);border-radius:3px 3px 0 0;min-height:3px" title="到港 ' + x.ocean + '"></i>' : '') +
          (x.win ? '<i style="height:' + (x.win / maxBar * 100) + '%;background:var(--amber);border-radius:3px 3px 0 0;min-height:3px;opacity:.85" title="窗口 ' + x.win + '"></i>' : '') +
          (!total ? '<i style="height:2px;background:var(--panel-3);border-radius:2px"></i>' : '') +
          '</div>' +
          '<div style="text-align:center;font-size:9.5px;color:' + (x.isToday ? 'var(--amber)' : 'var(--txt-3)') + ';font-variant-numeric:tabular-nums">' + (x.isToday ? '今天' : dt.mmdd(x.d)) + '</div>' +
          '</div>';
      }).join('');

      /* exceptions */
      const excRows = st.exc.slice(0, 5).map(function (e) {
        const o = s.orders.find((x) => x.id === e.orderId);
        const t = A.C.EXC_TYPES.find((x) => x.id === e.type);
        const over = e.ageH > e.sla * 2;
        return '<div style="display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)">' +
          '<span class="dot" style="background:' + (over ? 'var(--red)' : 'var(--amber)') + ';margin:0"></span>' +
          '<div style="min-width:0"><div style="font-size:11.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + t.name + ' · ' + (o ? o.city + ' ' + o.zip : e.orderId) + '</div>' +
          '<div style="font-size:10.5px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + e.note + '</div></div>' +
          '<div style="text-align:right"><div class="num" style="font-size:11px;color:' + (over ? 'var(--red)' : 'var(--txt-2)') + '">' + e.ageH + 'h</div>' +
          '<div style="font-size:9.5px;color:var(--txt-3)">SLA ' + e.sla + 'h</div></div></div>';
      }).join('') || '<div class="empty"><b>没有未结异常</b><span>保持现状即可</span></div>';

      /* queue table */
      const queue = st.open.slice().sort((a, b) => a.window.date.localeCompare(b.window.date)).slice(0, 7);
      const qRows = queue.map(function (o) {
        const q = A.pricing.quote(o, 'B');
        const late = dt.diff(s.today, o.window.date) < 0;
        return '<tr data-go="map" data-params=\'' + JSON.stringify({ o: o.id }) + '\' style="cursor:pointer">' +
          '<td class="mono" style="font-size:10.8px">' + o.id + '</td>' +
          '<td><b>' + o.city + '</b> <span class="muted">' + o.st + ' ' + o.zip + '</span></td>' +
          '<td>' + o.model + ' ×' + o.units + '</td>' +

  }

<script>/* assets/js/view-map.js */
/* ==========================================================================
   view-map.js — 地图调度（macOS 地图式交互）
   左侧毛玻璃结果列表 · 地图直接操作 · 右侧情境检视器 · 底部派车计划条
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;

  const DRIVERS = ['M. Alvarez', 'J. Whitaker', 'R. Patel', 'D. Okafor', 'L. Nguyen', 'C. Ramirez'];
  const PLATES = ['TX-8842-KB', 'TX-2271-QD', 'CA-5510-MR', 'NJ-9930-TX', 'FL-4417-LP'];

  let engine = null;
  let view = null;
  let inspKey = '';
  let lastPlanKey = '';

  /* ── planning maths ──────────────────────────────────────────────── */
  function svcMinutes(o) {
    const base = o.level === 'L1' ? 18 : o.level === 'L2' ? 32 : 55;
    let m = base + (o.units - 1) * base * 0.45;
    if (o.l4) m += 40;
    if (o.l5) m += 65;
    return Math.round(m);
  }
  function driveMinutes(miles) {
    return Math.round((miles / 52) * 60 + Math.floor(miles / 180) * 12);
  }
  function hhmm(min) {
    const m = Math.max(0, Math.round(min));
    return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function toMin(s) { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); }

  function planStops(originId, picks, strategy, state) {
    const origin = A.C.nodeById[originId];
    const pts = picks.map(function (id) { return state.orders.find((o) => o.id === id); }).filter(Boolean);
    if (strategy === 'nearest') {
      const rest = pts.slice(), seq = [];
      let cur = origin;
      while (rest.length) {
        let bi = 0, bd = Infinity;
        rest.forEach(function (o, i) {
          const d = A.geo.roadMiles(cur, o);
          if (d < bd) { bd = d; bi = i; }
        });
        seq.push(rest.splice(bi, 1)[0]);
        cur = seq[seq.length - 1];
      }
      return seq;
    }
    return pts.slice().sort(function (a, b) {
      return (a.window.date + a.window.from).localeCompare(b.window.date + b.window.from);
    });
  }

  function buildPlan(state, originId, stopIds, strategy) {
    const origin = A.C.nodeById[originId];
    if (!origin || !stopIds.length) return null;
    const seq = planStops(originId, stopIds, strategy, state);
    const legs = [];
    let clock = 8 * 60, prev = origin, totalMiles = 0, totalDrive = 0, violations = 0, waitTotal = 0;

    seq.forEach(function (o, i) {
      const miles = Math.round(A.geo.roadMiles(prev, o));
      const drive = driveMinutes(miles);
      const arrive = clock + drive;
      const wFrom = toMin(o.window.from), wTo = toMin(o.window.to);
      let wait = 0, start = arrive;
      if (arrive < wFrom) { wait = wFrom - arrive; start = wFrom; }
      const svc = svcMinutes(o);
      const depart = start + svc;
      const late = start > wTo;
      const tight = !late && depart > wTo;
      if (late || tight) violations++;
      legs.push({
        idx: i + 1, order: o, from: i === 0 ? origin : seq[i - 1], to: o,
        miles, drive, arrive, start, depart, wait, svc,
        window: o.window, late, tight, slack: wTo - (start + svc)
      });
      totalMiles += miles; totalDrive += drive; waitTotal += wait;
      clock = depart; prev = o;
    });

    const stops = [];
    legs.forEach(function (l) {
      const z = l.to.zip;
      let st = stops.find((s) => s.zip === z);
      if (!st) stops.push(st = { zip: z, units: 0, orders: [] });
      st.units += l.to.units;
      st.orders.push(l.to);
    });
    const FIXED = 38, OUT = A.C.RATE.outbound, STOPFEE = A.C.RATE.stop;
    let single = 0, combined = 0;
    seq.forEach(function (o) {
      const q = A.pricing.quote(o, 'B');
      single += q.total + FIXED + OUT * (o.units - 1);
    });
    stops.forEach(function (st) {
      const first = st.orders[0];
      const f = A.pricing.firstPrice('B', first.level, first.l4);
      const e = A.pricing.extraPrice('B', first.level, first.l4);
      const tech = A.sum(st.orders, (o) => (o.l5 ? A.C.ADDONS.L5.fee * o.units : 0));
      st.cost = OUT * st.units + f + e * (st.units - 1) + STOPFEE + tech;
      combined += st.cost;
    });
    combined += FIXED;

    const sameZipSaved = stops.reduce(function (a, st) {
      if (st.units < 2) return a;
      const f = A.pricing.firstPrice('B', st.orders[0].level, st.orders[0].l4);
      const e = A.pricing.extraPrice('B', st.orders[0].level, st.orders[0].l4);
      return a + (f - e) * (st.units - 1);
    }, 0);

    return {
      origin: originId, strategy, legs, stops,
      miles: totalMiles, drive: totalDrive, wait: waitTotal, finish: clock,
      violations, single: Math.round(single), combined: Math.round(combined),
      saved: Math.round(single - combined), sameZipSaved: Math.round(sameZipSaved),
      stopIds: seq.map((o) => o.id), units: A.sum(seq, (o) => o.units)
    };
  }

  /* ── small builders ──────────────────────────────────────────────── */
  function levelChip(level) {
    const map = { L1: 'l1', L2: 'l2', L3: 'l3' };
    return '<span class="mv-chip mv-chip--' + map[level] + '">' + level + '</span>';
  }
  function statusDot(status) {
    const map = { '待派': 'orange', '待命': 'purple', '已派': 'blue', '执行中': 'teal', '已签收': 'green', '异常': 'red' };
    return '<i class="mv-dot mv-dot--' + (map[status] || 'gray') + '"></i>';
  }
  function winText(o) {
    const d = dt.diff(A.app.state.today, o.window.date);
    const day = d === 0 ? '今天' : d === 1 ? '明天' : d === -1 ? '昨天' : dt.mmdd(o.window.date);
    return day + ' ' + o.window.from + '–' + o.window.to;
  }
  function money(v) { return '$' + fmt.n(v, 0); }

  /* ── left: result list ───────────────────────────────────────────── */
  function visibleOrders(s) {
    const q = (s.ui.mapQuery || '').trim().toLowerCase();
    const lv = s.ui.mapLevel || 'ALL';
    return s.orders.filter(function (o) {
      if (lv !== 'ALL' && o.level !== lv) return false;
      if (q) {
        const hay = (o.id + ' ' + o.city + ' ' + o.st + ' ' + o.zip + ' ' + o.model).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort(function (a, b) {
      const ra = { 异常: 0, 待派: 1, 待命: 2, 执行中: 3, 已派: 4, 已签收: 5 };
      return (ra[a.status] - ra[b.status]) || (a.window.date + a.window.from).localeCompare(b.window.date + b.window.from);
    });
  }

  function renderList(s) {
    const list = visibleOrders(s);
    if (!list.length) {
      return '<div class="mv-empty"><b>没有匹配的订单</b><span>试试清空搜索或切换服务档</span></div>';
    }
    const groups = [
      { key: 'today', name: '今天到期', items: list.filter((o) => o.window.date === s.today) },
      { key: 'tomorrow', name: '明天', items: list.filter((o) => dt.diff(s.today, o.window.date) === 1) },
      { key: 'later', name: '之后', items: list.filter((o) => dt.diff(s.today, o.window.date) > 1) },
      { key: 'past', name: '已过期 / 无需派车', items: list.filter((o) => dt.diff(s.today, o.window.date) < 0) }
    ];
    const selId = s.ui.mapSel;
    return groups.filter((g) => g.items.length).map(function (g) {
      return '<div class="mv-group"><div class="mv-group-h">' + g.name + '<span>' + g.items.length + '</span></div>' +
        g.items.slice(0, 40).map(function (o) {
          const q = A.pricing.quote(o, 'B');
          const inPlan = s.draft.stops.includes(o.id);
          return '<div class="mv-row' + (o.id === selId ? ' is-sel' : '') + (inPlan ? ' is-in' : '') + '" data-act="pick" data-id="' + o.id + '" role="button" tabindex="0">' +
            '<span class="mv-row-dot">' + statusDot(o.status) + '</span>' +
            '<span class="mv-row-main">' +
            '<span class="mv-row-t">' + o.city + '<i>' + o.st + ' ' + o.zip + '</i></span>' +
            '<span class="mv-row-s">' + o.model + ' ×' + o.units + ' · ' + o.level + (o.l4 ? '+L4' : '') + ' · ' + winText(o) + '</span>' +
            '</span>' +
            '<span class="mv-row-end">' + (inPlan ? '<span class="mv-inplan">已选</span>' : '<b>' + money(q ? q.total : 0) + '</b>') +
            (inPlan ? '' : '<span class="mv-quick" data-act="quick-add" data-id="' + o.id + '" title="加入派车计划">' +
              '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>') +
            '</span></div>';
        }).join('') + '</div>';
    }).join('');
  }

  /* ── right: contextual inspector ─────────────────────────────────── */
  function renderInspector(s) {

    const plan = s.draft.plan;
    const mode = o ? 'order' : plan ? 'plan' : 'empty';
    const key = mode + ':' + (o ? o.id + ':' + (plan ? plan.stops.length : 0) : plan ? plan.stopIds.join(',') : '');
    const fresh = key !== inspKey;

    let inner = '';

      inner = '<div class="mv-insp-empty">' +
        '<svg viewBox="0 0 48 48" width="34" height="34"><path d="M24 8c-6.6 0-12 5.2-12 11.6C12 28 24 40 24 40s12-12 12-20.4C36 13.2 30.6 8 24 8Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="19" r="4" fill="currentColor" opacity=".5"/></svg>' +
        '<b>选择一个订单</b><span>在左侧列表或地图上轻点订单，查看服务档、窗口与三种路径的比价。</span></div>';
    } else if (mode === 'order') {
      const qA = A.pricing.quote(o, 'A'), qB = A.pricing.quote(o, 'B');
      const qC1 = A.pricing.quote(o, 'C1'), qC2 = A.pricing.quote(o, 'C2');
      const inPlan = s.draft.stops.includes(o.id);
      const node = A.C.nodeById[o.nodeId];
      const best = [qA, qB, qC1, qC2].filter((q) => q && q.feasibility !== 'blocked').sort((a, b) => a.total - b.total)[0];
      inner =
        '<div class="mv-insp-h">' +
        '<div class="mv-insp-title"><h2>' + o.city + '</h2><p>' + o.st + ' ' + o.zip + ' · 起运 ' + node.id + '</p></div>' +
        '<button class="mv-round" data-act="close-insp" aria-label="关闭">' +
        '<svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>' +
        '</div>' +
        '<div class="mv-insp-body">' +
        '<div class="mv-tags">' +

        '<div class="mv-rows">' +
        kv('交付窗口', winText(o) + (o.hard ? ' · 硬窗' : '')) +

        '</div>' +
        '<div class="mv-sec"><div class="mv-sec-h">同范围全价</div>' +

        priceCell('A', '卡派 / 自提', qA, best && best.path === 'A') +

        '<button class="mv-round" data-act="clear-plan" aria-label="清空">' +

        }).join('') + '</div></div>' +

        kv('分票直送合计', money(plan.single)) +

        '</div>';
    }

    return '<div class="mv-inspector-inner' + (fresh ? ' is-fresh' : '') + '">' + inner + '</div>';
  }

  function kv(k, v) { return '<div class="mv-kv"><span>' + k + '</span><b>' + v + '</b></div>'; }
  function bigNum(v, unit, label) {
    return '<div class="mv-bignum"><b>' + v + (unit ? '<i>' + unit + '</i>' : '') + '</b><span>' + label + '</span></div>';
  }
  function priceCell(code, name, q, best) {
    const blocked = !q || q.feasibility === 'blocked';
    return '<div class="mv-price' + (blocked ? ' is-blocked' : '') + (best ? ' is-best' : '') + '">' +
      '<span class="mv-price-code">' + code + '</span>' +
      '<span class="mv-price-name">' + name + '</span>' +
      '<b>' + (blocked ? '不可行' : money(q.total)) + '</b>' +
      (best ? '<i class="mv-price-best">最优</i>' : '') +
      '</div>';
  }

  /* ── bottom: plan bar ────────────────────────────────────────────── */
  function renderPlanBar(s) {
    const plan = s.draft.plan;
    if (!plan) return '';
    return '<div class="mv-planbar-in">' +
      '<div class="mv-stops">' + plan.legs.map(function (l, i) {
        return '<button class="mv-stop" data-act="pick" data-id="' + l.to.id + '" style="animation-delay:' + (i * 40) + 'ms">' +
          '<span class="mv-stop-n">' + (i + 1) + '</span>' +
          '<span class="mv-stop-t">' + l.to.city + '<i>' + hhmm(l.start) + '</i></span>' +
          '<span class="mv-stop-x" data-act="remove-stop" data-id="' + l.to.id + '">' +
          '<svg viewBox="0 0 24 24" width="10" height="10"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>' +
          '</button>';
      }).join('') + (plan.stops.length < 5 ? '<span class="mv-stop-add">再选最多 ' + (5 - plan.stops.length) + ' 站</span>' : '') + '</div>' +
      '<div class="mv-planbar-mid">' +
      '<b>' + money(plan.combined) + '</b>' +
      '<span>' + fmt.n(plan.miles) + ' mi · ' + fmt.dur(plan.drive) + ' · 收车 ' + hhmm(plan.finish) + '</span>' +
      '</div>' +
      '<div class="mv-planbar-actions">' +
      '<button class="mv-btn mv-btn--sm" data-act="fit-route">看路线</button>' +
      '<button class="mv-btn mv-btn--sm" data-act="open-plan">详情</button>' +
      '<button class="mv-btn mv-btn--primary" data-act="gen-plan">生成派车单</button>' +
      '</div></div>';
  }

  /* ── layers popover ──────────────────────────────────────────────── */
  function renderPopover(s) {
    const lz = s.ui.mapLayers || {};
    const rows = [
      ['lanes', '海运航线'],
      ['zones', '150 mi 覆盖圈'],
      ['pins', '订单点位'],
      ['roads', '路网'],
      ['nodes', '仓库与区域站']
    ];
    return '<div class="mv-pop-h">图层</div>' +
      rows.map(function (r) {
        return '<button class="mv-pop-row" data-act="layer" data-v="' + r[0] + '">' +
          '<span>' + r[1] + '</span>' +
          '<i class="mv-switch' + (lz[r[0]] !== false ? ' is-on' : '') + '"></i></button>';
      }).join('') +
      '<div class="mv-pop-div"></div>' +
      '<button class="mv-pop-row" data-act="color" data-v="status"><span>按状态着色</span><i class="mv-check' + (s.ui.mapColor !== 'level' ? ' is-on' : '') + '"></i></button>' +
      '<button class="mv-pop-row" data-act="color" data-v="level"><span>按服务档着色</span><i class="mv-check' + (s.ui.mapColor === 'level' ? ' is-on' : '') + '"></i></button>' +
      '<div class="mv-pop-div"></div>' +
      '<div class="mv-pop-legend">' +
      '<span><i class="mv-dot mv-dot--orange"></i>待派</span><span><i class="mv-dot mv-dot--blue"></i>已派</span>' +
      '<span><i class="mv-dot mv-dot--green"></i>已签收</span><span><i class="mv-dot mv-dot--red"></i>异常</span>' +
      '</div>';
  }

  /* ── camera framing that respects the floating panels ───────────── */
  function mapPadding() {
    const root = document.querySelector('.mv');
    if (!root) return { tl: [16, 70], br: [16, 100] };
    const W = root.clientWidth, H = root.clientHeight;
    const rr = root.getBoundingClientRect();
    if (W < 900) return { tl: [12, Math.min(230, H * 0.32)], br: [12, Math.min(250, H * 0.36)] };
    const side = document.querySelector('.mv-side');
    const l = side ? side.getBoundingClientRect().right - rr.left + 18 : 20;
    const inspector = document.getElementById('mvInspector');
    const open = inspector && inspector.classList.contains('is-open');
    const r = open ? 366 : 56;
    return { tl: [l, 74], br: [r, 104] };
  }
  function home(animate) {
    if (engine) engine.fitUS(animate);
  }

  /* ── view ────────────────────────────────────────────────────────── */
  A.registerView('map', {
    title: '地图调度',
    sub: '轻点订单加入计划 · 拖动平移 · 双指或滚轮缩放',

    mount: function (host, s) {
      s.ui.mapLevel = s.ui.mapLevel || 'ALL';
      s.ui.mapLayers = s.ui.mapLayers || { lanes: true, zones: false, pins: true, roads: true, nodes: true };

      host.innerHTML =
        '<div class="mv">' +
        '<div class="mv-canvas" id="mvCanvas"></div>' +
        '<div class="mv-topglass">' +
        '<div class="mv-seg" id="mvSeg">' +
        ['ALL', 'L1', 'L2', 'L3'].map(function (k) {
          return '<button data-act="level" data-v="' + k + '"' + (s.ui.mapLevel === k ? ' class="is-on"' : '') + '>' + (k === 'ALL' ? '全部' : k) + '</button>';
        }).join('') + '</div>' +
        '<button class="mv-ctl" data-act="toggle-pop" id="mvPopBtn">' +
        '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>图层</button>' +
        '</div>' +
        '<aside class="mv-side" id="mvSide">' +
        '<div class="mv-side-h">' +
        '<div class="mv-search">' +
        '<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
        '<input id="mvSearch" placeholder="搜索订单、城市或 ZIP" autocomplete="off">' +
        '</div>' +
        '</div>' +
        '<div class="mv-list" id="mvList"></div>' +
        '<div class="mv-side-f" id="mvSideF"></div>' +
        '</aside>' +
        '<aside class="mv-inspector" id="mvInspector" aria-live="polite"></aside>' +
        '<div class="mv-planbar" id="mvPlanBar"></div>' +
        '<div class="mv-zoom">' +
        '<button data-act="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
        '<span class="mv-zoom-div"></span>' +
        '<button data-act="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
        '</div>' +
        '<button class="mv-home" data-act="home" aria-label="全美视图">' +
        '<svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 11.2 12 4l8 7.2V20H4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>' +
        '<div class="mv-attrib">底图 © Esri · © OpenStreetMap</div>' +
        '<div class="mv-popover" id="mvPopover" hidden></div>' +
        '</div>';

      engine = A.MapEngine(document.getElementById('mvCanvas'), {
        getPadding: mapPadding,
        onTilesFail: function () {
          A.toast('底图瓦片不可用，已切换到离线示意模式', 'amber');
          document.getElementById('mvCanvas').classList.add('is-offline');
        },
        onSelect: function (type, id) {
          if (type === 'order') {
            s.ui.mapSel = id;
            A.store.emit();
          } else if (type === 'node') {
            if (s.draft.origin !== id) {
              s.draft.origin = id;
              s.draft.stops = s.draft.stops.filter(function (oid) {
                const o = s.orders.find((x) => x.id === oid);
                return o && o.nodeId === id;
              });
              s.draft.plan = s.draft.stops.length ? buildPlan(s, id, s.draft.stops, s.draft.order) : null;
              A.store.emit();
              A.toast('起运仓切换为 ' + id, 'teal');
            }
          } else if (type === 'port') {
            A.router.go('ocean', { port: id });
          } else {
            s.ui.mapSel = null;
            A.store.emit();
          }
        },
        onHover: function (t) {
          if (!t) { A.tip.hide(); return; }
          if (t.type === 'order') {
            const o = s.orders.find((x) => x.id === t.id);
            if (o) A.tip.show('<b>' + o.city + ' ' + o.st + '</b><br>' + o.model + ' ×' + o.units + ' · ' + o.level +
              '<br>' + o.status + ' · ' + winText(o), t.evt.clientX, t.evt.clientY);
          } else if (t.type === 'node') {
            const n = A.C.nodeById[t.id];
            if (n) A.tip.show('<b>' + n.id + '</b> ' + n.name + '<br>' + n.city + ' ' + n.zip, t.evt.clientX, t.evt.clientY);
          }
        }
      });

      const root = host.querySelector('.mv');
      root.addEventListener('click', onClick);
      root.addEventListener('input', function (e) {
        if (e.target.id === 'mvSearch') {
          s.ui.mapQuery = e.target.value;
          document.getElementById('mvList').innerHTML = renderList(s);
          document.getElementById('mvSideF').textContent = visibleOrders(s).length + ' 个结果';
        }
      });
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape' && s.ui.mapSel) { s.ui.mapSel = null; A.store.emit(); }
      });

      view = this;
      this._s = s;
      A._mapEngine = engine;   // handy for debugging / automated checks
      engine.invalidate();
      home(false);
    },

    update: function (s, params) {
      if (!engine) return;
      this._s = s;

      if (params && params.o) {
        const o = s.orders.find((x) => x.id === params.o);
        if (o) { s.ui.mapSel = o.id; engine.focusOn(o.lat, o.lng, 10); }
      }

      document.getElementById('mvList').innerHTML = renderList(s);
      document.getElementById('mvSideF').textContent = visibleOrders(s).length + ' 个结果';
      const searchEl = document.getElementById('mvSearch');
      if (searchEl && searchEl.value !== (s.ui.mapQuery || '')) searchEl.value = s.ui.mapQuery || '';

      const insp = document.getElementById('mvInspector');
      insp.innerHTML = renderInspector(s);
      insp.classList.toggle('is-open', !!(s.ui.mapSel || s.draft.plan));

      const bar = document.getElementById('mvPlanBar');
      const planKey = s.draft.plan ? s.draft.plan.stopIds.join(',') : '';
      bar.innerHTML = renderPlanBar(s);
      bar.classList.toggle('is-open', !!s.draft.plan);
      lastPlanKey = planKey;

      const pop = document.getElementById('mvPopover');
      if (!pop.hidden) pop.innerHTML = renderPopover(s);

      document.querySelectorAll('#mvSeg button').forEach(function (b) {
        b.classList.toggle('is-on', b.dataset.v === s.ui.mapLevel);
      });

      const lvl = s.ui.mapLevel || 'ALL';
      const orders = s.orders.filter((o) => lvl === 'ALL' || o.level === lvl);
      engine.render({
        state: s, orders: orders, nodes: A.C.NODES, ocean: s.ocean,
        draft: s.draft, filter: {}, colorBy: s.ui.mapColor || 'status',
        animateIn: !this._painted
      });
      this._painted = true;
      if (s.ui.mapSel) engine.select('order', s.ui.mapSel);
    },

    onResize: function () { home(false); }
  });

  /* ── interactions ────────────────────────────────────────────────── */
  function onClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t) {
      const pop = document.getElementById('mvPopover');
      if (!pop.hidden && !e.target.closest('#mvPopover') && !e.target.closest('#mvPopBtn')) pop.hidden = true;
      return;
    }
    const s = view._s, act = t.dataset.act, id = t.dataset.id;
    if (act === 'pick') {
      s.ui.mapSel = id;
      A.store.emit();
    } else if (act === 'level') {
      s.ui.mapLevel = t.dataset.v; A.store.emit();
    } else if (act === 'quick-add') {
      e.stopPropagation();
      addStop(id);
    } else if (act === 'add-stop') {
      addStop(id);
    } else if (act === 'remove-stop') {
      e.stopPropagation();
      removeStop(id);
    } else if (act === 'focus') {
      const o = s.orders.find((x) => x.id === id);
      if (o) engine.focusOn(o.lat, o.lng, 11);
    } else if (act === 'close-insp') {
      s.ui.mapSel = null; A.store.emit();
    } else if (act === 'clear-plan') {
      s.draft.stops = []; s.draft.plan = null; A.store.emit();
    } else if (act === 'toggle-strategy') {
      s.draft.order = s.draft.order === 'window' ? 'nearest' : 'window';
      if (s.draft.stops.length) s.draft.plan = buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order);
      A.store.emit();
    } else if (act === 'gen-plan') {
      genPlan();
    } else if (act === 'open-plan') {
      s.ui.mapSel = null; A.store.emit();
    } else if (act === 'fit-route') {
      engine.fitRoute();
    } else if (act === 'toggle-pop') {
      const pop = document.getElementById('mvPopover');
      pop.hidden = !pop.hidden;
      pop.innerHTML = renderPopover(s);
    } else if (act === 'layer') {
      s.ui.mapLayers[t.dataset.v] = s.ui.mapLayers[t.dataset.v] === false;
      A.store.emit();
    } else if (act === 'color') {
      s.ui.mapColor = t.dataset.v; A.store.emit();
    } else if (act === 'zoom-in') {
      engine.zoomIn();
    } else if (act === 'zoom-out') {
      engine.zoomOut();
    } else if (act === 'home') {
      home(true);
    }
  }

  function addStop(id) {
    const s = view._s;
    if (s.draft.stops.includes(id)) return;
    if (s.draft.stops.length >= 5) { A.toast('一趟最多 5 站，先移除或改线', 'red'); return; }
    const o = s.orders.find((x) => x.id === id);
    if (!o) return;
    if (o.nodeId !== s.draft.origin) {
      s.draft.origin = o.nodeId;
      s.draft.stops = [];
      A.toast('起运仓已切换为 ' + o.nodeId, 'amber');
    }
    s.draft.stops.push(id);
    s.draft.plan = buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order);
    s.ui.mapSel = null;
    A.store.emit();
  }

  function removeStop(id) {
    const s = view._s;
    s.draft.stops = s.draft.stops.filter((x) => x !== id);
    s.draft.plan = s.draft.stops.length ? buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order) : null;
    A.store.emit();
  }

  function genPlan() {
    const s = view._s, plan = s.draft.plan;
    if (!plan) return;
    if (plan.violations > 0 && !confirm('计划中有 ' + plan.violations + ' 个站点存在窗口冲突。\n硬窗站点应先拆线或改约；确认要按当前计划生成派车单吗？')) return;
    const id = 'TR-' + String(2400 + (s.trucks || []).length + 1);
    const truck = {
      id, origin: plan.origin, stops: plan.stops.map((x) => x.id),
      legs: plan.legs.map((l) => ({ to: l.to.id, arrive: hhmm(l.arrive), depart: hhmm(l.depart), miles: l.miles })),
      miles: plan.miles, cost: plan.combined, units: plan.units,
      driver: DRIVERS[(s.trucks || []).length % DRIVERS.length],
      plate: PLATES[(s.trucks || []).length % PLATES.length],
      depart: s.today + ' 08:00', status: '已排线'
    };
    s.trucks = s.trucks || [];
    s.trucks.push(truck);
    plan.stopIds.forEach(function (oid) {
      const o = s.orders.find((x) => x.id === oid);
      if (o && (o.status === '待派' || o.status === '待命')) { o.status = '已派'; o.path = 'B'; o.truckId = id; }
    });
    s.draft.stops = []; s.draft.plan = null; s.ui.mapSel = null;
    A.store.set({ trucks: s.trucks, orders: s.orders, draft: s.draft });
    A.toast('已生成派车单 ' + id + ' · ' + truck.stops.length + ' 站 ' + truck.units + ' 台', 'green');
  }
})(window);

</script>
<script>/* assets/js/view-ocean.js */
/* ==========================================================================
   view-ocean.js — 海运在途看板（S01→S04 → 入仓）
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;
  const STAGES = A.C.OCEAN_STAGES;

  function stageIdx(id) { return STAGES.findIndex((s) => s.id === id); }
  function etaOf(s) { return s.actualEta || s.eta; }
  function freeLeft(s, today) { return s.freeDays - dt.diff(etaOf(s), today); }
  function daysTo(s, today) { return dt.diff(today, etaOf(s)); }
  function tone(s, today) {
    const left = freeLeft(s, today);
    if (s.stage === 'REC') return 'ok';
    if (left < 0) return 'crit';
    if (left <= 2) return 'warn';
    return 'ok';
  }

  function kpis(s) {
    const live = s.ocean.filter((x) => x.stage !== 'REC');
    const sea = s.ocean.filter((x) => x.stage === 'S02').reduce((a, x) => a + x.units, 0);
    const demo = live.filter((x) => tone(x, s.today) !== 'ok');
    const missDocs = s.ocean.reduce((a, x) => a + A.oceanDoc(x).missingDue.length, 0);
    const drift = s.ocean.filter((x) => x.actualEta).map((x) => dt.diff(x.eta, x.actualEta));
    const avg = drift.length ? drift.reduce((a, b) => a + b, 0) / drift.length : 0;
    const wait = live.filter((x) => stageIdx(x.stage) >= 2).reduce((a, x) => a + x.units, 0);
    return { live, sea, demo, missDocs, avg, wait, boxes: live.length };
  }

  /* ── kanban card ─────────────────────────────────────────────────── */
  function card(s, t) {
    const lanes = s.lane;
    const d = A.oceanDoc(s);
    const dleft = freeLeft(s, t);
    const sel = (A.app.state.ui.oceanSel === s.id);
    const warn = s.stage === 'REC' ? null
      : dleft < 0 ? { cls: 'crit', txt: '免期超 ' + Math.abs(dleft) + ' 天' }
        : dleft <= 2 ? { cls: '', txt: '免期剩 ' + dleft + ' 天' }
          : d.missingDue.length ? { cls: 'crit', txt: '缺 ' + d.missingDue.length + ' 份到期单证' } : null;
    return '<div class="kcard' + (sel ? ' is-sel' : '') + '" draggable="true" data-id="' + s.id + '">' +
      '<div class="kcard-top"><span class="kcard-id">' + s.id + '</span><span class="sp"></span>' +
      '<span class="tag ' + (s.box === 'LCL' ? 'tag--plain' : s.box === '40HQ' ? 'tag--blue' : 'tag--teal') + '" style="height:16px;padding:0 4px;font-size:9px">' + s.box + '</span></div>' +
      '<div class="kcard-route"><span class="port">' + lanes.from + '</span><span class="arrow">→</span><span class="port">' + lanes.to + '</span>' +
      '<span class="sp"></span><b class="num" style="font-size:10.5px">' + s.units + ' 台</b></div>' +
      '<div class="kcard-meta">' +
      '<span>' + s.vessel.split(' ').slice(0, 2).join(' ') + '</span>' +
      '<span style="margin-left:auto">' + (s.stage === 'REC' ? '已入 ' + fmt.n(s.units) + ' 台' : (daysTo(s, t) >= 0 ? 'ETA ' + dt.mmdd(etaOf(s)) + ' · ' + daysTo(s, t) + 'd' : 'ETA ' + dt.mmdd(etaOf(s)))) + '</span>' +
      '</div>' +
      '<div class="docbar">' + A.C.DOCS.map(function (dd) {
        const on = s.docList[dd.id];
        const overdue = !on && dd.stage <= d.stageIdx;
        return '<i class="' + (on ? 'on' : overdue ? 'miss' : '') + '" title="' + dd.name + '"></i>';
      }).join('') + '</div>' +
      (warn ? '<div class="kcard-warn ' + warn.cls + '">' + warn.txt + '</div>' : '') +
      '</div>';
  }

  /* ── gantt ───────────────────────────────────────────────────────── */
  function gantt(s) {
    const days = 24;
    const start = s.today;
    const ports = Object.keys(A.C.PORTS).filter((p) => !A.C.PORTS[p].cn);
    const rows = ports.map(function (p) {
      const list = s.ocean.filter((x) => x.lane.to === p && x.stage !== 'REC');
      return { p, list };
    }).filter((r) => r.list.length);
    const axis = [];
    for (let i = 0; i < days; i += 3) {
      const d = dt.add(start, i);
      axis.push({ i, d, label: dt.mmdd(d) });
    }
    let html = '<div class="gantt-axis"><div></div><div class="gantt-ticks">' +
      axis.map((a) => '<span style="left:' + (a.i / days * 100) + '%">' + a.label + '</span>').join('') + '</div></div>';
    html += rows.map(function (r) {
      const bars = r.list.map(function (x) {
        const eta = etaOf(x);
        const d0 = dt.diff(start, eta);
        const left = Math.max(0, Math.min(days - 0.5, d0));
        const tone2 = tone(x, s.today);
        return '<div class="gantt-bar ' + (tone2 === 'crit' ? 'crit' : tone2 === 'warn' ? 'warn' : '') + '" ' +
          'style="left:' + (left / days * 100) + '%;width:' + (Math.max(4, x.freeDays) / days * 100) + '%" ' +
          'title="' + x.id + ' · ETA ' + eta + ' · ' + x.units + ' 台 · 免期 ' + x.freeDays + ' 天"></div>';
      }).join('');
      return '<div class="gantt-row"><div style="font-size:10px;color:var(--txt-2);display:flex;align-items:center;gap:5px">' +
        '<span class="mono" style="font-size:9.5px;color:var(--txt-3)">' + r.p + '</span>' + A.C.PORTS[r.p].name.replace(' / ', '/') +
        '</div><div class="gantt-track">' + bars +
        '<div class="gantt-now" style="left:0"></div></div></div>';
    }).join('');
    return '<div class="gantt">' + html + '</div>';
  }

  /* ── drawer ──────────────────────────────────────────────────────── */
  function openDrawer(id) {
    const s = A.app.state;
    const x = s.ocean.find((y) => y.id === id);
    if (!x) return;
    s.ui.oceanSel = id;
    const idx = stageIdx(x.stage);
    const doc = A.oceanDoc(x);
    const left = freeLeft(x, s.today);
    const lane = A.C.LANES.find((l) => l.from === x.lane.from && l.to === x.lane.to) || x.lane;

    const tl = STAGES.map(function (st, i) {
      const done = i < idx, now = i === idx;
      let date = '';
      if (st.id === 'S01') date = x.etd && dt.add(x.etd, -6);
      else if (st.id === 'S02') date = x.etd;
      else if (st.id === 'S03') date = etaOf(x);
      else if (st.id === 'S04') date = (x.actualEta ? dt.add(x.actualEta, 2) : '');
      else date = x.stage === 'REC' ? dt.add(etaOf(x), 3) : '';
      return '<div class="tl-i ' + (done ? 'done' : now ? 'now' : '') + '">' +
        '<div class="t"><b>' + st.id + ' ' + st.name + '</b><span class="d">' + (date || '待定') + '</span></div>' +
        '<div class="d2">' + stageDesc(st.id, x) + '</div></div>';
    }).join('');

    const docs = A.C.DOCS.map(function (d) {
      const on = x.docList[d.id];
      const due = d.stage <= doc.stageIdx;
      const cls = on ? 'on' : due ? 'miss' : '';
      return '<div class="chk-i ' + cls + '" data-doc="' + d.id + '" style="cursor:pointer' + (!on && !due ? ';opacity:.55' : '') + '">' +
        '<span class="bx">✓</span><span class="lbl">' + d.name + '</span>' +
        '<span class="dt">' + (on ? '已回执' : due ? '缺 · 到期' : '待回执') + '</span></div>';
    }).join('');

    const html =
      '<div class="drawer-h"><div style="min-width:0"><h2>' + x.id + '</h2>' +
      '<p>' + x.carrier + ' · ' + x.vessel + ' · ' + x.voyage + '</p></div><span class="sp"></span>' +
      '<button class="icon-btn" data-x="close" aria-label="关闭">✕</button></div>' +
      '<div class="drawer-b">' +
      '<div class="row row--tight">' +
      '<span class="tag tag--blue">' + x.box + ' · ' + x.type + '</span>' +
      '<span class="tag tag--plain">' + x.model + ' ×' + x.units + '</span>' +
      '<span class="tag ' + (tone(x, s.today) === 'ok' ? 'tag--green' : tone(x, s.today) === 'warn' ? 'tag--amber' : 'tag--red') + '">' +
