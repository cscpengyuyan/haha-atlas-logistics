<style>
/* ==========================================================================
   HAHA ATLAS · 美国大件物流指挥台
   Design system + layout. Dark control-room default, light "day" variant.
   ========================================================================== */

/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  --bg:#070b12;
  --bg-grad:radial-gradient(1200px 620px at 78% -18%, #12203a 0%, transparent 62%),
            radial-gradient(900px 520px at 8% 108%, #0d1c2b 0%, transparent 58%);
  --panel:#0e1626;
  --panel-2:#111c2e;
  --panel-3:#16243a;
  --line:#1d2a3e;
  --line-soft:#16202f;
  --txt:#e8eef7;
  --txt-2:#a9b8cc;
  --txt-3:#6b7d94;
  --amber:#f5a524;
  --amber-2:#ffc65c;
  --amber-soft:rgba(245,165,36,.13);
  --teal:#2dd4bf;
  --teal-soft:rgba(45,212,191,.13);
  --blue:#5b8def;
  --blue-soft:rgba(91,141,239,.14);
  --violet:#a78bfa;
  --violet-soft:rgba(167,139,250,.14);
  --red:#ff6b6b;
  --red-soft:rgba(255,107,107,.14);
  --green:#34d399;
  --green-soft:rgba(52,211,153,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -12px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.7);
  --r-s:7px; --r-m:11px; --r-l:16px;
  --rail-w:236px;
  --top-h:60px;
  --ease:cubic-bezier(.22,.75,.24,1);
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#eef2f7;
  --bg-grad:radial-gradient(1100px 560px at 82% -20%, #dbe7f6 0%, transparent 60%),
            radial-gradient(800px 480px at 0% 108%, #e6eef5 0%, transparent 55%);
  --panel:#ffffff;
  --panel-2:#f7f9fc;
  --panel-3:#eef3f9;
  --line:#d8e1ec;
  --line-soft:#e6ecf4;
  --txt:#0d1a2b;
  --txt-2:#42546c;
  --txt-3:#71839a;
  --amber:#b26a00;
  --amber-2:#8f5500;
  --amber-soft:rgba(178,106,0,.11);
  --teal:#0d8f83;
  --teal-soft:rgba(13,143,131,.11);
  --blue:#2f62c8;
  --blue-soft:rgba(47,98,200,.1);
  --violet:#7a5cd6;
  --violet-soft:rgba(122,92,214,.11);
  --red:#cf3b3b;
  --red-soft:rgba(207,59,59,.1);
  --green:#12805a;
  --green-soft:rgba(18,128,90,.1);
  --shadow:0 1px 2px rgba(16,32,52,.06), 0 10px 24px -14px rgba(16,32,52,.28);
  --shadow-lg:0 24px 56px -24px rgba(16,32,52,.35);
  color-scheme:light;
}

/* ── reset ──────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);font-size:13px;line-height:1.55;
  color:var(--txt);background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block}
::selection{background:var(--amber-soft);color:var(--txt)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono)}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none !important}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#25344b;border-radius:6px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#33465f;background-clip:content-box}
html[data-theme="light"] *::-webkit-scrollbar-thumb{background:#c6d2e1;background-clip:content-box}

/* ── boot ───────────────────────────────────────────────────────────── */
.boot{
  position:fixed;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:18px;
  background:var(--bg);color:var(--amber);transition:opacity .45s var(--ease),visibility .45s;
}
.boot.is-done{opacity:0;visibility:hidden;pointer-events:none}
.boot-mark{animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.boot-txt{text-align:center;display:grid;gap:5px}
.boot-txt b{font-size:15px;letter-spacing:.22em;color:var(--txt)}
.boot-txt span{font-size:12px;color:var(--txt-3)}

/* ── shell ──────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100vh;height:100dvh}

.rail{
  display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(17,28,46,.92),rgba(10,16,26,.96));
  backdrop-filter:blur(10px);
}
html[data-theme="light"] .rail{background:linear-gradient(180deg,#fff,#f6f9fc)}
.rail-brand{display:flex;align-items:center;gap:10px;padding:17px 16px 15px;border-bottom:1px solid var(--line-soft)}
.rail-logo{width:30px;height:30px;color:var(--amber);flex:none}
.rail-brandtxt{display:grid;line-height:1.15;min-width:0}
.rail-brandtxt b{font-size:14px;letter-spacing:.13em;font-weight:800}
.rail-brandtxt b span{color:var(--amber);margin-left:5px}
.rail-brandtxt i{font-size:10.5px;font-style:normal;color:var(--txt-3);letter-spacing:.02em;margin-top:2px;white-space:nowrap}

.rail-nav{flex:1;overflow-y:auto;padding:12px 9px;display:flex;flex-direction:column;gap:2px}
.rail-sec{font-size:10px;letter-spacing:.16em;color:var(--txt-3);padding:14px 9px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);
  color:var(--txt-2);font-size:12.5px;font-weight:500;position:relative;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.72;transition:opacity .16s}
.nav-item:hover{background:var(--panel-3);color:var(--txt);text-decoration:none}
.nav-item:hover svg{opacity:1}
.nav-item.is-on{background:var(--amber-soft);color:var(--amber)}
.nav-item.is-on svg{opacity:1}
.nav-item.is-on::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:2px;height:16px;border-radius:2px;background:var(--amber)}
.nav-item .nav-badge{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--red-soft);color:var(--red);font-variant-numeric:tabular-nums}
.nav-item .nav-badge[data-tone="amber"]{background:var(--amber-soft);color:var(--amber)}
.nav-item .nav-badge[data-tone="blue"]{background:var(--blue-soft);color:var(--blue)}

.rail-foot{padding:11px;border-top:1px solid var(--line-soft);display:grid;gap:9px}
.rail-note{display:flex;gap:8px;padding:9px 10px;border-radius:var(--r-s);background:rgba(245,165,36,.07);border:1px solid rgba(245,165,36,.18)}
.rail-note b{display:block;font-size:11.5px;color:var(--amber-2)}
.rail-note i{display:block;font-size:10.5px;font-style:normal;color:var(--txt-3);line-height:1.45;margin-top:2px}
.rail-build{font-size:10px;color:var(--txt-3);text-align:center;letter-spacing:.04em}
.dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:5px}
.dot--amber{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.dot--red{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.dot--green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.dot--teal{background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  height:var(--top-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--panel) 72%, transparent);
  backdrop-filter:blur(14px);z-index:20;
}
.topbar-title{min-width:0;flex:1}
.topbar-title h1{font-size:15.5px;font-weight:680;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title p{font-size:11.5px;color:var(--txt-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:8px;flex:none}

.clock{
  display:flex;align-items:center;gap:8px;padding:4px 6px 4px 5px;border-radius:99px;
  border:1px solid var(--line);background:var(--panel-2);
}
.clock-face{display:grid;line-height:1.15;text-align:center;min-width:104px}
.clock-face span{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock-face small{font-size:9.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}

.icon-btn{
  display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-s);
  color:var(--txt-2);border:1px solid transparent;transition:.16s var(--ease);
}
.icon-btn:hover{background:var(--panel-3);color:var(--txt);border-color:var(--line)}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);font-size:11.5px;font-weight:550;
  transition:.16s var(--ease);
}
.ghost-btn:hover{color:var(--txt);border-color:var(--txt-3)}
.ghost-btn svg{opacity:.8}

.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:18px 18px 40px;animation:viewIn .32s var(--ease) both}
.view--flush{padding:0;overflow:hidden}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.wrap{max-width:1560px;margin:0 auto;display:grid;gap:14px}

/* ── primitives ─────────────────────────────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow);min-width:0;
}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:12.5px;font-weight:650;letter-spacing:.01em;display:flex;align-items:center;gap:7px;min-width:0}
.card-h h3 .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--txt-3);text-transform:uppercase}
.card-h .sp{flex:1}
.card-b{padding:14px}
.card-b--tight{padding:10px 12px}
.card-b--flush{padding:0}

.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--txt-3);font-weight:650}
.muted{color:var(--txt-3)}
.sub{color:var(--txt-2)}
.hint{font-size:11px;color:var(--txt-3);line-height:1.55}

.tag{
  display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
  border:1px solid transparent;font-variant-numeric:tabular-nums;
}
.tag--amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(245,165,36,.24)}
.tag--teal{background:var(--teal-soft);color:var(--teal);border-color:rgba(45,212,191,.24)}
.tag--blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(91,141,239,.24)}
.tag--violet{background:var(--violet-soft);color:var(--violet);border-color:rgba(167,139,250,.24)}
.tag--red{background:var(--red-soft);color:var(--red);border-color:rgba(255,107,107,.24)}
.tag--green{background:var(--green-soft);color:var(--green);border-color:rgba(52,211,153,.24)}
.tag--plain{background:var(--panel-3);color:var(--txt-2);border-color:var(--line)}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--txt-2);transition:.15s var(--ease);white-space:nowrap}
.pill:hover{border-color:var(--txt-3);color:var(--txt)}
.pill.is-on{background:var(--amber-soft);border-color:rgba(245,165,36,.4);color:var(--amber)}
.pill .n{font-size:10px;font-variant-numeric:tabular-nums;opacity:.75}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;
  border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
  font-size:12px;font-weight:560;transition:.16s var(--ease);white-space:nowrap;
}
.btn:hover{border-color:var(--txt-3)}
.btn:active{transform:translateY(1px)}
.btn--prime{background:linear-gradient(180deg,var(--amber),#dc8f12);color:#1a1206;border-color:#c47f0c;font-weight:680;box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 6px 16px -8px rgba(245,165,36,.8)}
.btn--prime:hover{filter:brightness(1.06)}
.btn--prime:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.btn--ghost{background:transparent}
.btn--sm{height:26px;padding:0 9px;font-size:11.5px}
.btn--danger{color:var(--red);border-color:rgba(255,107,107,.34)}
.btn--danger:hover{background:var(--red-soft)}
.btn[aria-pressed="true"]{background:var(--amber-soft);border-color:rgba(245,165,36,.4);color:var(--amber)}

.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--panel-3);border:1px solid var(--line);gap:2px}
.seg button{padding:4px 10px;border-radius:6px;font-size:11.5px;color:var(--txt-2);font-weight:550;transition:.14s}
.seg button:hover{color:var(--txt)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
html[data-theme="light"] .seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(16,32,52,.14)}

.input,.select{
  height:30px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;color:var(--txt);min-width:0;transition:.15s;
}
.input::placeholder{color:var(--txt-3)}
.input:focus,.select:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 3px var(--amber-soft)}
.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 10px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.search{
  position:relative;display:flex;align-items:center;
}
.search svg{position:absolute;left:9px;color:var(--txt-3);pointer-events:none}
.search .input{padding-left:29px;width:100%}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:11.5px}
.kv dt{color:var(--txt-3);white-space:nowrap}
.kv dd{margin:0;color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}

.divide{height:1px;background:var(--line-soft);margin:12px 0}

/* ── tables ─────────────────────────────────────────────────────────── */
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r-m) var(--r-m)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.8px}
table.tbl th{
  position:sticky;top:0;z-index:2;text-align:left;font-size:10px;font-weight:650;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txt-3);padding:8px 11px;background:var(--panel-2);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:8px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tbody tr{transition:background .13s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tbody tr.is-sel{background:var(--amber-soft)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl td.c,table.tbl th.c{text-align:center}
table.tbl .num{font-variant-numeric:tabular-nums}
table.tbl tfoot td{padding:9px 11px;border-top:1px solid var(--line);background:var(--panel-2);font-weight:650;font-size:12px}

/* ── stats ──────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{
  position:relative;padding:13px 14px;border-radius:var(--r-m);background:var(--panel);
  border:1px solid var(--line);overflow:hidden;
}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent,var(--amber-soft));filter:blur(18px);opacity:.55}
.stat .lab{font-size:10.5px;color:var(--txt-3);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12px;font-weight:600;color:var(--txt-3);margin-left:3px}
.stat .meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--txt-3)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-size:11px;font-variant-numeric:tabular-nums}
.delta--up{color:var(--green)}
.delta--down{color:var(--red)}
.delta--flat{color:var(--txt-3)}

/* ── layout helpers ─────────────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.72fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row--tight{gap:5px}
.sp{flex:1}
.stack{display:grid;gap:10px}

/* ── map shell ──────────────────────────────────────────────────────── */
.map-shell{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 372px;overflow:hidden}
.map-stage{position:relative;min-width:0;background:linear-gradient(180deg,#060a11,#0a1220 60%,#070d16)}
html[data-theme="light"] .map-stage{background:linear-gradient(180deg,#f3f7fc,#e9f0f8)}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.map-svg.is-panning{cursor:grabbing}
.map-overlay{position:absolute;inset:0;pointer-events:none}
.map-overlay > *{pointer-events:auto}

.map-top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.map-top > *{max-width:100%}
.map-panel{
  background:color-mix(in srgb, var(--panel) 92%, transparent);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-lg);backdrop-filter:blur(12px);max-width:100%;
}
.map-filters{padding:7px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:100%}
.map-legend{
  position:absolute;left:12px;bottom:12px;padding:9px 11px;display:grid;gap:6px;font-size:10.5px;color:var(--txt-2)
}
.map-legend .li{display:flex;align-items:center;gap:7px}
.map-legend .sw{width:9px;height:9px;border-radius:3px;flex:none}
.map-zoom{position:absolute;right:12px;bottom:12px;display:grid;gap:1px;padding:3px}
.map-zoom button{width:30px;height:28px;display:grid;place-items:center;border-radius:5px;color:var(--txt-2);font-size:15px;font-weight:600}
.map-zoom button:hover{background:var(--panel-3);color:var(--txt)}
.map-hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:10.5px;color:var(--txt-3);
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line-soft);
  padding:4px 10px;border-radius:99px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap;
}
.map-scale{position:absolute;right:12px;bottom:96px;font-size:10px;color:var(--txt-3);text-align:center;pointer-events:none}
.map-scale .bar{height:3px;border:1px solid currentColor;border-top:0;margin-top:2px}

/* side dock inside map view */
.dock{
  border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;
}
.dock-h{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.dock-h h2{font-size:13px;font-weight:650}
.dock-tabs{display:flex;gap:2px;padding:7px 9px;border-bottom:1px solid var(--line-soft)}
.dock-tabs button{flex:1;padding:5px 6px;border-radius:6px;font-size:11.5px;color:var(--txt-3);font-weight:550}
.dock-tabs button[aria-pressed="true"]{background:var(--panel-3);color:var(--txt)}
.dock-b{flex:1;overflow-y:auto;padding:11px 13px 20px;display:grid;gap:11px;align-content:start}
.dock-f{padding:9px 13px;border-top:1px solid var(--line);display:flex;gap:7px}

/* ── ocean board ────────────────────────────────────────────────────── */
.ocean-shell{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.ocean-bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.ocean-kpis{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:11px 14px 0}
.ocean-kpi{padding:9px 11px;border-radius:var(--r-s);background:var(--panel-2);border:1px solid var(--line-soft)}
.ocean-kpi .lab{font-size:10px;color:var(--txt-3);letter-spacing:.04em}
.ocean-kpi .v{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.ocean-kpi .v small{font-size:10.5px;color:var(--txt-3);font-weight:600;margin-left:2px}

.kanban{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(212px,1fr));gap:10px;padding:11px 14px 14px;overflow-x:auto}
.kcol{
  display:flex;flex-direction:column;min-height:0;border-radius:var(--r-m);
  background:var(--panel-2);border:1px solid var(--line-soft);
}
.kcol.is-over{border-color:var(--amber);background:var(--amber-soft)}
.kcol-h{padding:9px 10px 8px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel-2);border-radius:var(--r-m) var(--r-m) 0 0;z-index:1}
.kcol-h b{font-size:11.5px;font-weight:650;letter-spacing:.01em}
.kcol-h .cnt{margin-left:auto;font-size:10.5px;color:var(--txt-3);font-variant-numeric:tabular-nums;background:var(--panel-3);padding:1px 6px;border-radius:99px}
.kcol-h .bar{position:absolute;left:0;top:0;height:2px;border-radius:2px 0 0 0;background:var(--accent,var(--txt-3))}
.kcol-b{flex:1;overflow-y:auto;padding:8px;display:grid;gap:8px;align-content:start;min-height:56px}

.kcard{
  border-radius:9px;background:var(--panel);border:1px solid var(--line);
  padding:9px 10px;display:grid;gap:6px;cursor:grab;position:relative;
  transition:transform .14s var(--ease),border-color .14s,box-shadow .14s;
}
.kcard:hover{border-color:var(--txt-3);transform:translateY(-1px);box-shadow:var(--shadow)}
.kcard.is-drag{opacity:.45}
.kcard.is-sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.kcard-top{display:flex;align-items:center;gap:6px}
.kcard-id{font-family:var(--mono);font-size:10.5px;letter-spacing:-.02em;color:var(--txt-2)}
.kcard-top .sp{flex:1}
.kcard-route{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt);font-weight:560}
.kcard-route .arrow{color:var(--txt-3);font-size:10px}
.kcard-route .port{background:var(--panel-3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:10px;letter-spacing:.02em}
.kcard-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--txt-3);flex-wrap:wrap}
.kcard-meta b{color:var(--txt-2);font-weight:600;font-variant-numeric:tabular-nums}
.docbar{display:flex;gap:2px;margin-top:1px}
.docbar i{height:3px;flex:1;border-radius:2px;background:var(--panel-3)}
.docbar i.on{background:var(--teal)}
.docbar i.miss{background:var(--red);opacity:.8}
.kcard-warn{
  display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--amber);
  background:var(--amber-soft);border-radius:4px;padding:2px 6px;width:max-content;
}
.kcard-warn.crit{color:var(--red);background:var(--red-soft)}
.kempty{padding:16px 8px;text-align:center;font-size:10.5px;color:var(--txt-3);border:1px dashed var(--line);border-radius:8px}

/* arrival gantt */
.gantt{display:grid;gap:2px;font-size:10.5px}
.gantt-row{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px}
.gantt-track{position:relative;height:17px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.gantt-bar{position:absolute;top:3px;height:11px;border-radius:3px;background:var(--blue);opacity:.85}
.gantt-bar.warn{background:var(--amber)}
.gantt-bar.crit{background:var(--red)}
.gantt-axis{display:grid;grid-template-columns:112px 1fr;gap:8px}
.gantt-ticks{position:relative;height:15px;font-size:9.5px;color:var(--txt-3)}
.gantt-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gantt-now{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);opacity:.75;z-index:2}

/* ── drawer / detail ────────────────────────────────────────────────── */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(468px,94vw);z-index:60;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease);
}
.drawer.is-open{transform:none}
.drawer::before{content:"";position:fixed;inset:0;right:min(468px,94vw);background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s;pointer-events:none}
.drawer.is-open::before{opacity:1;pointer-events:auto}
.drawer-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer-h h2{font-size:14px;font-weight:680;letter-spacing:-.01em}
.drawer-h p{font-size:11px;color:var(--txt-3);margin-top:2px}
.drawer-b{flex:1;overflow-y:auto;padding:14px 15px 24px;display:grid;gap:14px}
.drawer-f{padding:10px 15px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel-2)}
.sec-t{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-3);font-weight:650;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.sec-t .sp{flex:1}

/* timeline */
.tl{display:grid;gap:0;position:relative;padding-left:15px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:8px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:0 0 13px 0}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-13px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line)}
.tl-i.done::before{background:var(--teal);border-color:var(--teal)}
.tl-i.now::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.tl-i .t{display:flex;align-items:baseline;gap:7px;font-size:11.5px}
.tl-i .t b{font-weight:620}
.tl-i .t .d{margin-left:auto;font-size:10.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.tl-i .d2{font-size:11px;color:var(--txt-3);margin-top:2px;line-height:1.5}

/* checklist */
.chk{display:grid;gap:5px}
.chk-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-soft);font-size:11.5px}
.chk-i .bx{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:9px;color:transparent}
.chk-i.on .bx{background:var(--teal);border-color:var(--teal);color:#04231f}
.chk-i.miss{border-color:rgba(255,107,107,.3);background:var(--red-soft)}
.chk-i.miss .bx{border-color:var(--red)}
.chk-i .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk-i .dt{font-size:10px;color:var(--txt-3);font-variant-numeric:tabular-nums}

/* ── misc ───────────────────────────────────────────────────────────── */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:99px;
  background:var(--panel-3);border:1px solid var(--line);box-shadow:var(--shadow-lg);
  font-size:12px;font-weight:550;animation:toastIn .3s var(--ease) both;max-width:min(560px,92vw);
}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast .dot{width:6px;height:6px;margin-top:0}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.98)}}

.tip{
  position:fixed;z-index:75;pointer-events:none;padding:6px 9px;border-radius:6px;
  background:var(--panel-3);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:11px;color:var(--txt);max-width:260px;line-height:1.45;
}
.tip b{color:var(--amber)}

.progress{height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7ee8d8)}

.legend-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-2)}
.sw{width:9px;height:9px;border-radius:3px;flex:none}

.empty{
  display:grid;place-items:center;gap:7px;padding:30px 14px;text-align:center;
  color:var(--txt-3);font-size:12px;border:1px dashed var(--line);border-radius:var(--r-m);
}
.empty b{color:var(--txt-2);font-size:12.5px}

/* map svg element styles */
.map-stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(720px 460px at 46% 48%, rgba(52,120,180,.13), transparent 68%),
             radial-gradient(420px 300px at 82% 78%, rgba(245,165,36,.06), transparent 70%);
}
html[data-theme="light"] .map-stage::before{
  background:radial-gradient(720px 460px at 46% 48%, rgba(91,141,239,.10), transparent 68%);
}
.mp-land{fill:#111f33;stroke:#2a435f;stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .2s}
html[data-theme="light"] .mp-land{fill:#fbfcfe;stroke:#b9cade}
.mp-state-label{fill:#4c6480;font-size:5.6px;font-weight:600;letter-spacing:.06em;pointer-events:none;text-anchor:middle}
html[data-theme="light"] .mp-state-label{fill:#8fa3ba}
.mp-road{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mp-road--other{stroke:#1c2f47;stroke-width:.5}
.mp-road--us{stroke:#26405e;stroke-width:.7}
.mp-road--inter{stroke:#32547c;stroke-width:1.15}
html[data-theme="light"] .mp-road--other{stroke:#e4ebf4}
html[data-theme="light"] .mp-road--us{stroke:#cfdcea}
html[data-theme="light"] .mp-road--inter{stroke:#adc1d6}
.mp-lane{fill:none;stroke:#2dd4bf;stroke-width:1.1;stroke-dasharray:5 5;opacity:.5;animation:dashMove 26s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-160}}
.mp-lane-glow{fill:none;stroke:#2dd4bf;stroke-width:4;opacity:.08}
.mp-route{fill:none;stroke:#f5a524;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mp-route-halo{fill:none;stroke:#f5a524;stroke-width:6;opacity:.14;stroke-linecap:round}
.mp-node{cursor:pointer}
.mp-node .ring{fill:none;stroke-width:1.2;opacity:.45}
.mp-node .core{stroke:#070b12;stroke-width:1.2}
.mp-node:hover .core{filter:brightness(1.25)}
.mp-pin{cursor:pointer;transition:transform .16s var(--ease)}
.mp-pin circle.hit{fill:transparent}
.mp-pin.is-sel .dot{stroke:#fff;stroke-width:1.6}
.mp-pin:hover .dot{stroke:#fff;stroke-width:1.2}
.mp-pin .lbl{font-size:6.4px;font-weight:600;fill:var(--txt-2);pointer-events:none;text-anchor:middle}
.mp-ringzone{fill:var(--teal);fill-opacity:.055;stroke:var(--teal);stroke-opacity:.22;stroke-width:.7;stroke-dasharray:3 3;pointer-events:none}
.mp-cover{fill:none;stroke:#5b8def;stroke-width:.8;stroke-dasharray:2 4;opacity:.35;pointer-events:none}
.mp-truck{filter:drop-shadow(0 0 4px rgba(245,165,36,.8))}
.mp-grat{fill:none;stroke:#ffffff;stroke-opacity:.028;stroke-width:.5;pointer-events:none}
html[data-theme="light"] .mp-grat{stroke:#0d1a2b;stroke-opacity:.05}

/* ── responsive ─────────────────────────────────────────────────────── */
.only-mobile{display:none}
@media (max-width:1180px){
  :root{--rail-w:64px}
  .rail-brandtxt,.rail-sec,.nav-item span,.rail-note,.rail-build{display:none}
  .rail-brand{justify-content:center;padding:16px 8px}
  .nav-item{justify-content:center;padding:10px 0}
  .nav-item .nav-badge{position:absolute;top:5px;right:6px;padding:0 4px;font-size:9px}
  .map-shell{grid-template-columns:minmax(0,1fr) 330px}
  .ocean-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .only-mobile{display:grid}
  :root{--rail-w:0px}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:238px;z-index:70;transform:translateX(-100%);transition:transform .3s var(--ease)}
  .rail.is-open{transform:none}
  .rail-brandtxt,.rail-sec,.nav-item span,.rail-note,.rail-build{display:block}
  .nav-item{justify-content:flex-start;padding:8px 10px}
  .rail-brand{justify-content:flex-start;padding:17px 16px 15px}
  .map-shell{grid-template-columns:1fr;grid-template-rows:minmax(280px,1fr) minmax(0,auto)}
  .dock{max-height:50vh;border-left:0;border-top:1px solid var(--line);min-width:0}
  .map-legend{display:none}
  .map-hint{display:none}
  .g-2,.g-3,.g-23,.g-32,.g-4{grid-template-columns:1fr}
  .ocean-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kanban{grid-template-columns:repeat(5,minmax(78vw,1fr))}
  .view{padding:12px 12px 30px}
  .clock-face{min-width:88px}
  .ghost-btn span{display:none}
  .topbar{padding:0 12px;gap:8px}
}
@media (max-width:560px){
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .val{font-size:21px}
  .map-top{top:8px;left:8px;right:8px}
  .clock{display:none}
  .map-zoom{bottom:8px;right:8px}
  .ocean-bar .search{width:100% !important;margin-left:0}
}

/* ── print ──────────────────────────────────────────────────────────── */
@media print{
  body{overflow:visible;background:#fff;color:#000}
  .rail,.topbar,.map-zoom,.map-top,.toasts,.dock-f{display:none !important}
  .app{display:block;height:auto}
  .view{position:static;overflow:visible;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  @page{size:A4 landscape;margin:10mm}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

</style>

<body>
<!-- ── boot veil ─────────────────────────────────────────────────────── -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-mark">
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M24 3.5 42.5 13v22L24 44.5 5.5 35V13Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M24 3.5 42.5 13 24 22.5 5.5 13Z" fill="currentColor" opacity=".18"/><path d="M24 22.5v22M5.5 13v22L24 44.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/></svg>
  </div>
  <div class="boot-txt"><b>HAHA ATLAS</b><span>正在装配路网与在途数据…</span></div>
</div>

<!-- ── shell ─────────────────────────────────────────────────────────── -->
<div class="app" id="app" hidden>
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="rail-brand">
      <svg class="rail-logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3.5 42.5 13v22L24 44.5 5.5 35V13Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 3.5 42.5 13 24 22.5 5.5 13Z" fill="currentColor" opacity=".22"/><path d="M24 22.5v22M5.5 13v22L24 44.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"/></svg>
      <div class="rail-brandtxt"><b>HAHA<span>ATLAS</span></b><i>美国大件物流指挥台</i></div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="rail-note">
        <span class="dot dot--amber"></span>
        <div><b>演示环境</b><i>全部数据为模拟样本，不可作为业务凭证。</i></div>
      </div>
      <div class="rail-build" id="railBuild">ATLAS 1.0 · 单文件离线版</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnRail" aria-label="打开导航">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="viewTitle">指挥总览</h1>
        <p id="viewSub">今日态势与网络负载</p>
      </div>
      <div class="topbar-actions">
        <div class="clock" title="推演时钟：所有时效、免期与窗口按此日期计算">
          <button class="icon-btn" id="btnPlay" aria-label="播放推演" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15" class="ico-play"><path d="M8 5.5v13l11-6.5Z" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 24" width="15" height="15" class="ico-pause" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <div class="clock-face">
            <span id="clockDate">2026-11-01</span>
            <small id="clockDay">周日 · 达拉斯 10:00</small>
          </div>
          <button class="icon-btn" id="btnAdvance" aria-label="推进一天">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 5.5v13l9-6.5Z" fill="currentColor"/><path d="M17 5v14" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <button class="ghost-btn" id="btnReset" title="恢复初始演示数据">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>重置</span>
        </button>

  const TODAY = '2026-11-01';

  function levelFactor(level, l4) {

  }
  function firstPrice(path, level, l4) {
    const card = path === 'B' ? RATE.direct : path === 'A' ? RATE.route : RATE.station;
    return Math.round(card.first * levelFactor(level, l4) / 5) * 5;
  }
  function extraPrice(path, level, l4) {
    const card = path === 'B' ? RATE.direct : path === 'A' ? RATE.route : RATE.station;
    return Math.round(card.extra * levelFactor(level, l4) / 5) * 5;
  }

  /**
   * Quote a path for an order-shaped object.
   * Returns null when the path cannot deliver the purchased scope.
   */
  function quote(o, path) {
    const m = MODELS[o.model];
    const units = o.units;
    const lines = [];
    let blocker = null;

    if (path === 'A') {
      if (o.l4) blocker = '楼梯 / 特殊通道：普通卡派不做专项搬运';
      else if (o.level === 'L3') blocker = 'L3 室内机位：普通货运止于月台或入口';
      else if (o.selfPickup) {
        lines.push({ k: '仓内装车（客户车）', amt: 35 * units, note: '客户自带适配车，我方仅装车' });
        lines.push({ k: '提货授权与仓口交接', amt: 0, note: '客户自担后段' });
        return { path, total: 35 * units, lines, blocker: null, feasibility: 'ok' };
      } else {
        lines.push({ k: '原仓出库', amt: RATE.outbound * units });
        lines.push({ k: '普通卡派 ' + (o.level === 'L2' ? '入口档' : '月台档'), amt: Math.round(Math.max(185, o.miles * 0.95)) });
        if (o.level === 'L2') lines.push({ k: '尾板 / 预约', amt: 45, note: '按实际动作另计' });
      }
      const total = A.sum(lines, (l) => l.amt);
      return { path, total, lines, blocker, feasibility: blocker ? 'blocked' : 'ok' };
    }

    if (path === 'B') {
      if (o.level === 'L3' && m.hin > 84) { /* still deliverable by white glove */ }
      lines.push({ k: '原仓出库', amt: RATE.outbound * units });
      const first = firstPrice('B', o.level, o.l4);
      const extra = extraPrice('B', o.level, o.l4);
      lines.push({ k: '直提首台 ' + LEVELS[o.level].code, amt: first, note: '含车组、工具、脱托拆箱、摆位调平清运' });
      if (units > 1) lines.push({ k: '同址加台 ×' + (units - 1), amt: extra * (units - 1) });
      lines.push({ k: '停车 / 站', amt: RATE.stop });
      if (o.l5) lines.push({ k: 'L5 技术启用（另单 T5）', amt: ADDONS.L5.fee * units });
      return { path, total: A.sum(lines, (l) => l.amt), lines, blocker: null, feasibility: 'ok' };
    }

    // C1 / C2 — 经授权站
    const linehaul = Math.round(Math.max(RATE.linehaulMin, o.miles * RATE.linehaulPerMile));
    lines.push({ k: '原仓出库', amt: RATE.outbound * units });
    lines.push({ k: '干线（原仓 → ' + (o.stationId || '授权站') + '）', amt: linehaul, note: 'BOL 收货人为授权站' });
    lines.push({ k: '收发 ' + RATE.stationHandling + ' ×' + units, amt: RATE.stationHandling * units });
    lines.push({ k: '短存 ' + RATE.storageDaysDefault + ' 天', amt: RATE.storagePerUnitDay * units * RATE.storageDaysDefault, note: '免期从站方验收日起算' });
    const sFirst = firstPrice('C2', o.level, o.l4), sExtra = extraPrice('C2', o.level, o.l4);
    lines.push({ k: '二程首台 ' + LEVELS[o.level].code, amt: sFirst, note: '站至最终机位' });
    if (units > 1) lines.push({ k: '二程加台 ×' + (units - 1), amt: sExtra * (units - 1) });
    lines.push({ k: '停车 / 站', amt: RATE.stop });
    if (o.l5) lines.push({ k: 'L5 技术启用（另单 T5）', amt: ADDONS.L5.fee * units });
    let total = A.sum(lines, (l) => l.amt);
    if (path === 'C1') {
      const prem = Math.round(total * (RATE.c1Premium - 1));
      lines.push({ k: '统包协作溢价 6%', amt: prem, note: '一份主委托覆盖三段，异常只找主承方' });
      total += prem;
    }
    return { path, total, lines, blocker: null, feasibility: 'ok' };
  }

  function feasiblePaths(o) {
    return ['A', 'B', 'C1', 'C2'].map((p) => ({ path: p, q: quote(o, p) }));
  }

  /* seeded generation ------------------------------------------------- */
  const rand = A.rng(20261101);

        else status = '待命';
      } else if (dayOffset <= 4) {
        if (st2 < 0.10) status = '已签收';
        else if (st2 < 0.26) status = '已派';
        else if (st2 < 0.38) status = '异常';

      orders.push(o);

  // a handful of long-haul cross-region orders
  [['DAL', 'New York', 'NY', '10001', 40.7506, -73.9972],

  /* ── 10. 海运航次 ─────────────────────────────────────────────────── */
  const ocean = [];
  const stagePlan = ['S01', 'S01', 'S02', 'S02', 'S02', 'S02', 'S03', 'S03', 'S03', 'S03', 'S04', 'S04', 'S04', 'REC', 'REC', 'REC'];

    const etaOffset = stage === 'S01' ? rand.int(20, 42) : stage === 'S02' ? rand.int(3, 16) : stage === 'S03' ? rand.int(-2, 2) : rand.int(-9, -3);
    const eta = A.dt.add(TODAY, etaOffset);

    const docs = {};
    DOCS.forEach(function (d, k) { docs[d.id] = k < docCount && !(rand.chance(0.07) && k < 8); });
    const s = {
      id: 'AT' + (2620 + i) + '-' + String(i + 1).padStart(2, '0'),
      lane, carrier: CARRIERS[i % CARRIERS.length], vessel: VESSELS[i % VESSELS.length],

    };

  const exceptions = [];

  excSeed.forEach(function (o, i) {
    const t = EXC_TYPES[i % EXC_TYPES.length];
    exceptions.push({
      id: 'EX' + (7100 + i),

        d.nodes.forEach(function (n) {

    /* ── camera helpers ─────────────────────────────────────────────── */
    api.focusOn = function (lon, lat, k) {
      const p = proj(lon, lat);
      view.k = A.clamp(k || 4, MIN_K, MAX_K);
      view.tx = VB.x + VB.w / 2 - p[0] * view.k;
      view.ty = VB.y + VB.h / 2 - p[1] * view.k;

    api.fitWindow = function () {

        '<div class="card"><div class="card-h"><h3>网络负载 <span class="k">按节点</span></h3><span class="sp"></span><button class="btn btn--sm btn--ghost" data-go="map">地图查看</button></div>' +

        A.charts.donut([
          { v: s.orders.filter((o) => o.level === 'L1').length, c: 'var(--blue)' },
          { v: s.orders.filter((o) => o.level === 'L2').length, c: 'var(--teal)' },

        ], { size: 118, thick: 12, center: s.orders.length, label: '总票数' }) +
        '<div style="display:grid;gap:7px;font-size:11.5px">' +
        legendDot('var(--blue)', 'L1 基础交接', s.orders.filter((o) => o.level === 'L1').length) +
        legendDot('var(--teal)', 'L2 入口交付', s.orders.filter((o) => o.level === 'L2').length) +
        legendDot('var(--amber)', 'L3 室内机位', s.orders.filter((o) => o.level === 'L3').length) +
        '</div></div></div>' +
        '</div></div>' +
        '<div class="card" style="margin-top:14px"><div class="card-h"><h3>今日队列 <span class="k">按窗口排序</span></h3><span class="sp"></span>' +
        '<span class="hint">点击一行进入地图定位</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>单号</th><th>目的地</th><th>设备</th><th>服务档</th><th>窗口</th><th class="r">B 直送全价</th></tr></thead>' +
        '<tbody>' + (qRows || '<tr><td colspan="6"><div class="empty"><b>队列已清空</b></div></td></tr>') + '</tbody></table></div></div>' +
        '<p class="hint" style="margin-top:12px;text-align:center">全部为演示数据。费率、服务档与作业码参照 V12 方案与公开区域报价整理，不代表任何一方的实际报价或承诺。</p>';
    },

    onResize: function () { }

  function thisDayToday(s) { return s.today; }
  function stat(lab, val, unit, tone, meta, hot) {

  }
  function legendDot(color, label, n) {
    return '<div style="display:flex;align-items:center;gap:7px"><i class="sw" style="background:' + color + '"></i>' +
      '<span style="color:var(--txt-2)">' + label + '</span><b class="num sp" style="text-align:right">' + n + '</b></div>';

<script>/* assets/js/view-map.js */
/* ==========================================================================
   view-map.js — 地图调度：点位、筛选、派车计划与窗口可行性
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;

  const STATUSES = ['待派', '待命', '已派', '执行中', '已签收', '异常'];
  const DRIVERS = ['M. Alvarez', 'J. Whitaker', 'R. Patel', 'D. Okafor', 'L. Nguyen', 'C. Ramirez'];
  const PLATES = ['TX-8842-KB', 'TX-2271-QD', 'CA-5510-MR', 'NJ-9930-TX', 'FL-4417-LP'];

  let engine = null;
  let view = null;

  /* ── helpers ─────────────────────────────────────────────────────── */
  function svcMinutes(o) {
    const base = o.level === 'L1' ? 18 : o.level === 'L2' ? 32 : 55;
    let m = base + (o.units - 1) * base * 0.45;
    if (o.l4) m += 40;
    if (o.l5) m += 65;
    return Math.round(m);
  }
  function driveMinutes(miles) {
    // conservative first-pass: 52 mph average on interstate + 12 min per 180 miles for rest/scale
    return Math.round((miles / 52) * 60 + Math.floor(miles / 180) * 12);
  }
  function hhmm(min) {
    const m = Math.max(0, Math.round(min));
    return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function toMin(hhmmStr) {
    const [h, m] = String(hhmmStr).split(':').map(Number);
    return h * 60 + (m || 0);
  }

  function planStops(originId, picks, strategy, state) {
    const origin = A.C.nodeById[originId];
    const pts = picks.map(function (id) { return state.orders.find((o) => o.id === id); }).filter(Boolean);
    if (strategy === 'nearest') {
      const rest = pts.slice(), seq = [];
      let cur = origin;
      while (rest.length) {
        let bi = 0, bd = Infinity;
        rest.forEach(function (o, i) {
          const d = A.geo.roadMiles(cur, o);
          if (d < bd) { bd = d; bi = i; }
        });
        seq.push(rest.splice(bi, 1)[0]);
        cur = seq[seq.length - 1];
      }
      return seq;
    }
    return pts.slice().sort(function (a, b) {
      const ka = a.window.date + ' ' + a.window.from, kb = b.window.date + ' ' + b.window.from;
      return ka.localeCompare(kb);
    });
  }

  function buildPlan(state, originId, stopIds, strategy) {
    const origin = A.C.nodeById[originId];
    if (!origin || !stopIds.length) return null;
    const seq = planStops(originId, stopIds, strategy, state);
    const legs = [];
    let clock = 8 * 60;           // 仓口可放货时刻（演示：08:00）
    let prev = origin, totalMiles = 0, totalDrive = 0, violations = 0, waitTotal = 0;

    seq.forEach(function (o, i) {
      const miles = Math.round(A.geo.roadMiles(prev, o));
      const drive = driveMinutes(miles);
      const arrive = clock + drive;
      const wFrom = toMin(o.window.from), wTo = toMin(o.window.to);
      let wait = 0, start = arrive;
      if (arrive < wFrom) { wait = wFrom - arrive; start = wFrom; }
      const svc = svcMinutes(o);
      const depart = start + svc;
      const late = start > wTo;
      const tight = !late && depart > wTo;
      if (late || tight) violations++;
      legs.push({
        idx: i + 1, order: o, from: i === 0 ? origin : seq[i - 1], to: o,
        miles, drive, arrive, start, depart, wait, svc,
        window: o.window, late, tight,
        slack: wTo - (start + svc)
      });
      totalMiles += miles; totalDrive += drive; waitTotal += wait;
      clock = depart;
      prev = o;
    });

    /* cost model: shared fixed cost + per-stop first unit + same-zip add-on */
    const stops = [];
    legs.forEach(function (l) {
      const z = l.to.zip;
      let st = stops.find((s) => s.zip === z);
      if (!st) stops.push(st = { zip: z, units: 0, orders: [], mileage: 0 });
      st.units += l.to.units;
      st.orders.push(l.to);
      st.mileage += l.miles;
    });
    const FIXED = 38, OUT = A.C.RATE.outbound, STOPFEE = A.C.RATE.stop;
    let single = 0, combined = 0;
    const lines = [];
    seq.forEach(function (o) {
      const q = A.pricing.quote(o, 'B');
      single += q.total + FIXED + OUT * (o.units - 1); // each trip repeats the fixed dispatch cost
    });
    stops.forEach(function (st) {
      const first = st.orders[0];
      const f = A.pricing.firstPrice('B', first.level, first.l4);
      const e = A.pricing.extraPrice('B', first.level, first.l4);
      const tech = A.sum(st.orders, (o) => (o.l5 ? A.C.ADDONS.L5.fee * o.units : 0));
      st.cost = OUT * st.units + f + e * (st.units - 1) + STOPFEE + tech;
      lines.push({
        zip: st.zip, city: first.city, units: st.units,
        first: f, extra: e, extraCount: st.units - 1, stop: STOPFEE,
        out: OUT * st.units, tech, total: st.cost,
        level: first.level, orders: st.orders
      });
      combined += st.cost;
    });
    combined += FIXED;

    const sameZipSaved = stops.reduce(function (a, st) {
      if (st.units < 2) return a;
      const f = A.pricing.firstPrice('B', st.orders[0].level, st.orders[0].l4);
      const e = A.pricing.extraPrice('B', st.orders[0].level, st.orders[0].l4);
      return a + (f - e) * (st.units - 1);
    }, 0);

    return {
      origin: originId, strategy, legs, lines,
      miles: totalMiles, drive: totalDrive, wait: waitTotal,
      finish: clock, violations,
      single: Math.round(single), combined: Math.round(combined),
      saved: Math.round(single - combined), sameZipSaved: Math.round(sameZipSaved),
      stops: seq.map((o) => o.id),
      units: A.sum(seq, (o) => o.units)
    };
  }

  /* ── dock renderers ──────────────────────────────────────────────── */
  function renderTabs(s, tab) {
    const tabs = [['plan', '派车计划'], ['orders', '订单池'], ['nodes', '节点']];
    return '<div class="dock-tabs">' + tabs.map(function (t) {
      return '<button data-act="tab" data-tab="' + t[0] + '" aria-pressed="' + (tab === t[0]) + '">' + t[1] +
        (t[0] === 'plan' && s.draft.stops.length ? ' <span class="tag tag--amber" style="height:15px;padding:0 4px;font-size:9px">' + s.draft.stops.length + '</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  function renderPlanTab(s) {
    const origin = A.C.nodeById[s.draft.origin];
    const plan = s.draft.plan;
    const candidates = s.orders.filter(function (o) {
      return o.nodeId === s.draft.origin && (o.status === '待派' || o.status === '待命') && !s.draft.stops.includes(o.id);
    }).sort(function (a, b) { return (a.window.date + a.window.from).localeCompare(b.window.date + b.window.from); });

    let out = '';

    /* origin */
    out += '<div><div class="sec-t">起运仓<span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0">' + (origin ? origin.city + ' ' + origin.zip : '') + '</span></div>' +
      '<select class="select" data-act="origin" style="width:100%">' +
      A.C.NODES.map(function (n) {
        const kind = n.kind === 'inv' ? '库存仓' : '区域站';
        return '<option value="' + n.id + '"' + (n.id === s.draft.origin ? ' selected' : '') + '>' + n.id + ' · ' + n.name + '（' + kind + '）</option>';
      }).join('') + '</select></div>';

    /* selected stops */
    if (s.draft.stops.length) {
      out += '<div><div class="sec-t">已选站点<span class="sp"></span><button class="btn btn--sm btn--ghost" data-act="clear-plan">清空</button></div>' +
        '<div class="stack" style="gap:6px">' + s.draft.stops.map(function (id, i) {
          const o = s.orders.find((x) => x.id === id);
          if (!o) return '';
          return '<div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-soft)">' +
            '<b class="num" style="width:15px;height:15px;border-radius:4px;background:var(--amber);color:#221503;display:grid;place-items:center;font-size:9.5px">' + (i + 1) + '</b>' +
            '<div style="flex:1;min-width:0"><div style="font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + o.city + ' ' + o.zip + '</div>' +
            '<div style="font-size:10px;color:var(--txt-3)">' + o.model + ' ×' + o.units + ' · ' + o.level + ' · ' + dt.mmdd(o.window.date) + ' ' + o.window.from + '</div></div>' +
            '<button class="icon-btn" style="width:22px;height:22px" data-act="remove-stop" data-id="' + o.id + '" aria-label="移除">✕</button></div>';
        }).join('') + '</div></div>';

      /* strategy */
      out += '<div class="row" style="gap:6px"><span class="muted" style="font-size:10.5px">站序</span>' +
        '<div class="seg"><button data-act="strategy" data-v="window" aria-pressed="' + (s.draft.order === 'window') + '">按窗口</button>' +
        '<button data-act="strategy" data-v="nearest" aria-pressed="' + (s.draft.order === 'nearest') + '">最近邻</button></div>' +
        '<span class="sp"></span><span class="hint">最多 5 站</span></div>';
    }

    /* result */
    if (plan) {
      const bad = plan.violations > 0;
      out += '<div class="card" style="background:var(--panel-2)"><div class="card-h" style="padding:9px 11px"><h3 style="font-size:11.5px">线路核算</h3><span class="sp"></span>' +
        '<span class="tag ' + (bad ? 'tag--red' : 'tag--green') + '">' + (bad ? plan.violations + ' 站窗口冲突' : '窗口可行') + '</span></div>' +
        '<div class="card-b card-b--tight">' +
        '<div class="row" style="gap:14px;margin-bottom:9px">' +
        numBlock(fmt.n(plan.miles) + ' mi', '总里程') +
        numBlock(fmt.dur(plan.drive), '纯行驶') +
        numBlock(fmt.dur(plan.wait), '窗口等待') +
        numBlock(hhmm(plan.finish), '预计收车') +
        '</div>' +
        '<table class="tbl" style="font-size:11px"><thead><tr><th>#</th><th>到达</th><th>窗口</th><th class="r">里程</th><th>状态</th></tr></thead><tbody>' +
        plan.legs.map(function (l) {
          const st = l.late ? '<span class="tag tag--red">迟到</span>' : l.tight ? '<span class="tag tag--amber">超窗</span>' : l.wait > 0 ? '<span class="tag tag--plain">等窗</span>' : '<span class="tag tag--green">可签</span>';
          return '<tr><td class="num">' + l.idx + '</td><td class="num">' + hhmm(l.arrive) + '</td>' +
            '<td class="num muted">' + l.window.from + '–' + l.window.to + '</td>' +
            '<td class="r num">' + l.miles + '</td><td>' + st + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="divide"></div>' +
        '<div class="kv" style="font-size:11px">' +
        '<dt>分票直送合计</dt><dd>' + fmt.usd(plan.single) + '</dd>' +
        '<dt>合车一趟合计</dt><dd style="color:var(--teal)">' + fmt.usd(plan.combined) + '</dd>' +
        '<dt>其中同址加台省</dt><dd>' + fmt.usd(plan.sameZipSaved) + '</dd>' +
        '<dt style="font-weight:650;color:var(--txt)">差额</dt><dd style="font-weight:700;color:' + (plan.saved > 0 ? 'var(--teal)' : 'var(--red)') + '">' + (plan.saved > 0 ? '+' : '') + fmt.usd(plan.saved) + '</dd>' +
        '</div>' +
        '<p class="hint" style="margin-top:8px">合车只在同址加台与共享车组固定成本上生成差额；跨址的逐站费照付，不能拿两辆专车价当基线。</p>' +
        '</div></div>';
      if (bad) {
        out += '<div style="display:flex;gap:8px;padding:9px 10px;border-radius:8px;background:var(--red-soft);border:1px solid rgba(255,107,107,.28)">' +
          '<span class="dot dot--red"></span><div style="font-size:11px;line-height:1.5">存在超窗站点：硬窗站点应拆线或改约；软窗须先取得客户书面同意，且不破原承诺。</div></div>';
      }
      out += '<button class="btn btn--prime" style="width:100%;height:34px" data-act="gen-plan">生成派车单 · ' + plan.stops.length + ' 站 ' + plan.units + ' 台</button>';
    } else {
      out += '<div class="empty"><b>还没有选站</b><span>从下方候选订单中点选，最多 5 站</span></div>';
    }

    /* candidates */
    out += '<div><div class="sec-t">候选订单 <span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0">' + candidates.length + ' 票</span></div>' +
      '<div class="stack" style="gap:6px">' + (candidates.slice(0, 14).map(function (o) {
        const late = dt.diff(s.today, o.window.date) < 0;
        return '<button data-act="pick-order" data-id="' + o.id + '" style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-soft);text-align:left;width:100%">' +
          '<span style="width:15px;height:15px;border-radius:4px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:9px;color:var(--txt-3)">+</span>' +
          '<div style="flex:1;min-width:0"><div style="font-size:11.5px;font-weight:560">' + o.city + ' <span class="muted">' + o.zip + '</span>' +
          (o.hard ? ' <span class="tag tag--red" style="height:14px;padding:0 3px;font-size:8.5px">硬</span>' : '') + '</div>' +
          '<div style="font-size:10px;color:' + (late ? 'var(--red)' : 'var(--txt-3)') + '">' + o.model + ' ×' + o.units + ' · ' + A.C.LEVELS[o.level].code + (o.l4 ? '+L4' : '') + ' · ' + dt.mmdd(o.window.date) + ' ' + o.window.from + '–' + o.window.to + '</div></div>' +
          '<span class="num" style="font-size:10.5px;color:var(--txt-3)">' + o.miles + 'mi</span></button>';
      }).join('') || '<div class="empty"><b>该仓没有待派订单</b><span>换一个起运仓或推进时钟</span></div>') + '</div></div>';

    /* dispatched trucks */
    const trucks = (s.trucks || []).filter((t) => t.origin === s.draft.origin);
    if (trucks.length) {
      out += '<div><div class="sec-t">本仓已排线 <span class="sp"></span><span class="muted" style="text-transform:none;letter-spacing:0">' + trucks.length + '</span></div>' +
        trucks.map(function (t) {
          return '<button data-act="load-truck" data-id="' + t.id + '" style="width:100%;text-align:left;padding:8px 9px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-soft);margin-bottom:5px">' +
            '<div style="display:flex;align-items:center;gap:7px"><b class="mono" style="font-size:10.5px">' + t.id + '</b><span class="sp"></span><span class="tag tag--teal">' + t.stops.length + ' 站</span></div>' +
            '<div style="font-size:10.5px;color:var(--txt-3);margin-top:2px">' + t.driver + ' · ' + t.plate + ' · 08:00 发车 · ' + fmt.n(t.miles) + ' mi</div></button>';
        }).join('') + '</div>';
    }
    return out;
  }

  function renderOrdersTab(s, selId) {
    const list = s.orders.slice().sort(function (a, b) {
      const rank = { 异常: 0, 待派: 1, 待命: 2, 执行中: 3, 已派: 4, 已签收: 5 };
      return (rank[a.status] - rank[b.status]) || (a.window.date + a.window.from).localeCompare(b.window.date + b.window.from);
    });
    return '<div class="row" style="gap:6px"><div class="search" style="flex:1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>' +
      '<input class="input" id="mapOrderSearch" placeholder="搜单号 / 城市 / ZIP"></div></div>' +
      '<div class="stack" style="gap:5px" id="mapOrderList">' + list.map(function (o) {
        const sel = o.id === selId;
        return '<button data-act="sel-order" data-id="' + o.id + '" style="display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 9px;border-radius:7px;background:' + (sel ? 'var(--amber-soft)' : 'var(--panel-2)') + ';border:1px solid ' + (sel ? 'rgba(245,165,36,.4)' : 'var(--line-soft)') + ';text-align:left;width:100%">' +
          '<div style="min-width:0"><div style="font-size:11.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + o.city + ' <span class="muted">' + o.st + ' ' + o.zip + '</span></div>' +
          '<div style="font-size:10px;color:var(--txt-3)">' + o.id + ' · ' + o.model + '×' + o.units + ' · ' + A.C.LEVELS[o.level].code + '</div></div>' +
          '<span class="tag tag--' + statusTone(o.status) + '" style="align-self:center">' + o.status + '</span></button>';
      }).join('') + '</div>';
  }

  function renderNodesTab(s) {
    return '<div class="stack" style="gap:8px">' + A.C.NODES.map(function (n) {
      const list = s.orders.filter((o) => o.nodeId === n.id);
      const open = list.filter((o) => o.status === '待派' || o.status === '待命').length;
      const inv = A.sum(list.filter((o) => o.status !== '已签收'), (o) => o.units);
      return '<div class="card" style="background:var(--panel-2)"><div class="card-b card-b--tight">' +
        '<div style="display:flex;align-items:center;gap:7px"><b style="font-size:12px">' + n.id + '</b>' +
        '<span class="tag ' + (n.kind === 'inv' ? 'tag--amber' : 'tag--violet') + '">' + (n.kind === 'inv' ? '库存仓' : '区域站') + '</span>' +
        '<span class="sp"></span><span class="muted" style="font-size:10px">' + n.city + ' ' + n.zip + '</span></div>' +
        '<div style="font-size:10.5px;color:var(--txt-3);margin-top:4px">' + n.caps.join(' · ') + '</div>' +
        '<div class="row" style="gap:12px;margin-top:7px">' +
        numBlock(list.length, '票') + numBlock(open, '待派') + numBlock(inv, '台') +
        numBlock(n.kind === 'inv' ? '自有' : 'LXD / LongRoad', '承接') +
        '</div></div></div>';
    }).join('') + '</div>';
  }

  function statusTone(st) {
    return st === '异常' ? 'red' : st === '已签收' ? 'green' : st === '执行中' ? 'teal' : st === '已派' ? 'blue' : st === '待命' ? 'violet' : 'amber';
  }
  function numBlock(v, k) {
    return '<div style="line-height:1.2"><div class="num" style="font-size:14px;font-weight:700">' + v + '</div><div style="font-size:9.5px;color:var(--txt-3)">' + k + '</div></div>';
  }

  /* floating selection card */
  function renderSelCard(s) {
    const sel = s.ui.sel;
    if (!sel || sel.type !== 'order') return '';
    const o = s.orders.find((x) => x.id === sel.id);
    if (!o) return '';
    const node = A.C.nodeById[o.nodeId];
    const qB = A.pricing.quote(o, 'B');
    const qC = A.pricing.quote(o, 'C2');
    const qA = A.pricing.quote(o, 'A');
    const inPlan = s.draft.stops.includes(o.id);
    return '<div class="map-panel" style="position:absolute;left:12px;top:58px;width:268px;padding:11px 12px;display:grid;gap:9px">' +
      '<div style="display:flex;align-items:flex-start;gap:8px">' +
      '<div><div class="mono" style="font-size:10px;color:var(--txt-3)">' + o.id + '</div>' +
      '<div style="font-size:13px;font-weight:680;line-height:1.25;margin-top:1px">' + o.city + ' ' + o.st + ' ' + o.zip + '</div>' +
      '<div style="font-size:10.5px;color:var(--txt-3)">起运 ' + node.id + ' · ' + fmt.n(o.miles) + ' mi</div></div>' +
      '<span class="sp"></span><button class="icon-btn" style="width:22px;height:22px" data-act="close-sel">✕</button></div>' +
      '<div class="row row--tight">' +
      '<span class="tag tag--plain">' + o.model + ' ×' + o.units + '</span>' +
      '<span class="tag tag--amber">' + A.C.LEVELS[o.level].code + ' ' + A.C.LEVELS[o.level].short + '</span>' +
      (o.l4 ? '<span class="tag tag--violet">L4</span>' : '') + (o.l5 ? '<span class="tag tag--teal">L5</span>' : '') +
      '<span class="tag tag--' + statusTone(o.status) + '">' + o.status + '</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;font-size:10.5px">' +
      priceCell('A', qA) + priceCell('B', qB) + priceCell('C2', qC) + '</div>' +
      '<div style="font-size:10.5px;color:var(--txt-3)">窗口 ' + dt.mmdd(o.window.date) + ' ' + o.window.from + '–' + o.window.to + (o.hard ? ' · <b style="color:var(--red)">硬窗</b>' : ' · 软窗') + ' · 作业 ' + svcMinutes(o) + ' 分</div>' +
      '<div class="row" style="gap:6px">' +
      (inPlan ? '<button class="btn btn--sm" style="flex:1" data-act="remove-stop" data-id="' + o.id + '">移出计划</button>'
        : '<button class="btn btn--prime btn--sm" style="flex:1" data-act="add-stop" data-id="' + o.id + '">加入派车计划</button>') +
      '<button class="btn btn--sm btn--ghost" data-act="focus" data-id="' + o.id + '">放大</button></div></div>';
  }
  function priceCell(p, q) {
    return '<div style="padding:5px 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-soft)' + (q && q.feasibility === 'blocked' ? ';opacity:.6' : '') + '">' +
      '<div style="font-size:9.5px;color:var(--txt-3)">' + p + '</div><div class="num" style="font-weight:650">' + (q ? fmt.usd(q.total) : '—') + '</div></div>';
  }

  /* ── view ────────────────────────────────────────────────────────── */
  A.registerView('map', {
    title: '地图调度',
    sub: '点位、站序与窗口可行性 · 点击订单加入派车计划',
    flush: true,

    mount: function (host, s) {
      host.innerHTML =
        '<div class="map-shell">' +
        '<div class="map-stage" id="mapStage">' +
        '<div id="mapSvgHost" style="position:absolute;inset:0"></div>' +
        '<div id="mapSel"></div>' +
        '<div class="map-top">' +
        '<div class="map-panel map-filters">' +
        '<div class="seg" id="mapLevelSeg">' +
        '<button data-act="level" data-v="ALL" aria-pressed="' + (s.ui.mapLevel === 'ALL') + '">全部</button>' +
        '<button data-act="level" data-v="L1" aria-pressed="' + (s.ui.mapLevel === 'L1') + '">L1</button>' +
        '<button data-act="level" data-v="L2" aria-pressed="' + (s.ui.mapLevel === 'L2') + '">L2</button>' +
        '<button data-act="level" data-v="L3" aria-pressed="' + (s.ui.mapLevel === 'L3') + '">L3</button>' +
        '</div>' +
        '<div class="seg" id="mapColorSeg">' +
        '<button data-act="color" data-v="status" aria-pressed="' + (s.ui.mapColor !== 'level') + '">按状态</button>' +
        '<button data-act="color" data-v="level" aria-pressed="' + (s.ui.mapColor === 'level') + '">按服务档</button>' +
        '</div>' +
        '<span style="width:1px;height:20px;background:var(--line)"></span>' +
        '<button class="pill' + (s.ui.mapLayers.lanes !== false ? ' is-on' : '') + '" data-act="layer" data-v="lanes">海运航线</button>' +
        '<button class="pill' + (s.ui.mapLayers.zones ? ' is-on' : '') + '" data-act="layer" data-v="zones">150 mi 圈</button>' +
        '<button class="pill' + (s.ui.mapLayers.pins !== false ? ' is-on' : '') + '" data-act="layer" data-v="pins">订单点</button>' +
        '<button class="pill' + (s.ui.mapLayers.roads !== false ? ' is-on' : '') + '" data-act="layer" data-v="roads">路网</button>' +
        '</div></div>' +
        '<div class="map-legend map-panel" id="mapLegend"></div>' +
        '<div class="map-zoom map-panel">' +
        '<button data-act="zoom" data-v="in" aria-label="放大">+</button>' +
        '<button data-act="zoom" data-v="out" aria-label="缩小">−</button>' +
        '<button data-act="zoom" data-v="fit" aria-label="复位" style="font-size:11px">⤢</button>' +
        '</div>' +
        '<div class="map-hint">滚轮缩放 · 拖动平移 · 双击放大 · 点击点位看详情</div>' +
        '</div>' +
        '<div class="dock" id="mapDock">' +
        '<div class="dock-h"><h2>调度台</h2><span class="sp"></span><span class="hint" id="dockCount"></span></div>' +
        '<div id="dockTabs"></div><div class="dock-b" id="dockBody"></div><div class="dock-f" id="dockFoot"></div>' +
        '</div></div>';

      engine = A.MapEngine(document.getElementById('mapSvgHost'), {
        onSelect: function (type, id) {
          if (type === 'order') {
            s.ui.sel = { type: 'order', id: id };
            s.ui.dockTab = 'orders';
            A.store.emit();
          } else if (type === 'node') {
            s.draft.origin = id;
            s.draft.plan = s.draft.stops.length ? buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order) : null;
            A.store.emit();
            A.toast('起运仓切换为 ' + id, 'teal');
          } else if (type === 'port') {
            A.router.go('ocean', { port: id });
          } else {
            s.ui.sel = null;
            A.store.emit();
          }
        },
        onHover: function (t) {
          if (!t) { A.tip.hide(); return; }
          if (t.type === 'order') {
            const o = s.orders.find((x) => x.id === t.id);
            if (o) A.tip.show('<b>' + o.city + ' ' + o.zip + '</b><br>' + o.model + ' ×' + o.units + ' · ' + A.C.LEVELS[o.level].code +
              '<br>' + o.status + ' · ' + dt.mmdd(o.window.date) + ' ' + o.window.from, t.evt.clientX, t.evt.clientY);
          } else if (t.type === 'node') {
            const n = A.C.nodeById[t.id];
            if (n) A.tip.show('<b>' + n.id + ' ' + n.name + '</b><br>' + n.city + ' ' + n.zip + '<br>' + n.caps.join(' · '), t.evt.clientX, t.evt.clientY);
          } else if (t.type === 'port') {
            const p = A.C.PORTS[t.id];
            if (p) A.tip.show('<b>' + p.code + ' ' + p.name + '</b><br>' + p.en, t.evt.clientX, t.evt.clientY);
          }
        }
      });

      const dock = document.getElementById('mapDock');
      dock.addEventListener('click', onDockClick);
      dock.addEventListener('change', onDockChange);
      host.addEventListener('click', function (e) {
        const t = e.target.closest('[data-act]');
        if (t) onStageClick(e, t);
      });
      document.getElementById('dockBody').addEventListener('input', function (e) {
        if (e.target.id === 'mapOrderSearch') filterOrderList(e.target.value);
      });

      view = this;
      this._s = s;
    },

    update: function (s, params) {
      if (!engine) return;
      this._s = s;
      if (params && params.o) {
        const o = s.orders.find((x) => x.id === params.o);
        if (o) { s.ui.sel = { type: 'order', id: o.id }; s.ui.dockTab = 'orders'; engine.focusOn(o.lng, o.lat, 4.2); }
      }

      const tab = s.ui.dockTab || 'plan';
      document.getElementById('dockTabs').innerHTML = renderTabs(s, tab);
      const body = document.getElementById('dockBody');
      const scrollTop = body.scrollTop;
      body.innerHTML = tab === 'plan' ? renderPlanTab(s) : tab === 'orders' ? renderOrdersTab(s, s.ui.sel && s.ui.sel.id) : renderNodesTab(s);
      body.scrollTop = scrollTop;

      const open = s.orders.filter((o) => o.status === '待派' || o.status === '待命').length;
      document.getElementById('dockCount').textContent = '待派 ' + open + ' · 在途 ' + s.orders.filter((o) => o.status === '已派' || o.status === '执行中').length;
      document.getElementById('dockFoot').innerHTML =
        '<button class="btn btn--sm btn--ghost" style="flex:1" data-act="zoom" data-v="fit">全美视图</button>' +
        '<button class="btn btn--sm" style="flex:1" data-act="focus-origin">定位起运仓</button>';

      document.getElementById('mapSel').innerHTML = renderSelCard(s);

      /* legend */
      const byLevel = s.ui.mapColor === 'level';
      const items = byLevel
        ? [['var(--blue)', 'L1 基础交接'], ['var(--teal)', 'L2 入口交付'], ['var(--amber)', 'L3 室内机位']]
        : [['var(--amber)', '待派'], ['var(--violet)', '待命 / 已锁货'], ['var(--blue)', '已派'], ['var(--teal)', '执行中'], ['var(--green)', '已签收'], ['var(--red)', '异常']];
      document.getElementById('mapLegend').innerHTML =
        '<div style="font-size:9.5px;letter-spacing:.12em;color:var(--txt-3);text-transform:uppercase;margin-bottom:1px">图例</div>' +
        items.map(function (i) { return '<div class="li"><i class="sw" style="background:' + i[0] + '"></i>' + i[1] + '</div>'; }).join('') +
        '<div class="li" style="margin-top:3px;padding-top:5px;border-top:1px solid var(--line-soft)"><i class="sw" style="background:var(--amber);border-radius:50%"></i>库存仓</div>' +
        '<div class="li"><i class="sw" style="background:var(--violet);border-radius:50%"></i>区域站</div>' +
        '<div class="li"><i class="sw" style="background:var(--teal);border-radius:50%"></i>港口</div>';

      const lvl = s.ui.mapLevel || 'ALL';
      const orders = s.orders.filter((o) => lvl === 'ALL' || o.level === lvl);
      engine.render({
        state: s, orders: orders, nodes: A.C.NODES, ocean: s.ocean,
        draft: s.draft, filter: {}, colorBy: s.ui.mapColor || 'status'
      });
      if (s.ui.sel && s.ui.sel.id) engine.select('order', s.ui.sel.id);
    },

    onResize: function () { }
  });

  /* ── handlers ────────────────────────────────────────────────────── */
  function onStageClick(e, t) {
    const s = view._s, act = t.dataset.act;
    if (act === 'level') { s.ui.mapLevel = t.dataset.v; A.store.emit(); }
    else if (act === 'color') { s.ui.mapColor = t.dataset.v; A.store.emit(); }
    else if (act === 'layer') {
      const k = t.dataset.v;
      s.ui.mapLayers = s.ui.mapLayers || {};
      s.ui.mapLayers[k] = s.ui.mapLayers[k] === false ? true : false;
      A.store.emit();
    } else if (act === 'zoom') {
      if (t.dataset.v === 'fit') engine.fitWindow();
      else engine.zoom(t.dataset.v === 'in' ? 1.5 : 0.66);
    } else if (act === 'close-sel') { s.ui.sel = null; A.store.emit(); }
    else if (act === 'add-stop') { addStop(t.dataset.id); }
    else if (act === 'remove-stop') { removeStop(t.dataset.id); }
    else if (act === 'focus') {
      const o = s.orders.find((x) => x.id === t.dataset.id);
      if (o) engine.focusOn(o.lng, o.lat, 4.5);
    } else if (act === 'focus-origin') {
      const n = A.C.nodeById[s.draft.origin];
      if (n) engine.focusOn(n.lng, n.lat, 3.4);
    }
  }

  function onDockClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const s = view._s, act = t.dataset.act, id = t.dataset.id;
    if (act === 'tab') { s.ui.dockTab = t.dataset.tab; A.store.emit(); }
    else if (act === 'pick-order' || act === 'add-stop') { addStop(id); }
    else if (act === 'remove-stop') { removeStop(id); }
    else if (act === 'clear-plan') {
      s.draft.stops = []; s.draft.plan = null; A.store.emit();
    } else if (act === 'strategy') {
      s.draft.order = t.dataset.v;
      if (s.draft.stops.length) s.draft.plan = buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order);
      A.store.emit();
    } else if (act === 'gen-plan') {
      genPlan();
    } else if (act === 'sel-order') {
      const o = s.orders.find((x) => x.id === id);
      s.ui.sel = { type: 'order', id };
      A.store.emit();
      if (o) engine.focusOn(o.lng, o.lat, Math.max(4, engine.view.k));
    } else if (act === 'load-truck') {
      const tr = (s.trucks || []).find((x) => x.id === id);
      if (tr) {
        s.draft.origin = tr.origin; s.draft.stops = tr.stops.slice();
        s.draft.plan = buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order);
        A.store.emit();
        A.toast('已载入派车单 ' + id, 'teal');
      }
    } else if (act === 'zoom') {
      if (t.dataset.v === 'fit') engine.fitWindow();
      else engine.zoom(t.dataset.v === 'in' ? 1.5 : 0.66);
    } else if (act === 'focus-origin') {
      const n = A.C.nodeById[s.draft.origin];
      if (n) engine.focusOn(n.lng, n.lat, 3.4);
    }
  }

  function onDockChange(e) {
    const s = view._s;
    if (e.target.dataset.act === 'origin') {
      s.draft.origin = e.target.value;
      s.draft.stops = s.draft.stops.filter(function (id) {
        const o = s.orders.find((x) => x.id === id);
        return o && o.nodeId === s.draft.origin;
      });
      s.draft.plan = s.draft.stops.length ? buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order) : null;
      const n = A.C.nodeById[s.draft.origin];
      if (n) engine.focusOn(n.lng, n.lat, 3.2);
      A.store.emit();
    }
  }

  function addStop(id) {
    const s = view._s;
    if (s.draft.stops.includes(id)) return;
    if (s.draft.stops.length >= 5) { A.toast('一趟最多 5 站，先移除或改线', 'red'); return; }
    const o = s.orders.find((x) => x.id === id);
    if (!o) return;
    if (o.nodeId !== s.draft.origin) {
      s.draft.origin = o.nodeId;
      s.draft.stops = [];
      A.toast('起运仓已切换为 ' + o.nodeId, 'amber');
    }
    s.draft.stops.push(id);
    s.draft.plan = buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order);
    s.ui.dockTab = 'plan';
    A.store.emit();
  }
  function removeStop(id) {
    const s = view._s;
    s.draft.stops = s.draft.stops.filter((x) => x !== id);
    s.draft.plan = s.draft.stops.length ? buildPlan(s, s.draft.origin, s.draft.stops, s.draft.order) : null;
    A.store.emit();
  }

  function genPlan() {
    const s = view._s, plan = s.draft.plan;
    if (!plan) return;
    if (plan.violations > 0 && !confirm('计划中有 ' + plan.violations + ' 个站点存在窗口冲突。\n硬窗站点应先拆线或改约；确认要按当前计划生成派车单吗？')) return;
    const id = 'TR-' + String(2400 + (s.trucks || []).length + 1);
    const truck = {
      id, origin: plan.origin, stops: plan.stops.slice(),
      legs: plan.legs.map((l) => ({ to: l.to.id, arrive: hhmm(l.arrive), depart: hhmm(l.depart), miles: l.miles })),
      miles: plan.miles, cost: plan.combined, units: plan.units,
      driver: DRIVERS[(s.trucks || []).length % DRIVERS.length],
      plate: PLATES[(s.trucks || []).length % PLATES.length],
      depart: s.today + ' 08:00',
      status: '已排线'
    };
    s.trucks = s.trucks || [];
    s.trucks.push(truck);
    plan.stops.forEach(function (oid) {
      const o = s.orders.find((x) => x.id === oid);
      if (o && (o.status === '待派' || o.status === '待命')) { o.status = '已派'; o.path = 'B'; o.agreed = null; o.truckId = id; }
    });
    s.draft.stops = []; s.draft.plan = null; s.ui.sel = null;
    A.store.set({ trucks: s.trucks, orders: s.orders, draft: s.draft });
    A.toast('已生成派车单 ' + id + ' · ' + truck.stops.length + ' 站 ' + truck.units + ' 台 · ' + fmt.usd(truck.cost), 'teal');
  }

  function filterOrderList(q) {
    q = (q || '').trim().toLowerCase();
    document.querySelectorAll('#mapOrderList > button').forEach(function (b) {
      const txt = b.textContent.toLowerCase();
      b.style.display = !q || txt.includes(q) ? '' : 'none';
    });
  }
})(window);

</script>
<script>/* assets/js/view-ocean.js */
/* ==========================================================================
   view-ocean.js — 海运在途看板（S01→S04 → 入仓）
   ========================================================================== */
(function (w) {
  'use strict';
  const A = w.A, fmt = A.fmt, dt = A.dt;
  const STAGES = A.C.OCEAN_STAGES;

  function stageIdx(id) { return STAGES.findIndex((s) => s.id === id); }
  function etaOf(s) { return s.actualEta || s.eta; }
  function freeLeft(s, today) { return s.freeDays - dt.diff(etaOf(s), today); }
  function daysTo(s, today) { return dt.diff(today, etaOf(s)); }
  function tone(s, today) {
    const left = freeLeft(s, today);
    if (s.stage === 'REC') return 'ok';
    if (left < 0) return 'crit';
    if (left <= 2) return 'warn';
    return 'ok';
  }

  function kpis(s) {
    const live = s.ocean.filter((x) => x.stage !== 'REC');
    const sea = s.ocean.filter((x) => x.stage === 'S02').reduce((a, x) => a + x.units, 0);
    const demo = live.filter((x) => tone(x, s.today) !== 'ok');
    const missDocs = s.ocean.reduce((a, x) => a + A.oceanDoc(x).missingDue.length, 0);
    const drift = s.ocean.filter((x) => x.actualEta).map((x) => dt.diff(x.eta, x.actualEta));
    const avg = drift.length ? drift.reduce((a, b) => a + b, 0) / drift.length : 0;
